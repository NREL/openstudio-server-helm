# A simple example of ClusterConfig object with two nodegroups:
--- 
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: openstudio-server-03
  region: us-west-2
  version: "1.34"

vpc:
  cidr: 192.168.0.0/16
  autoAllocateIPv6: true
  clusterEndpoints:
    privateAccess: true
  subnets:
    private:
      us-west-2a:
        id: "subnet-02213ae644f5f392e"
      us-west-2b:
        id: "subnet-081506cc8b6d3dbb2"
iam:
  withOIDC: true
  serviceAccounts:
  - metadata:
      name: ebs-csi-controller-sa
      namespace: kube-system
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:
  - name: Web-node-group2
    amiType: Bottlerocket_x86_64
    instanceType: m7i.8xlarge
    minSize: 0
    maxSize: 2
    desiredCapacity: 2
    labels:
      nodegroup: web-group
    privateNetworking: true
    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: true
        certManager: true
        ebs: true
    ssh:
      allow: true
      # Update publicKeyPath for your public key
      publicKeyPath: ~/.ssh/id_rsa_179d.pub
    availabilityZones: ["us-west-2b"]
    volumeSize: 750
    volumeType: gp3
    tags:
      'org': 'nrel179d'
      'billingId': '230030'
    updateConfig:
      maxUnavailable: 1  # Or use maxUnavailablePercentage

  - name: worker-node-group-spot-2a
    amiType: Bottlerocket_x86_64
    instanceTypes: ["c7i.48xlarge", "c7a.48xlarge", "c7i.metal-48xl", "c7a.metal-48xl"]
    minSize: 0
    maxSize: 20
    desiredCapacity: 0
    maxPodsPerNode: 360
    registryQps: 0
    labels:
      nodegroup: worker-group
    privateNetworking: true
    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: true
        certManager: true
        ebs: true
    spot: true
    ssh:
      allow: true
      # Update publicKeyPath for your public key
      publicKeyPath: ~/.ssh/id_rsa_179d.pub
    # availabilityZones: ["us-west-2a"]
    subnets:
      - subnet-08a05df026b4ec9a8
      - subnet-00ea3f10afdc9fb8e
    volumeSize: 1500
    volumeType: gp3
    tags:
      'org': 'nrel179d'
      'billingId': '230030'
    updateConfig:
      maxUnavailable: 1  # Or use maxUnavailablePercentage

  - name: worker-node-group-spot-2c
    amiType: Bottlerocket_x86_64
    instanceTypes: ["c7i.48xlarge", "c7a.48xlarge", "c7i.metal-48xl", "c7a.metal-48xl"]
    minSize: 0
    maxSize: 20
    desiredCapacity: 0
    maxPodsPerNode: 360
    registryQps: 0
    labels:
      nodegroup: worker-group
    privateNetworking: true
    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: true
        certManager: true
        ebs: true
    spot: true
    ssh:
      allow: true
      # Update publicKeyPath for your public key
      publicKeyPath: ~/.ssh/id_rsa_179d.pub
    # availabilityZones: ["us-west-2c"]
    subnets:
      - subnet-00c5a82bb58556223
      - subnet-0027c0fd03f5cb2bb
    volumeSize: 1500
    volumeType: gp3
    tags:
      'org': 'nrel179d'
      'billingId': '230030'
    updateConfig:
      maxUnavailable: 1  # Or use maxUnavailablePercentage

  - name: worker-node-group-spot-2d
    amiType: Bottlerocket_x86_64
    instanceTypes: ["c7i.48xlarge", "c7a.48xlarge", "c7i.metal-48xl", "c7a.metal-48xl"]
    minSize: 0
    maxSize: 20
    desiredCapacity: 0
    maxPodsPerNode: 360
    registryQps: 0
    labels:
      nodegroup: worker-group
    privateNetworking: true
    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: true
        certManager: true
        ebs: true
    spot: true
    ssh:
      allow: true
      # Update publicKeyPath for your public key
      publicKeyPath: ~/.ssh/id_rsa_179d.pub
    # availabilityZones: ["us-west-2d"]
    subnets:
      - subnet-04bbcd385d4d482cc
    volumeSize: 1500
    volumeType: gp3
    tags:
      'org': 'nrel179d'
      'billingId': '230030'
    updateConfig:
      maxUnavailable: 1  # Or use maxUnavailablePercentage

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:      # add IAM and service account
      ebsCSIController: true