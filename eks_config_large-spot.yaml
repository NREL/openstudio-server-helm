# A simple example of ClusterConfig object with two nodegroups:
--- 
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: openstudio-server
  region: us-west-2
  version: "1.30"

vpc:
  cidr: 192.168.0.0/16
  autoAllocateIPv6: true
  clusterEndpoints:
    privateAccess: true
  subnets:
    private:
      us-west-2a:
        id: "subnet-02213ae644f5f392e"
      us-west-2b:
        id: "subnet-081506cc8b6d3dbb2"
iam:
  withOIDC: true
  serviceAccounts:
  - metadata:
      name: ebs-csi-controller-sa
      namespace: kube-system
    wellKnownPolicies:
      ebsCSIController: true

managedNodeGroups:
  - name: web-node-group
    instanceType: m7i.8xlarge
    minSize: 0
    maxSize: 2
    desiredCapacity: 1
    labels:
      nodegroup: web-group
    privateNetworking: true
    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: true
        certManager: true
        ebs: true
    ssh:
      allow: true
      # Update publicKeyPath for your public key
      publicKeyPath: ~/.ssh/id_rsa_179d.pub
    availabilityZones: ["us-west-2a"]
    volumeSize: 550
    volumeType: gp3
    tags:
      'org': 'nrel179d'
      'billingId': '230030'

  - name: worker-node-group-spot
    instanceTypes: ["c5.metal", "c5a.24xlarge", "c5ad.24xlarge", "c5d.metal",
    "c6a.24xlarge", "c6i.24xlarge", "c6id.24xlarge", "c6in.24xlarge",
    "c7a.24xlarge", "c7i.24xlarge", "c7i.metal-24xl", "inf1.24xlarge"]
    minSize: 0
    maxSize: 50
    desiredCapacity: 1
    labels:
      nodegroup: worker-group
    privateNetworking: true
    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: true
        certManager: true
        ebs: true
    spot: true
    ssh:
      allow: true
      # Update publicKeyPath for your public key
      publicKeyPath: ~/.ssh/id_rsa_179d.pub
    availabilityZones: ["us-west-2b"]
    volumeSize: 400
    volumeType: gp3
    tags:
      'org': 'nrel179d'
      'billingId': '230030'

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:      # add IAM and service account
      ebsCSIController: true