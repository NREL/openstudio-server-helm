# A simple example of ClusterConfig object with two nodegroups:
--- 
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: openstudio-server-03
  region: us-west-2
  version: "1.34"


vpc:
  clusterEndpoints:
    privateAccess: true

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: ebs-csi-controller-sa
        namespace: kube-system
      wellKnownPolicies:
        ebsCSIController: true

managedNodeGroups:
  - name: web-node-group4
    amiType: Bottlerocket_x86_64
    instanceType: m7i.8xlarge
    minSize: 0
    maxSize: 2
    desiredCapacity: 2
    labels:
      nodegroup: web-group
    privateNetworking: true
    iam:
      withAddonPolicies:
        autoScaler: true
        externalDNS: true
        certManager: true
        ebs: true
    subnets:
      - subnet-02213ae644f5f392e
    volumeSize: 750
    volumeType: gp3
    updateConfig:
      maxUnavailable: 1

addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
