# Ramp worker scaling profile.
# Use only after ceiling-probe recommends advance.
#
# Example:
# helm upgrade openstudio-server ./openstudio-server -n openstudio-server \
#   --reuse-values \
#   -f openstudio-server/values.registry-live.yaml \
#   -f openstudio-server/values.profile-ramp.yaml

worker_hpa:
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      selectPolicy: Min
      policies:
        - type: Pods
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 15
          periodSeconds: 60
