# Large-scale values for openstudio-server.
# This is a YAML-formatted file optimized for deployments targeting ~2,000-5,000 worker pods.
# Declare variables to be passed into your templates.

# About scaling: These values are tuned for large deployments.
# Each bottleneck category is annotated with its scaling ceiling.

global:
  provider:
    name: ""
    # Temporary migration toggle. Keep false unless upgrading legacy values
    # that still set provider.name instead of global.provider.name.
    allowLegacyName: false
  images:
    registry: ""
    org: "nrel"
    serverRepository: "openstudio-server"
    rserveRepository: "openstudio-rserve"
    tag: "3.10.0"

cluster:
  name: "openstudio-server"

autoscaler:
  # Defaults to enabled on AWS and disabled on other providers unless explicitly set.
  # enabled: true
  # For OpenStack, enable autoscaler and provide one or more node groups.
  # openstackNodeGroups:
  #   - name: web-group
  #     min: 1
  #     max: 5
  #   - name: worker-group
  #     min: 1
  #     max: 50
  openstackNodeGroups: []
  extraArgs: []

priorityClasses:
  enabled: true
  create: true
  highName: "high-priority"
  lowName: "low-priority"

secrets:
  # Primary path: pre-create this secret once and reference it.
  existingSecret: "openstudio-app-secrets"
  # Optional install-time guard for connected clusters.
  # When true, rendering fails if existingSecret is not found in the release namespace.
  validateExistingSecret: false
  # Alternate path. Set to true only if you intentionally want chart-managed secret creation.
  create: false
  nameOverride: ""
  keys:
    dbUsername: "db-username"
    dbPassword: "db-password"
    redisPassword: "redis-password"
    webSecret: "web-secret-key"

nfs-server-provisioner:
  persistence:
    enabled: true
    # Backend storage for the in-cluster NFS server (nfs-pvc-data).
    # Keep nfs_pvc.storage below this value to avoid NFS provisioning failures.
    # OpenStack preflight (required): ensure this + db.persistence.size +
    # redis.persistence.size + existing Cinder usage remains below your quota.
    size: 550Gi
  # Pull from the local zot mirror endpoint instead of Docker Hub.
  image:
    repository: "quay.io/kubernetes_incubator/nfs-provisioner"
    tag: "v2.3.0"
  storageClass:
    allowVolumeExpansion: false
    mountOptions:
      - vers=4

# 🔴 CRITICAL B2: Single MongoDB instance — ceiling ~3k-5k workers.
# Beyond this ceiling, deploy MongoDB replica set (3+ pods with primary/secondary/arbiter).
db:
  # Required when secrets.create=true.
  username: ""
  password: ""
  container:
    image: "library/mongo@sha256:a40f777b87a077a8a4801368aa17629e575413d6567872492135e26692499905"
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 4
        memory: "22Gi"
  persistence:
    size: 200Gi

# 🔴 CRITICAL B3: Single NFS server — ceiling ~1k-2k workers.
# Beyond this ceiling, migrate simulation artifact storage to S3/MinIO.
nfs_pvc:
  # Frontend shared RWX claim consumed by web/rserve/background pods.
  # Keep this below nfs-server-provisioner.persistence.size (recommended 85-95%).
  storage: "500Gi"

# 🔴 CRITICAL B1: Single Redis instance — ceiling ~2k-3k workers.
# The single-threaded event loop becomes CPU-saturated at ~10k concurrent connections.
# Beyond this ceiling, deploy Redis Sentinel or Redis Cluster.
redis:
  # Required when secrets.create=true.
  password: ""
  # Optional explicit Redis URI for REDIS_URL.
  # Use this when credentials include URI-reserved characters.
  url: ""
  container:
    image: "library/redis@sha256:94fb31b765189935ffd5f0503ce496bee4404499cbcfa7f8d67020bfbed2a345"
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 8          # Increased from 3: 10k BRPOP connections need CPU headroom
        memory: "16Gi"  # Increased from 4Gi: AOF rewrite + queue data in memory
  persistence:
    size: 200Gi
  config:
    maxclients: 50000  # 10k workers + 96 bg workers + headroom
    tcpBacklog: 511
    timeoutSeconds: 0
    appendfsync: "everysec"  # Balance durability vs. latency (B13)
    save: ""                 # Disable auto RDB saves to avoid fork() spikes (B13)

rserve:
  number_of_workers: "1"
  container:
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 1
        memory: "1Gi"

rserve_svc:
  {}

# 🟠 HIGH B5: Queue pipeline — 96 workers (8×12) can sustain ~5k+ consumers.
web_background:
  replicas: 1
  workerCount: 12       # Increased from 6: each pod runs 12 Resque workers
  container:
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 4          # Increased from 2 for background/analysis processing
        memory: "8Gi"   # Increased from 4Gi for analysis payloads

# Web background HPA — autoscale 8→32 based on CPU utilization
web_background_hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: 70
  stabilizationWindowSeconds: 300

# 🔴 CRITICAL B4: Web Passenger connection pool — ceiling ~5k-7k workers.
# For >7k workers, enable distributed locking and scale web to 3+ replicas.
web:
  replicas: 1
  # Required when secrets.create=true.
  secret_key_value: ""
  # Use this formula (1024 * memory of web pod in Gi * 0.75) / memory per passenger process
  passenger_memory_per_process: 250
  container:
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 6
        memory: "50Gi"

# Web HPA with distributed locking support (prevents race conditions in multi-web deployments)
web_hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50
  distributedLocking:
    enabled: false      # Set true only after application-level redlock is validated
    lockMode: "redis"
    lockTTLSeconds: 30
    retryIntervalMs: 100

web_svc:
  {}

worker:
  queues: "simulations,requeued"
  # Distribute workers across nodes to avoid single-node saturation (B10)
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: "kubernetes.io/hostname"
    whenUnsatisfiable: ScheduleAnyway
  # Spread pods across nodes (preferred) to reduce blast radius (B10)
  antiAffinity:
    enabled: true
    type: "preferred"
    topologyKey: "kubernetes.io/hostname"
  # Protect against voluntary disruptions during rolling updates (B10)
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Rolling update strategy for large fleets.
  # At maxSurge=1, restarting 5k workers takes ~45 days (11min grace × 5k pods).
  strategy:
    maxSurge: 500
    maxUnavailable: 0
  container:
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: "400m"     # Reduced from 700m: better pod density (~2 per 1-core slice) (B8)
        memory: "1Gi"   # Increased from 900Mi: observed peak 1.3GB with headroom (B8)
      limits:
        cpu: 2          # Cap burst to prevent node OOM (B8)
        memory: "2Gi"   # Hard limit for memory safety (B8)
    terminationGracePeriodSeconds: 660  # Keep above preStop maxWait+TERM grace to avoid hook truncation (maxWaitSeconds:600 + forceTerminateGrace:20 + buffer:40)
    preStop:
      enabled: true
      maxWaitSeconds: 600       # 10 min max drain (was 85 min)
      pollIntervalSeconds: 10   # Faster detection of job completion (was 30s)
      signal: 3                 # SIGQUIT
      fastTerminateSeconds: 600 # Use full maxWaitSeconds window: simulations run up to WORKER_JOB_TIMEOUT_SECONDS; killing after 120s causes PruneDeadWorkerDirtyExit churn during node scale-down
      forceTerminateGraceSeconds: 20
      forceKillEnabled: true

worker_hpa:
  minReplicas: 2
  maxReplicas: 800
  targetCPUUtilizationPercentage: 50
  stabilizationWindowSeconds: 1800

worker_autoscaling:
  mode: "keda-hybrid"   # Changed from "hpa": queue-depth + CPU hybrid (B6)
  keda:
    pollingIntervalSeconds: 10   # React to queue backlog within 10s
    cooldownPeriodSeconds: 300
    redisAddress: ""
    queueNames:
      - simulations
      - requeued
    queueLengthPerWorker: 1
    activationQueueLength: 1
    enableCpuTrigger: false
    advanced:
      restoreToOriginalReplicaCount: false

# Image prepull — keep disabled by default, enable only for planned warmup windows.
prepull:
  enabled: false
  role: "worker"
  spreadSeconds: 600
  warmMode: "once"
  intervalSeconds: 3600
  failOnAnyPullError: false
  includeRserve: true
  includeWebInit: false
  additionalImages: []

hooks:
  preDeleteCleanup:
    enabled: true
