apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "localRegistry.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "localRegistry.labels" . | nindent 4 }}
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      formatter: json
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      delete:
        enabled: true
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3