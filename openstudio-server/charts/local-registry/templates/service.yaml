{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "localRegistry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "localRegistry.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "localRegistry.selectorLabels" . | nindent 4 }}
{{- end }}