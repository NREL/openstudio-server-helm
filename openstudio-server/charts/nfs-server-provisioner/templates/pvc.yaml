{{- $global := default (dict) .Values.global -}}
{{- $globalProvider := default (dict) (get $global "provider") -}}
{{- $legacyProvider := default (dict) .Values.provider -}}
{{- $legacyProviderName := lower (default "" (get $legacyProvider "name")) -}}
{{- $allowLegacyProviderName := default false (get $globalProvider "allowLegacyName") -}}
{{- $providerName := lower (default "" (get $globalProvider "name")) -}}
{{- if ne $legacyProviderName "" -}}
{{- if not $allowLegacyProviderName -}}
{{- fail "provider.name is deprecated and disabled by default. Set global.provider.name, or set global.provider.allowLegacyName=true temporarily during migration." -}}
{{- end -}}
{{- if and (ne $providerName "") (ne $providerName $legacyProviderName) -}}
{{- fail (printf "provider.name=%q conflicts with global.provider.name=%q. Remove provider.name and keep global.provider.name." $legacyProviderName $providerName) -}}
{{- end -}}
{{- if eq $providerName "" -}}
{{- $providerName = $legacyProviderName -}}
{{- end -}}
{{- end -}}
{{- $storageClasses := default (dict) (get $global "storageClasses") -}}
{{- $openstackBlockStorageClass := default "cinder-csi" (get $storageClasses "block") -}}
{{- $defaultStorageClass := ternary $openstackBlockStorageClass "ssd" (eq $providerName "openstack") }}
{{- $existingPVC := lookup "v1" "PersistentVolumeClaim" .Release.Namespace .Values.persistence.name -}}
{{- $existingSpec := default (dict) (get $existingPVC "spec") -}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .Values.persistence.name  }}
spec:
  storageClassName: {{ default $defaultStorageClass .Values.persistence.storageClass | quote }}
  accessModes:
{{- if $existingPVC }}
{{ toYaml (default (list "ReadWriteOnce") (get $existingSpec "accessModes")) | nindent 4 }}
{{- else }}
{{ toYaml .Values.persistence.accessModes | nindent 4 }}
{{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}