{{- if eq (include "openstudio.workerAutoscalingMode" .) "hpa" }}
{{- $workerHpa := default (dict) .Values.worker_hpa -}}
{{- $behavior := default (dict) (get $workerHpa "behavior") -}}
{{- $scaleUp := default (dict) (get $behavior "scaleUp") -}}
{{- $scaleDown := default (dict) (get $behavior "scaleDown") -}}
{{- $defaultScaleUpPolicies := list (dict "type" "Pods" "value" 32 "periodSeconds" 15) (dict "type" "Percent" "value" 200 "periodSeconds" 15) -}}
{{- $defaultScaleDownPolicies := list (dict "type" "Percent" "value" 25 "periodSeconds" 60) -}}
{{- $scaleUpPolicies := default $defaultScaleUpPolicies (get $scaleUp "policies") -}}
{{- $scaleDownPolicies := default $defaultScaleDownPolicies (get $scaleDown "policies") -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "openstudio.workerHpaName" . }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "openstudio.workerName" . }}
  minReplicas: {{ .Values.worker_hpa.minReplicas  }}
  maxReplicas: {{ .Values.worker_hpa.maxReplicas  }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ default 10 (get $scaleUp "stabilizationWindowSeconds") }}
      policies:
{{ toYaml $scaleUpPolicies | nindent 8 }}
      selectPolicy: {{ default "Max" (get $scaleUp "selectPolicy") }}
    scaleDown:
      stabilizationWindowSeconds: {{ default .Values.worker_hpa.stabilizationWindowSeconds (get $scaleDown "stabilizationWindowSeconds") }}
      policies:
{{ toYaml $scaleDownPolicies | nindent 8 }}
      selectPolicy: {{ default "Max" (get $scaleDown "selectPolicy") }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker_hpa.targetCPUUtilizationPercentage  }}
{{- end }}
