apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.worker_hpa.name  }}-hpa
  labels:
    release: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.worker.name  }}
  minReplicas: {{ .Values.worker_hpa.minReplicas  }}
  maxReplicas: {{ .Values.worker_hpa.maxReplicas  }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.worker_hpa.stabilizationWindowSeconds  }}
      policies:
      - type: Pods
        value: {{ default .Values.worker_hpa.scalePolicyValue .Values.worker_hpa.scaleDownPolicyValue  }}
        periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker_hpa.targetCPUUtilizationPercentage  }}
