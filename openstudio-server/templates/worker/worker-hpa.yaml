apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.worker_hpa.name  }}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.worker.name  }}
  minReplicas: {{ .Values.worker_hpa.minReplicas  }}
  maxReplicas: {{ .Values.worker_hpa.maxReplicas  }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.worker_hpa.scaleUpStabilizationWindowSeconds  }}
      policies:
      - type: Pods
        value: {{ .Values.worker_hpa.scaleUpPolicyValue | default .Values.worker_hpa.scalePolicyValue  }}
        periodSeconds: {{ .Values.worker_hpa.scaleUpPolicyPeriodSeconds | default 60  }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.worker_hpa.scaleDownStabilizationWindowSeconds  }}
      policies:
      - type: Pods
        value: {{ .Values.worker_hpa.scaleDownPolicyValue | default .Values.worker_hpa.scalePolicyValue  }}
        periodSeconds: {{ .Values.worker_hpa.scaleDownPolicyPeriodSeconds | default 60  }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker_hpa.targetCPUUtilizationPercentage  }}
