{{- if eq (include "openstudio.workerAutoscalingMode" .) "keda-hybrid" }}
{{- $root := . -}}
{{- $workerAutoscaling := default (dict) .Values.worker_autoscaling -}}
{{- $keda := default (dict) (get $workerAutoscaling "keda") -}}
{{- $workerHpa := default (dict) .Values.worker_hpa -}}
{{- $behavior := default (dict) (get $workerHpa "behavior") -}}
{{- $scaleUp := default (dict) (get $behavior "scaleUp") -}}
{{- $scaleDown := default (dict) (get $behavior "scaleDown") -}}
{{- $defaultScaleUpPolicies := list (dict "type" "Pods" "value" 32 "periodSeconds" 15) (dict "type" "Percent" "value" 200 "periodSeconds" 15) -}}
{{- $defaultScaleDownPolicies := list (dict "type" "Percent" "value" 25 "periodSeconds" 60) -}}
{{- $scaleUpPolicies := default $defaultScaleUpPolicies (get $scaleUp "policies") -}}
{{- $scaleDownPolicies := default $defaultScaleDownPolicies (get $scaleDown "policies") -}}
{{- $enableCpuTrigger := false -}}
{{- if hasKey $keda "enableCpuTrigger" -}}
{{- $enableCpuTrigger = (get $keda "enableCpuTrigger") -}}
{{- end -}}
{{- $queueNames := default (list "simulations" "requeued") (get $keda "queueNames") -}}
{{- $kedaAddress := default (printf "%s.%s.svc.cluster.local:6379" (include "openstudio.redisServiceName" .) .Release.Namespace) (get $keda "redisAddress") -}}
{{- $externalScaler := default (dict) (get $keda "externalScaler") -}}
{{- $useExternalScaler := default false (get $externalScaler "enabled") -}}
{{- $externalService := default (dict) (get $externalScaler "service") -}}
{{- $externalMetrics := default (dict) (get $externalScaler "metrics") -}}
{{- $externalScalerServiceName := default (printf "%s-external-scaler" (include "openstudio.workerName" .)) (get $externalService "name") -}}
{{- $externalScalerPort := default 9090 (get $externalService "port") -}}
---
{{- if not $useExternalScaler }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "openstudio.workerName" . }}-keda-redis-auth
spec:
  secretTargetRef:
    - parameter: password
      name: {{ include "openstudio.secretName" . }}
      key: {{ include "openstudio.secretKeyRedisPassword" . }}
---
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "openstudio.workerName" . }}
spec:
  scaleTargetRef:
    kind: Deployment
    name: {{ include "openstudio.workerName" . }}
  minReplicaCount: {{ .Values.worker_hpa.minReplicas }}
  maxReplicaCount: {{ .Values.worker_hpa.maxReplicas }}
  pollingInterval: {{ default 15 (get $keda "pollingIntervalSeconds") }}
  cooldownPeriod: {{ default 300 (get $keda "cooldownPeriodSeconds") }}
  {{- $advanced := default (dict) (get $keda "advanced") }}
  advanced:
    restoreToOriginalReplicaCount: {{ default false (get $advanced "restoreToOriginalReplicaCount") }}
    horizontalPodAutoscalerConfig:
      name: {{ include "openstudio.workerHpaName" . }}
      behavior:
        scaleUp:
          stabilizationWindowSeconds: {{ default 10 (get $scaleUp "stabilizationWindowSeconds") }}
          policies:
{{ toYaml $scaleUpPolicies | nindent 10 }}
          selectPolicy: {{ default "Max" (get $scaleUp "selectPolicy") }}
        scaleDown:
          stabilizationWindowSeconds: {{ default .Values.worker_hpa.stabilizationWindowSeconds (get $scaleDown "stabilizationWindowSeconds") }}
          policies:
{{ toYaml $scaleDownPolicies | nindent 10 }}
          selectPolicy: {{ default "Max" (get $scaleDown "selectPolicy") }}
  {{- $fallback := default (dict) (get $keda "fallback") }}
  {{- if and (hasKey $fallback "failureThreshold") (hasKey $fallback "replicas") }}
  fallback:
    failureThreshold: {{ get $fallback "failureThreshold" }}
    replicas: {{ get $fallback "replicas" }}
  {{- end }}
  triggers:
    {{- if $useExternalScaler }}
    - type: external
      metadata:
        scalerAddress: {{ printf "%s.%s.svc.cluster.local:%v" $externalScalerServiceName .Release.Namespace $externalScalerPort | quote }}
        metricName: {{ default "worker_queue_pressure" (get $externalMetrics "name") | quote }}
        targetValue: {{ default "1" (get $externalMetrics "targetValue") | quote }}
        activationTargetValue: {{ default "1" (get $externalMetrics "activationTargetValue") | quote }}
    {{- else }}
    {{- range $queueName := $queueNames }}
    - type: redis
      metadata:
        address: {{ $kedaAddress | quote }}
        listName: {{ printf "resque:queue:%s" $queueName | quote }}
        listLength: {{ default "1" (get $keda "queueLengthPerWorker") | quote }}
        activationListLength: {{ default "1" (get $keda "activationQueueLength") | quote }}
      authenticationRef:
        name: {{ include "openstudio.workerName" $root }}-keda-redis-auth
    {{- end }}
    {{- end }}
    {{- if $enableCpuTrigger }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.worker_hpa.targetCPUUtilizationPercentage | quote }}
    {{- end }}
{{- end }}
