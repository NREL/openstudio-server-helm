apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name   }}
  labels:
    release: {{ .Release.Name }}
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  # NOTE: intentionally NO `replicas` here. The worker HPA owns scaling
  # (minReplicas..maxReplicas); because Helm three-way merge preserves fields
  # absent from the manifest, upgrades leave .spec.replicas -- and therefore
  # HPA ownership -- untouched. A hardcoded value here would reset the
  # deployment to that count on every upgrade (scale-to-1 cliff at
  # maxReplicas scale). On fresh installs the API defaulting webhook sets 1,
  # and the HPA raises it to minReplicas within its first reconcile.
  selector:
    matchLabels:
      app: {{ .Values.worker.name }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.worker.strategy.maxSurge }}
      maxUnavailable: {{ .Values.worker.strategy.maxUnavailable }}
  template:
    metadata:
      labels:
        app: {{ .Values.worker.name }}
        release: {{ .Release.Name }}
    spec:
      affinity:
        {{- include "openstudio.nodeGroupAffinity" (dict "root" . "role" "worker") | nindent 8 }}
      containers:
        - name: {{ .Values.worker.container.name   }}
          image: {{ include "openstudio.imageWithRegistry" (dict "root" $ "image" .Values.worker.container.image) | quote }}
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Creating kill.worker file" >&2
                    touch /opt/openstudio/server/bin/kill.worker
                    echo "Sending QUIT signal to Resque" >&2
                    pkill -f -QUIT resque || true
                    echo "Waiting for Ruby or OpenStudio processes to end (max 50s)" >&2
                    timeout=50
                    while [ $timeout -gt 0 ] && ( [ $(eval "pgrep -c ruby") -gt 1 ] || [ $(eval "pgrep -c openstudio") -gt 0 ] ); do
                      sleep 2
                      echo "Still waiting... ($timeout seconds remaining)" >&2
                      timeout=$((timeout-2))
                    done
                    echo "Killing remaining processes" >&2
                    pkill -P 1 || true
          resources:
            requests:
              cpu:  {{  .Values.worker.container.resources.requests.cpu  }}
              memory:  {{  .Values.worker.container.resources.requests.memory  }}
            {{- include "openstudio.resourceLimits" .Values.worker.container.resources.limits | nindent 12 }}
          volumeMounts:
            - name: osdata-worker
              mountPath: "/mnt/openstudio"
          env:
            - name:  QUEUES
              value: requeued,simulations
            - name:  COUNT
              value: "1"
            - name: SECRET_KEY_BASE
              value: {{ .Values.web.secret_key_value | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis_svc.url | quote }}
            - name: MONGO_USER
              value: {{ .Values.db.username | quote }}
            - name: MONGO_PASSWORD
              value: {{ .Values.db.password | quote }}
          command: ["/usr/local/bin/start-workers"]
      terminationGracePeriodSeconds: {{ .Values.worker.container.terminationGracePeriodSeconds }} # for long openstudio jobs.
      priorityClassName: low-priority
      volumes:
        - name: osdata-worker
          {{- if .Values.worker.container.emptyDirSizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.worker.container.emptyDirSizeLimit }}
          {{- else }}
          emptyDir: {}
          {{- end }}
