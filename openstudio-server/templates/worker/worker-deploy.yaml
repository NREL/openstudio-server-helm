apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstudio.workerName" . }}
spec:
  selector:
    matchLabels:
      app: {{ default "worker" .Values.worker.label }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ default 1 (get (default (dict) .Values.worker.strategy) "maxSurge") }}
      maxUnavailable: {{ default 0 (get (default (dict) .Values.worker.strategy) "maxUnavailable") }}
  template:
    metadata:
      labels:
        app: {{ default "worker" .Values.worker.label }}
        release: {{ .Release.Name }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
      {{- end }}
    {{ $priorityClasses := default (dict) .Values.priorityClasses }}
    {{ $redis := default (dict) .Values.redis }}
    {{ $worker := default (dict) .Values.worker }}
    {{ $workerContainer := default (dict) .Values.worker.container }}
    {{ $workerStartup := default (dict) (get $workerContainer "startup") }}
    {{ $workerPreStop := default (dict) (get $workerContainer "preStop") }}
    {{ $workerLiveness := default (dict) (get $workerContainer "livenessProbe") }}
    {{ $workerResque := default (dict) (get $worker "resque") }}
    {{ $workerRuntimeOverrides := default (dict) (get $worker "runtimeOverrides") }}
    {{ $workerLockJanitor := default (dict) (get $workerResque "lockJanitor") }}
    {{ $workerTopologySpread := default (dict) (get $worker "topologySpread") }}
    {{ $workerAntiAffinity := default (dict) (get $worker "antiAffinity") }}
    {{- $antiAffinityEnabled := not (empty (default "" (get $workerAntiAffinity "type"))) -}}
    spec:
      {{- /* Use "if" (not "{{- if") to preserve the newline after "spec:" */}}
      {{ if $antiAffinityEnabled }}
      {{- /* Emit combined affinity block to avoid duplicate "affinity:" keys */}}
      {{- $mode := include "openstudio.nodeGroupAffinityModeForRole" (dict "root" . "role" "worker") -}}
      {{- $labelKey := include "openstudio.nodeGroupLabelKey" . -}}
      {{- $nodeGroupValue := include "openstudio.nodeGroupValueForRole" (dict "root" . "role" "worker") -}}
      {{- $antiAffinityType := get $workerAntiAffinity "type" -}}
      {{- $antiAffinityTopologyKey := default "kubernetes.io/hostname" (get $workerAntiAffinity "topologyKey") -}}
      {{- $workerLabel := default "worker" .Values.worker.label -}}
      affinity:
        {{- if ne $mode "disabled" }}
        nodeAffinity:
          {{- if eq $mode "preferred" }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: {{ $labelKey }}
                    operator: In
                    values:
                      - {{ $nodeGroupValue }}
          {{- else }}
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ $labelKey }}
                    operator: In
                    values:
                      - {{ $nodeGroupValue }}
          {{- end }}
        {{- end }}
        podAntiAffinity:
          {{- if eq $antiAffinityType "preferred" }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ $workerLabel }}
                    release: {{ .Release.Name }}
                topologyKey: {{ $antiAffinityTopologyKey }}
          {{- else }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ $workerLabel }}
                  release: {{ .Release.Name }}
              topologyKey: {{ $antiAffinityTopologyKey }}
          {{- end }}
      {{- else }}
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "worker") | nindent 6 }}
      {{- end }}
      {{- include "openstudio.tolerationsForRole" (dict "root" . "role" "worker") | nindent 6 }}
      {{- if eq (include "openstudio.workloadServiceAccountUse" .) "true" }}
      serviceAccountName: {{ include "openstudio.workloadServiceAccountName" . }}
      {{- end }}
      {{- include "openstudio.podImagePullSecrets" . | nindent 6 }}
      {{- include "openstudio.podNodeSelector" (dict "nodeSelector" .Values.worker.nodeSelector) | nindent 6 }}
      {{- if (default false (get $workerTopologySpread "enabled")) }}
      topologySpreadConstraints:
        - maxSkew: {{ default 1 (get $workerTopologySpread "maxSkew") }}
          topologyKey: {{ default "kubernetes.io/hostname" (get $workerTopologySpread "topologyKey") | quote }}
          whenUnsatisfiable: {{ default "ScheduleAnyway" (get $workerTopologySpread "whenUnsatisfiable") }}
          labelSelector:
            matchLabels:
              app: {{ default "worker" .Values.worker.label }}
              release: {{ .Release.Name }}
          {{- with (get $workerTopologySpread "minDomains") }}
          minDomains: {{ . }}
          {{- end }}
          {{- with (get $workerTopologySpread "nodeAffinityPolicy") }}
          nodeAffinityPolicy: {{ . }}
          {{- end }}
          {{- with (get $workerTopologySpread "nodeTaintsPolicy") }}
          nodeTaintsPolicy: {{ . }}
          {{- end }}
      {{- end }}
      {{- include "openstudio.podHostAliases" . | nindent 6 }}
      {{- if (default true (get $priorityClasses "enabled")) }}
      priorityClassName: {{ default "low-priority" (get $priorityClasses "lowName") }}
      {{- end }}
      containers:
        - name: {{ default "worker" .Values.worker.container.name }}
          image: {{ default (include "openstudio.serverImage" .) .Values.worker.container.image }}
          imagePullPolicy: {{ default (include "openstudio.defaultWorkloadImagePullPolicy" .) .Values.worker.container.imagePullPolicy }}
{{- if (default true (get $workerPreStop "enabled")) }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    set +e
                    signal="${WORKER_PRESTOP_SIGNAL:-3}"
                    max_wait="${WORKER_PRESTOP_MAX_WAIT_SECONDS:-600}"
                    fast_wait="${WORKER_PRESTOP_FAST_TERMINATE_SECONDS:-120}"
                    interval="${WORKER_PRESTOP_POLL_INTERVAL_SECONDS:-10}"
                    force_term_grace="${WORKER_PRESTOP_FORCE_TERM_GRACE_SECONDS:-20}"
                    force_kill_enabled="${WORKER_PRESTOP_FORCE_KILL_ENABLED:-true}"
                    start_ts="$(date +%s)"
                    target_pattern='resque|openstudio'
                    case "$max_wait" in ''|*[!0-9]*) max_wait=600 ;; esac
                    case "$fast_wait" in ''|*[!0-9]*) fast_wait=120 ;; esac
                    case "$interval" in ''|*[!0-9]*) interval=10 ;; esac
                    case "$force_term_grace" in ''|*[!0-9]*) force_term_grace=20 ;; esac
                    if [ "$fast_wait" -gt "$max_wait" ]; then
                      fast_wait="$max_wait"
                    fi
                    echo "worker preStop phase=start signal=${signal} fast_wait=${fast_wait}s max_wait=${max_wait}s interval=${interval}s force_term_grace=${force_term_grace}s force_kill=${force_kill_enabled}"
                    pkill "-${signal}" -f resque >/dev/null 2>&1 || true
                    while true; do
                      ruby_count="$(pgrep -fc ruby || true)"
                      os_count="$(pgrep -fc openstudio || true)"
                      target_count="$(pgrep -fc "$target_pattern" || true)"
                      if [ "${target_count:-0}" -le 0 ]; then
                        echo "worker preStop phase=graceful_complete reason=no_target_processes elapsed=$(( $(date +%s) - start_ts ))s"
                        break
                      fi
                      if [ "${ruby_count:-0}" -le 1 ] && [ "${os_count:-0}" -eq 0 ]; then
                        echo "worker preStop phase=graceful_complete reason=process_drain_detected elapsed=$(( $(date +%s) - start_ts ))s ruby=${ruby_count:-0} openstudio=${os_count:-0}"
                        break
                      fi
                      now="$(date +%s)"
                      elapsed="$((now - start_ts))"
                      if [ "$elapsed" -ge "$fast_wait" ]; then
                        echo "worker preStop phase=fallback_trigger reason=fast_wait_exceeded elapsed=${elapsed}s ruby=${ruby_count:-0} openstudio=${os_count:-0}"
                        break
                      fi
                      sleep "$interval"
                    done
                    remaining_after_grace="$(pgrep -fc "$target_pattern" || true)"
                    if [ "${remaining_after_grace:-0}" -gt 0 ]; then
                      echo "worker preStop phase=fallback_term remaining=${remaining_after_grace} signal=TERM"
                      pkill -TERM -f "$target_pattern" >/dev/null 2>&1 || true
                      sleep "$force_term_grace"
                      remaining_after_term="$(pgrep -fc "$target_pattern" || true)"
                      if [ "${remaining_after_term:-0}" -gt 0 ] && [ "$force_kill_enabled" = "true" ]; then
                        echo "worker preStop phase=fallback_kill remaining=${remaining_after_term} signal=KILL"
                        pkill -KILL -f "$target_pattern" >/dev/null 2>&1 || true
                      elif [ "${remaining_after_term:-0}" -gt 0 ]; then
                        echo "worker preStop phase=fallback_incomplete remaining=${remaining_after_term} force_kill=false"
                      fi
                    fi
                    echo "worker preStop phase=done elapsed=$(( $(date +%s) - start_ts ))s"
                    exit 0
{{- end }}
          resources:
            requests:
{{ toYaml .Values.worker.container.resources.requests | nindent 14 }}
            {{- if (get (default (dict) .Values.worker.container.resources) "limits") }}
            limits:
{{ toYaml .Values.worker.container.resources.limits | nindent 14 }}
            {{- end }}
{{- if and (default false (get $workerLiveness "enabled")) (or (gt (int (default 0 (get $workerResque "jobTimeoutSeconds"))) 0) (gt (int (default 0 (get $workerResque "receiptWaitTimeoutSeconds"))) 0)) }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  timeout_secs="${WORKER_JOB_TIMEOUT_SECONDS:-0}"
                  if [ "$timeout_secs" -gt 0 ]; then
                    for pid in $(pgrep -x openstudio 2>/dev/null); do
                      elapsed=$(ps -p "$pid" -o etimes= 2>/dev/null | tr -d ' ')
                      [ -z "$elapsed" ] && continue
                      if [ "$elapsed" -gt "$timeout_secs" ]; then
                        echo "LIVENESS_FAIL: openstudio pid=$pid running ${elapsed}s > timeout ${timeout_secs}s"
                        exit 1
                      fi
                    done
                  fi
                  # Self-heal the analysis_zip.lock/receipt deadlock in place (see
                  # worker.resque.receiptWaitTimeoutSeconds docs in values.yaml): a resque
                  # child stuck polling "waiting for receipt file to appear" never spawns
                  # an openstudio subprocess. Kill just that child -- Resque's own
                  # supervisor detects the DirtyExit and re-forks immediately, and
                  # transient-failure-replayer requeues the aborted datapoint -- instead
                  # of failing this probe and restarting the whole pod.
                  receipt_timeout="${WORKER_RECEIPT_WAIT_TIMEOUT_SECONDS:-0}"
                  if [ "$receipt_timeout" -gt 0 ]; then
                    now="$(date +%s)"
                    for pid in $(pgrep -f 'resque-[0-9.]+: Processing .* \[ResqueJobs::RunSimulateDataPoint\]' 2>/dev/null); do
                      pgrep -P "$pid" -x openstudio >/dev/null 2>&1 && continue
                      since_epoch=$(ps -p "$pid" -o args= 2>/dev/null | sed -n 's/.*[Ss]ince \([0-9][0-9]*\).*/\1/p')
                      [ -z "$since_epoch" ] && continue
                      age=$((now - since_epoch))
                      if [ "$age" -gt "$receipt_timeout" ]; then
                        echo "LIVENESS_SELF_HEAL: killing wedged resque child pid=$pid age=${age}s (no openstudio subprocess after ${receipt_timeout}s, suspected analysis_zip receipt-wait deadlock)"
                        kill -9 "$pid" 2>/dev/null || true
                      fi
                    done
                  fi
                  exit 0
            initialDelaySeconds: {{ default 300 (get $workerLiveness "initialDelaySeconds") }}
            periodSeconds: {{ default 300 (get $workerLiveness "periodSeconds") }}
            failureThreshold: {{ default 1 (get $workerLiveness "failureThreshold") }}
            timeoutSeconds: {{ default 10 (get $workerLiveness "timeoutSeconds") }}
{{- end }}
          volumeMounts:
            - name: osdata-worker
              mountPath: "/mnt/openstudio"
            {{- if (default false (get $workerRuntimeOverrides "enabled")) }}
            - name: worker-runtime-overrides
              mountPath: "/opt/openstudio/server/config/initializers/98_lock_abandoned_ebadf_rescue.rb"
              subPath: 98_lock_abandoned_ebadf_rescue.rb
              readOnly: true
            {{- end }}
          env:
            - name:  QUEUES
              value: {{ .Values.worker.queues | quote }}
            - name:  QUEUE
              value: {{ .Values.worker.queues | quote }}
            - name:  COUNT
              value: "1"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyWebSecret" . }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyRedisPassword" . }}
            - name: REDIS_URL
              value: {{ default (printf "redis://:$(REDIS_PASSWORD)@%s:6379" (include "openstudio.redisServiceName" .)) (get $redis "url") | quote }}
            - name: STARTUP_MAX_RETRIES
              value: {{ default 12 (get $workerStartup "maxRetries") | quote }}
            - name: STARTUP_RETRY_DELAY_SECONDS
              value: {{ default 10 (get $workerStartup "retryDelaySeconds") | quote }}
{{- if (default true (get $workerPreStop "enabled")) }}
            - name: WORKER_PRESTOP_MAX_WAIT_SECONDS
              value: {{ default 600 (get $workerPreStop "maxWaitSeconds") | quote }}
            - name: WORKER_PRESTOP_POLL_INTERVAL_SECONDS
              value: {{ default 10 (get $workerPreStop "pollIntervalSeconds") | quote }}
            - name: WORKER_PRESTOP_SIGNAL
              value: {{ default "3" (get $workerPreStop "signal") | quote }}
            - name: WORKER_PRESTOP_FAST_TERMINATE_SECONDS
              value: {{ default 120 (get $workerPreStop "fastTerminateSeconds") | quote }}
            - name: WORKER_PRESTOP_FORCE_TERM_GRACE_SECONDS
              value: {{ default 20 (get $workerPreStop "forceTerminateGraceSeconds") | quote }}
            - name: WORKER_PRESTOP_FORCE_KILL_ENABLED
              value: {{ default true (get $workerPreStop "forceKillEnabled") | quote }}
{{- end }}
            - name: WORKER_JOB_TIMEOUT_SECONDS
              value: {{ default 0 (get $workerResque "jobTimeoutSeconds") | quote }}
            - name: WORKER_RECEIPT_WAIT_TIMEOUT_SECONDS
              value: {{ default 0 (get $workerResque "receiptWaitTimeoutSeconds") | quote }}
{{- if (default false (get $workerLockJanitor "enabled")) }}
            - name: WORKER_LOCK_JANITOR_INTERVAL_SECONDS
              value: {{ default 60 (get $workerLockJanitor "intervalSeconds") | quote }}
            - name: WORKER_LOCK_JANITOR_MIN_AGE_SECONDS
              value: {{ default 120 (get $workerLockJanitor "minAgeSeconds") | quote }}
{{- end }}
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbUsername" . }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbPassword" . }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
{{- if (default false (get $workerLockJanitor "enabled")) }}
              (
                interval="${WORKER_LOCK_JANITOR_INTERVAL_SECONDS:-60}"
                min_age="${WORKER_LOCK_JANITOR_MIN_AGE_SECONDS:-120}"
                case "$interval" in ''|*[!0-9]*) interval=60 ;; esac
                case "$min_age" in ''|*[!0-9]*) min_age=120 ;; esac
                while true; do
                  sleep "$interval"
                  now="$(date +%s)"
                  for lock in /mnt/openstudio/analysis_*/analysis_zip.lock; do
                    [ -e "$lock" ] || continue
                    dir="$(dirname "$lock")"
                    receipt="$dir/analysis_zip.receipt"
                    [ -f "$receipt" ] && continue
                    mtime="$(stat -c %Y "$lock" 2>/dev/null || echo "$now")"
                    age="$((now - mtime))"
                    [ "$age" -lt "$min_age" ] && continue
                    if flock -n -x "$lock" -c true 2>/dev/null; then
                      [ -f "$receipt" ] && continue
                      rm -f "$lock" 2>/dev/null && echo "lock-janitor: removed stale ${lock} (age ${age}s, no live holder, no receipt)"
                    fi
                  done
                done
              ) &
{{- end }}
              retries="${STARTUP_MAX_RETRIES:-12}"
              delay="${STARTUP_RETRY_DELAY_SECONDS:-10}"
              attempt=0
              while true; do
                /usr/local/bin/start-workers && exit 0
                attempt="$((attempt + 1))"
                if [ "$attempt" -ge "$retries" ]; then
                  echo "start-workers failed after ${attempt} attempts; exiting"
                  exit 1
                fi
                echo "start-workers failed; retry ${attempt}/${retries} in ${delay}s"
                sleep "$delay"
              done
      terminationGracePeriodSeconds: {{ .Values.worker.container.terminationGracePeriodSeconds }} # for long openstudio jobs.
      volumes:
        - name: osdata-worker
          persistentVolumeClaim:
            claimName: {{ include "openstudio.nfsPvcName" . }}
        {{- if (default false (get $workerRuntimeOverrides "enabled")) }}
        - name: worker-runtime-overrides
          configMap:
            name: {{ include "openstudio.workerName" . }}-runtime-overrides
        {{- end }}
