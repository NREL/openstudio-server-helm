apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name   }}
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
spec:
  selector:
    matchLabels:
      app: {{ .Values.worker.name }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ .Values.worker.name }}
        release: {{ .Release.Name }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodegroup
                    operator: In
                    values:
                      - worker-group
      containers:
        - name: {{ .Values.worker.container.name   }}
          image: {{ .Values.worker.container.image   }}
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sh', '-c', 'TIMEOUT=280; ELAPSED=0; echo "$(date): Starting graceful shutdown (timeout ${TIMEOUT}s)" >&2; touch /opt/openstudio/server/bin/kill.worker; echo "$(date): Created kill.worker file" >&2; pkill -f -QUIT resque || true; echo "$(date): Sent QUIT signal to Resque" >&2; while [ $ELAPSED -lt $TIMEOUT ]; do RUBY_COUNT=$(pgrep -c ruby 2>/dev/null || echo 0); OPENSTUDIO_COUNT=$(pgrep -c openstudio 2>/dev/null || echo 0); if [ "$RUBY_COUNT" -le 1 ] && [ "$OPENSTUDIO_COUNT" -eq 0 ]; then echo "$(date): All jobs completed successfully" >&2; break; fi; REMAINING=$((TIMEOUT - ELAPSED)); echo "$(date): Waiting ($REMAINING s remaining) - ruby=$RUBY_COUNT, openstudio=$OPENSTUDIO_COUNT" >&2; sleep 5; ELAPSED=$((ELAPSED + 5)); done; if [ $ELAPSED -ge $TIMEOUT ]; then echo "$(date): Timeout reached. Force killing remaining processes" >&2; pkill -P 1 || true; else echo "$(date): Graceful shutdown completed" >&2; fi']
          startupProbe:
            exec:
              command: ['/bin/sh', '-c', 'pgrep -f "resque.*worker" > /dev/null && echo ready']
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ['/bin/sh', '-c', 'pgrep -f "resque.*worker" > /dev/null && echo ready']
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 2
            timeoutSeconds: 5
          resources:
            requests:
              cpu:  {{  .Values.worker.container.resources.requests.cpu  }}
              memory:  {{  .Values.worker.container.resources.requests.memory  }}
            {{- with .Values.worker.container.resources.limits }}
            limits:
              cpu:  {{ .cpu }}
              memory:  {{ .memory }}
            {{- end }}
          volumeMounts:
            - name: osdata-worker
              mountPath: "/mnt/openstudio"
          env:
            - name:  QUEUES
              value: requeued,simulations
            - name:  COUNT
              value: "1"
            - name: SECRET_KEY_BASE
              value: {{ .Values.web.secret_key_value }}
            - name: REDIS_URL
              value: {{ .Values.redis_svc.url  }}
            - name: MONGO_USER
              value: {{ .Values.db.username }}
            - name: MONGO_PASSWORD
              value: {{ .Values.db.password }}
          command: ["/usr/local/bin/start-workers"]
      terminationGracePeriodSeconds: {{ .Values.worker.container.terminationGracePeriodSeconds }} # for long openstudio jobs.
      priorityClassName: low-priority
      volumes:
        - name: osdata-worker
          emptyDir: {}
