apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "openstudio.webName" . }}-test-healthcheck"
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "openstudio.webName" . }}-test
    release: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- include "openstudio.tolerationsForRole" (dict "root" . "role" "web") | nindent 2 }}
  containers:
    - name: web-healthcheck
      image: curlimages/curl:8.7.1
      command:
        - sh
        - -c
        - |
          set -e
          echo "Testing web service HTTP connectivity..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            "http://{{ include "openstudio.webServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local/")
          echo "HTTP response code: ${HTTP_CODE}"
          # Accept 200 (healthy) or 302 (redirect to login) as success
          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "302" ]; then
            echo "PASS: web service is reachable"
          else
            echo "FAIL: unexpected HTTP code ${HTTP_CODE}"
            exit 1
          fi
