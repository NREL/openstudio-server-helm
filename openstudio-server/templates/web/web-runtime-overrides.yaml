{{- $runtimeOverrides := default (dict) (get (default (dict) .Values.web) "runtimeOverrides") -}}
{{- if (default false (get $runtimeOverrides "enabled")) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openstudio.webName" . }}-runtime-overrides
data:
  98_seed_zip_guard.rb: |
    # frozen_string_literal: true

    module OpenStudioSeedZipGuard
      class MissingSeedZipError < StandardError; end
      class InvalidSeedZipError < StandardError; end

      module OptionSanitizer
        module_function

        def sanitize(value)
          case value
          when Hash
            value.each_with_object({}) do |(key, nested), acc|
              next if key.nil?

              normalized_key =
                if key.is_a?(String) || key.is_a?(Symbol)
                  key
                else
                  key.to_s
                end
              acc[normalized_key] = sanitize(nested)
            end
          when Array
            value.map { |entry| sanitize(entry) }
          else
            value
          end
        end
      end

      module AnalysisPatch
        def seed_zip_integrity_valid?
          return false unless seed_zip_available?

          begin
            require "zip"
            Zip::File.open(seed_zip.path.to_s) do |zip_file|
              return zip_file.entries.any?
            end
          rescue Zip::Error, Errno::ENOENT
            return false
          end
        end

        def seed_zip_available?
          return false unless seed_zip

          seed_zip.path.present? && File.exist?(seed_zip.path)
        end

        def seed_zip_required_for?(analysis_type)
          analysis_type.to_s != "stop"
        end

        def start(no_delay, analysis_type = "batch_run", options = {})
          sanitized_options = OptionSanitizer.sanitize(options || {})
          unless sanitized_options.key?(:analysis_type) || sanitized_options.key?("analysis_type")
            sanitized_options[:analysis_type] = analysis_type
            sanitized_options["analysis_type"] = analysis_type
          end

          if seed_zip_required_for?(analysis_type) && !seed_zip_available?
            self.status_message = "Cannot start analysis: missing seed_zip attachment (upload analysis.zip before start)."
            save!
            raise MissingSeedZipError, status_message
          end

          if seed_zip_required_for?(analysis_type) && !seed_zip_integrity_valid?
            self.status_message = "Cannot start analysis: seed_zip archive is invalid or corrupt. Re-upload analysis.zip."
            save!
            raise InvalidSeedZipError, status_message
          end

          super(no_delay, analysis_type, sanitized_options)
        end
      end

      module AnalysesControllerPatch
        def create
          uploaded_seed = params.dig(:analysis, :seed_zip)
          uploaded_seed_path =
            if uploaded_seed.respond_to?(:tempfile) && uploaded_seed.tempfile.respond_to?(:path)
              uploaded_seed.tempfile.path
            elsif uploaded_seed.respond_to?(:path)
              uploaded_seed.path
            end

          # Some clients create the analysis first and upload seed_zip separately.
          # Only validate the archive during create when a file is actually present.
          return super if uploaded_seed_path.blank?

          begin
            return super unless File.exist?(uploaded_seed_path)

            require "zip"
            zip_has_entries = false
            Zip::File.open(uploaded_seed_path.to_s) do |zip_file|
              zip_has_entries = zip_file.entries.any?
            end
            raise InvalidSeedZipError, "seed_zip archive is empty" unless zip_has_entries
          rescue Zip::Error, Errno::ENOENT => e
            result = {
              code: 422,
              error: "invalid seed_zip archive",
              detail: e.message
            }
            respond_to do |format|
              format.json { render json: result, status: :unprocessable_entity }
              format.html { redirect_to projects_path, notice: "Analysis was NOT created: invalid/corrupt seed zip." }
            end
            return
          end

          super
        end

        def action
          if params[:analysis_action].to_s == "start"
            analysis = Analysis.find(params[:id])
            analysis_type = params[:analysis_type].presence || "batch_run"

            if analysis.seed_zip_required_for?(analysis_type) && !analysis.seed_zip_available?
              analysis.status_message = "Cannot start analysis: missing seed_zip attachment (upload analysis.zip before start)."
              analysis.save!

              result = {
                code: 422,
                error: "missing seed_zip attachment",
                analysis: analysis
              }

              respond_to do |format|
                format.json { render json: result, status: :unprocessable_entity }
                format.html { redirect_to analysis, notice: "Analysis was NOT started: missing seed zip." }
              end
              return
            end

            if analysis.seed_zip_required_for?(analysis_type) && !analysis.seed_zip_integrity_valid?
              analysis.status_message = "Cannot start analysis: seed_zip archive is invalid or corrupt. Re-upload analysis.zip."
              analysis.save!

              result = {
                code: 422,
                error: "invalid seed_zip archive",
                analysis: analysis
              }

              respond_to do |format|
                format.json { render json: result, status: :unprocessable_entity }
                format.html { redirect_to analysis, notice: "Analysis was NOT started: invalid/corrupt seed zip." }
              end
              return
            end
          end

          super
        rescue OpenStudioSeedZipGuard::MissingSeedZipError, OpenStudioSeedZipGuard::InvalidSeedZipError => e
          result = {
            code: 422,
            error: e.message
          }
          respond_to do |format|
            format.json { render json: result, status: :unprocessable_entity }
            format.html { redirect_to analysis_path(params[:id]), notice: e.message }
          end
        end
      end
    end

    Rails.application.config.to_prepare do
      unless Analysis < OpenStudioSeedZipGuard::AnalysisPatch
        Analysis.prepend(OpenStudioSeedZipGuard::AnalysisPatch)
      end

      unless AnalysesController < OpenStudioSeedZipGuard::AnalysesControllerPatch
        AnalysesController.prepend(OpenStudioSeedZipGuard::AnalysesControllerPatch)
      end
    end

  99_resque_requeue_fix.rb: |
    # frozen_string_literal: true

    module OpenStudioResqueRequeueFix
      module Shared
        private

        def enqueue_without_hooks(queue, job_class, *job_args)
          Resque::Job.create(queue, job_class, *job_args)
        end
      end

      module AdminControllerPatch
        include Shared

        def requeue_failed
          Rails.logger.warn "Requeueing Failed Jobs to 'requeued' Queue"

          requeued_count = 0
          skipped_count = 0

          failed_jobs = []
          Resque::Failure.each do |id, failed_job|
            failed_jobs << [id, failed_job]
          end

          failed_jobs.reverse_each do |id, failed_job|
            payload = failed_job['payload'] || {}
            job_class_name = payload['class']
            job_args = Array(payload['args'])

            if job_class_name.blank?
              skipped_count += 1
              Rails.logger.warn "Skipping failed job #{id}: missing payload class"
              next
            end

            begin
              enqueue_without_hooks('requeued', job_class_name.constantize, *job_args)
              Resque::Failure.remove(id)
              requeued_count += 1
            rescue StandardError => e
              skipped_count += 1
              Rails.logger.error "Could not requeue failed job #{id}: #{e.class} #{e.message}"
            end
          end

          Rails.logger.info "#{requeued_count} jobs successfully requeued to 'requeued' queue by requeue_failed"

          respond_to do |format|
            format.html do
              notice = "#{requeued_count} Resque jobs requeued."
              notice += " #{skipped_count} failed jobs were skipped." if skipped_count.positive?
              redirect_to admin_index_path, notice: notice
            end
            format.json do
              render json: {
                message: "#{requeued_count} jobs requeued to 'requeued' queue",
                skipped: skipped_count
              }, status: :ok
            end
          end
        end
      end

      module DataPointsControllerPatch
        include Shared

        def requeue
          Rails.logger.warn 'data_points_controller.REQUEUE'
          @data_point = DataPoint.find(params[:id])
          analysis_id = @data_point.analysis
          Rails.logger.warn "data_points_contoller.REQUEUEing #{@data_point.id}"
          Rails.logger.debug "data_points_controller.id: #{@data_point.id}"
          Rails.logger.debug "data_points_controller.job_id: #{@data_point.job_id}"

          Resque::Job.destroy(:requeue, 'ResqueJobs::RunSimulateDataPoint', @data_point.job_id)
          Resque::Job.destroy(:simulations, 'ResqueJobs::RunSimulateDataPoint', @data_point.job_id)
          enqueue_without_hooks(:requeued, ResqueJobs::RunSimulateDataPoint, @data_point.job_id)
          @data_point.set_queued_state

          respond_to do |format|
            format.html { redirect_to analysis_path(analysis_id), notice: 'DataPoint was successfully requeued.' }
            format.json { head :no_content }
          end
        end

        def requeue_started
          @analysis = Analysis.find(params[:id])
          Rails.logger.warn "Requeueing all NOT completed normal simulations for analysis #{@analysis.id}"
          data_points_to_requeue = @analysis.data_points.where.not(status_message: 'completed normal')

          data_points_to_requeue.each do |dp|
            Rails.logger.warn "Requeueing DataPoint #{dp.id}"
            enqueue_without_hooks(:requeued, ResqueJobs::RunSimulateDataPoint, dp.job_id)
            dp.set_queued_state
          end

          respond_to do |format|
            format.html { redirect_to analysis_path(@analysis), notice: 'Simulations were successfully requeued.' }
            format.json { head :no_content }
          end
        end
      end
    end

    Rails.application.config.to_prepare do
      unless AdminController < OpenStudioResqueRequeueFix::AdminControllerPatch
        AdminController.prepend(OpenStudioResqueRequeueFix::AdminControllerPatch)
      end

      unless DataPointsController < OpenStudioResqueRequeueFix::DataPointsControllerPatch
        DataPointsController.prepend(OpenStudioResqueRequeueFix::DataPointsControllerPatch)
      end
    end
{{- end }}
