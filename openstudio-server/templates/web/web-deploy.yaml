apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstudio.webName" . }}
spec:
  replicas: {{ default 1 (get .Values.web "replicas") }}
  {{- $webStrategy := default (dict) (get .Values.web "strategy") }}
  {{- $webMaxSurge := 1 }}
  {{- if hasKey $webStrategy "maxSurge" }}
  {{- $webMaxSurge = get $webStrategy "maxSurge" }}
  {{- end }}
  {{- $webMaxUnavailable := 0 }}
  {{- if hasKey $webStrategy "maxUnavailable" }}
  {{- $webMaxUnavailable = get $webStrategy "maxUnavailable" }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ default "web" .Values.web.label }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $webMaxSurge }}
      maxUnavailable: {{ $webMaxUnavailable }}
  {{- with (get $webStrategy "minReadySeconds") }}
  minReadySeconds: {{ . }}
  {{- end }}
  {{- with (get $webStrategy "progressDeadlineSeconds") }}
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ default "web" .Values.web.label }}
        release: {{ .Release.Name }}
    {{ $dbContainer := (get .Values.db "container") | default (dict) }}
    {{ $dbContainerPorts := (get $dbContainer "ports") | default (dict) }}
    {{ $webContainer := (get .Values.web "container") | default (dict) }}
    {{ $webReadinessProbe := (get $webContainer "readinessProbe") | default (dict) }}
    {{ $webContainerPorts := (get $webContainer "port") | default (dict) }}
    {{ $webRuntimeOverrides := default (dict) (get .Values.web "runtimeOverrides") }}
    {{ $webInitContainer := default (dict) (get .Values.web "initContainer") }}
    {{ $webInitWaitForDb := default (dict) (get $webInitContainer "waitForDb") }}
    {{ $redis := default (dict) .Values.redis }}
    {{ $priorityClasses := default (dict) .Values.priorityClasses }}
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "web") | nindent 6 }}
      {{- include "openstudio.tolerationsForRole" (dict "root" . "role" "web") | nindent 6 }}
      {{- if eq (include "openstudio.workloadServiceAccountUse" .) "true" }}
      serviceAccountName: {{ include "openstudio.workloadServiceAccountName" . }}
      {{- end }}
      {{- include "openstudio.podImagePullSecrets" . | nindent 6 }}
      {{- include "openstudio.podNodeSelector" (dict "nodeSelector" .Values.web.nodeSelector) | nindent 6 }}
      {{- include "openstudio.podHostAliases" . | nindent 6 }}
      {{- if (default true (get $priorityClasses "enabled")) }}
      priorityClassName: {{ default "high-priority" (get $priorityClasses "highName") }}
      {{- end }}
      initContainers:
          - name: init-wait-for-db
            image: {{ default (include "openstudio.serverImage" .) (get $webInitContainer "image") }}
            imagePullPolicy: {{ default (include "openstudio.defaultWorkloadImagePullPolicy" .) (get $webInitContainer "imagePullPolicy") }}
            volumeMounts:
              - name: nfs
                mountPath: "/mnt/openstudio"
            command:
              - /bin/bash
              - -lc
              - |
                attempts="{{ default 300 (get $webInitWaitForDb "maxAttempts") }}"
                delay_seconds="{{ default 3 (get $webInitWaitForDb "retryDelaySeconds") }}"
                db_host="{{ include "openstudio.dbName" . }}"
                db_port="{{ default 27017 (get $dbContainerPorts "db_port") }}"
                echo "init-wait-for-db: waiting for ${db_host}:${db_port} (attempts=${attempts}, delay=${delay_seconds}s)"
                for i in $(seq 1 "${attempts}"); do
                  if (echo > /dev/tcp/${db_host}/${db_port}) >/dev/null 2>&1; then
                    echo "init-wait-for-db: db reachable on attempt ${i}"
                    break
                  fi
                  if [ "${i}" -eq "${attempts}" ]; then
                    echo "init-wait-for-db: timed out waiting for ${db_host}:${db_port} after ${attempts} attempts"
                    exit 1
                  fi
                  sleep "${delay_seconds}"
                done
                mkdir -p /mnt/openstudio/server/assets/analyses
                chmod 2775 /mnt/openstudio/server
                chmod 2777 /mnt/openstudio/server/assets /mnt/openstudio/server/assets/analyses
                echo "init-wait-for-db: ensured writable permissions on /mnt/openstudio/server/assets/analyses"
      containers:
        - name:  {{ default "web" .Values.web.container.name }}
          image: {{ default (include "openstudio.serverImage" .) .Values.web.container.image }}
          imagePullPolicy: {{ default (include "openstudio.defaultWorkloadImagePullPolicy" .) .Values.web.container.imagePullPolicy }}
          resources:
            requests:
              cpu:  {{  .Values.web.container.resources.requests.cpu  }}
              memory:  {{  .Values.web.container.resources.requests.memory  }}
            {{- if (get (default (dict) .Values.web.container.resources) "limits") }}
            limits:
{{ toYaml .Values.web.container.resources.limits | nindent 14 }}
            {{- end }}
          ports:
            - containerPort: {{ default 80 (get $webContainerPorts "http") }}
            - containerPort: {{ default 443 (get $webContainerPorts "https") }}
          volumeMounts:
            - name: nfs
              mountPath: "/mnt/openstudio"
            {{- if (default false (get $webRuntimeOverrides "enabled")) }}
            - name: web-runtime-overrides
              mountPath: "/opt/openstudio/server/config/initializers/97_seed_zip_idempotent_extract.rb"
              subPath: 97_seed_zip_idempotent_extract.rb
              readOnly: true
            - name: web-runtime-overrides
              mountPath: "/opt/openstudio/server/config/initializers/98_seed_zip_guard.rb"
              subPath: 98_seed_zip_guard.rb
              readOnly: true
            - name: web-runtime-overrides
              mountPath: "/opt/openstudio/server/config/initializers/99_resque_requeue_fix.rb"
              subPath: 99_resque_requeue_fix.rb
              readOnly: true
            {{- end }}
          env:
            - name: OS_SERVER_NUMBER_OF_WORKERS
              value: {{ .Values.rserve.number_of_workers | quote }}
            - name: QUEUES
              value: analysis_wrappers
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyWebSecret" . }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyRedisPassword" . }}
            - name: REDIS_URL
              value: {{ default (printf "redis://:$(REDIS_PASSWORD)@%s:6379" (include "openstudio.redisServiceName" .)) (get $redis "url") | quote }}
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbUsername" . }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbPassword" . }}
            - name: MAX_REQUESTS
              # Sized to worker_hpa.maxReplicas × 1.05 so the web connection pool can
              # handle all possible concurrent worker requests. Changing worker_hpa.maxReplicas
              # in an overlay will also change this value — tune both together.
              value: {{ (ceil (mulf .Values.worker_hpa.maxReplicas 1.05)) | quote }}
            - name: MAX_POOL
              value: {{ (ceil (divf (mulf (trimSuffix "Gi" .Values.web.container.resources.requests.memory) 1024 0.75) .Values.web.passenger_memory_per_process)) | quote }}
          command: ["bash", "-c", "/usr/local/bin/rails-entrypoint && /usr/local/bin/start-server"]
          readinessProbe:
            {{- if (get $webReadinessProbe "tcpSocketPort") }}
            tcpSocket:
              port: {{ get $webReadinessProbe "tcpSocketPort" }}
            {{- else }}
            httpGet:
              path: {{ default "/resque" (get $webReadinessProbe "path") }}
              port: 80
            {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: {{ default 30 (get $webReadinessProbe "timeoutSeconds") }}
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["grep", "-qs", "/mnt/openstudio ",  "/proc/mounts"]
            initialDelaySeconds: 5
            periodSeconds: 200
            timeoutSeconds: 120
            failureThreshold: 3
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: {{ include "openstudio.nfsPvcName" . }}
        {{- if (default false (get $webRuntimeOverrides "enabled")) }}
        - name: web-runtime-overrides
          configMap:
            name: {{ include "openstudio.webName" . }}-runtime-overrides
        {{- end }}
