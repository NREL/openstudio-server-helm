apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.web.name  }}
  labels:
    release: {{ .Release.Name }}
spec:
  {{- if not .Values.web_hpa.enabled }}
  replicas: 1
  {{- end }}
  {{/*
  When web_hpa.enabled is true, omit `replicas` entirely so the HPA (which
  writes via the `scale` subresource) is the sole owner of this field --
  otherwise every `helm upgrade` after the HPA's first scale event conflicts
  with kube-controller-manager on .spec.replicas (see the same issue and fix
  on templates/worker/worker-deploy.yaml). When disabled (the chart default),
  keep the explicit replicas: 1 above so `kubectl scale`/manual edits don't
  silently get reverted by an absent field defaulting differently.
  */}}
  selector:
    matchLabels:
      app: {{ .Values.web.name  }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ .Values.web.name  }}
        release: {{ .Release.Name }}
    spec:
      affinity:
        {{- include "openstudio.nodeGroupAffinity" (dict "root" . "role" "web") | nindent 8 }}
      initContainers:
          - name: init-wait-for-db
            image: {{ .Values.web.initContainer.image | default "alpine" | quote }}
            command: ["/bin/sh", "-c", "for i in $(seq 1 300); do nc -zvw1 {{  .Values.db.name  }} {{ .Values.db.container.ports.db_port }} && exit 0 || sleep 3; done; exit 1"]
      containers:
        - name:  {{ .Values.web.container.name  }}
          image: {{ include "openstudio.imageWithRegistry" (dict "root" $ "image" .Values.web.container.image) | quote }}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu:  {{  .Values.web.container.resources.requests.cpu  }}
              memory:  {{  .Values.web.container.resources.requests.memory  }}
            {{- include "openstudio.resourceLimits" .Values.web.container.resources.limits | nindent 12 }}
          ports:
            - containerPort: {{ .Values.web.container.port.http  }}
            - containerPort: {{ .Values.web.container.port.https  }}
          volumeMounts:
            - name: nfs
              mountPath: "/mnt/openstudio"
          env:
            - name: OS_SERVER_NUMBER_OF_WORKERS
              value: {{ .Values.web_background.number_of_workers | quote }}
            - name: QUEUES
              value: analysis_wrappers
            - name: SECRET_KEY_BASE
              value: {{ .Values.web.secret_key_value | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis_svc.url | quote }}
            - name: MONGO_USER
              value: {{ .Values.db.username | quote }}
            - name: MONGO_PASSWORD
              value: {{ .Values.db.password | quote }}
            - name: OS_SERVER_PROJECT_PATH
              value: "/mnt/openstudio"
            # Point Ruby/Rack/Paperclip temp files at the same NFS filesystem as the
            # final seed_zip destination (APP_CONFIG['server_asset_path'] -> /mnt/openstudio).
            # Otherwise every Paperclip save is a cross-device move: rename(2) fails with
            # EXDEV, and kt-paperclip falls back to a NON-ATOMIC chunked copy written
            # directly onto the final NFS path, which was silently truncating/corrupting
            # ~4-5% of uploaded seed zips at rest. Same filesystem => atomic rename(2).
            - name: TMPDIR
              value: "/mnt/openstudio/tmp"
            - name: MAX_REQUESTS
              value: {{ (ceil (mulf .Values.worker_hpa.maxReplicas 1.05)) | quote }}
            - name: MAX_POOL
              value: {{ (ceil (divf (mulf (trimSuffix "Gi" .Values.web.container.resources.requests.memory) 1024 0.75) .Values.web.passenger_memory_per_process)) | quote }}
          command: ["bash", "-c"]
          args:
            - |
              set -e
              mkdir -p "$TMPDIR"
              grep -q passenger_instance_registry_dir /opt/nginx/conf/nginx.conf || \
                sed -i '/passenger_root /a\    passenger_instance_registry_dir /tmp;\n    passenger_spawn_dir /tmp;' /opt/nginx/conf/nginx.conf
              grep -q passenger_env_var /opt/nginx/conf/nginx.conf || \
                sed -i "/passenger_enabled on;/a\\        passenger_env_var TMPDIR ${TMPDIR};" /opt/nginx/conf/nginx.conf
              /usr/local/bin/rails-entrypoint /usr/local/bin/start-server
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 200
            timeoutSeconds: 120
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["grep", "-qs", "/mnt/openstudio ",  "/proc/mounts"]
            initialDelaySeconds: 5
            periodSeconds: 200
            timeoutSeconds: 120
            failureThreshold: 3
      priorityClassName: high-priority
      terminationGracePeriodSeconds: 60
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: nfs-pvc