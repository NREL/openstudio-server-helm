apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.web.name  }}
  labels:
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.web.name  }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ .Values.web.name  }}
        release: {{ .Release.Name }}
    spec:
      affinity:
        {{- include "openstudio.nodeGroupAffinity" (dict "root" . "role" "web") | nindent 8 }}
      initContainers:
          - name: init-wait-for-db
            image: {{ get (default (dict) .Values.web.initContainer) "image" | default "alpine" | quote }}
            command: ["/bin/sh", "-c", "for i in $(seq 1 300); do nc -zvw1 {{  .Values.db.name  }} {{ .Values.db.container.ports.db_port }} && exit 0 || sleep 3; done; exit 1"]
      containers:
        - name:  {{ .Values.web.container.name  }}
          image: {{ include "openstudio.imageWithRegistry" (dict "root" $ "image" .Values.web.container.image) | quote }}
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu:  {{  .Values.web.container.resources.requests.cpu  }}
              memory:  {{  .Values.web.container.resources.requests.memory  }}
            {{- include "openstudio.resourceLimits" .Values.web.container.resources.limits | nindent 12 }}
          ports:
            - containerPort: {{ .Values.web.container.port.http  }}
            - containerPort: {{ .Values.web.container.port.https  }}
          volumeMounts:
            - name: nfs
              mountPath: "/mnt/openstudio"
          env:
            - name: OS_SERVER_NUMBER_OF_WORKERS
              value: {{ .Values.web_background.number_of_workers | quote }}
            - name: QUEUES
              value: analysis_wrappers
            - name: SECRET_KEY_BASE
              value: {{ .Values.web.secret_key_value | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis_svc.url | quote }}
            - name: MONGO_USER
              value: {{ .Values.db.username | quote }}
            - name: MONGO_PASSWORD
              value: {{ .Values.db.password | quote }}
            - name: MAX_REQUESTS
              value: {{ (ceil (mulf .Values.worker_hpa.maxReplicas 1.05)) | quote }}
            {{- /* Passenger pool sizing, derived automatically -- users only size
               the container. Memory source prefers limits.memory (a hard cap;
               exceeding it OOMKills the container) and falls back to
               requests.memory when no limit is set. The reserve covers
               non-Passenger residents of this container (nginx, Passenger core,
               the analysis_wrappers resque worker); per-process cost is the
               MEASURED loaded RSS of one Rails process (see
               web.passenger_memory_per_process in values.yaml). */}}
            {{- $webMem := .Values.web.container.resources.requests.memory }}
            {{- if and .Values.web.container.resources.limits .Values.web.container.resources.limits.memory }}
            {{- $webMem = .Values.web.container.resources.limits.memory }}
            {{- end }}
            {{- $memMib := int (include "openstudio.parseMemoryToMiB" $webMem) }}
            {{- $reserve := int (.Values.web.passenger_memory_reserve_mb | default 1500) }}
            {{- $perProcess := int (.Values.web.passenger_memory_per_process | default 1100) }}
            {{- $pool := div (max (sub $memMib $reserve) 0) $perProcess }}
            {{- if lt $pool 2 }}{{- $pool = 2 }}{{- end }}
            - name: MAX_POOL
              value: {{ $pool | quote }}
          command: ["bash", "-c", "/usr/local/bin/rails-entrypoint && /usr/local/bin/start-server"]
          # App health probes.
          #
          # Why exec + a deliberately-unrouted path instead of httpGet /:
          #   * GET / is PagesController#dashboard, which renders EVERY analysis
          #     unpaginated. Measured on a cluster with ~950 analyses it spends
          #     55-70s per request in MongoDB (full scans of os_docker.data_points).
          #     Using it as a probe both amplified the exact load we are trying
          #     to reduce and made probe timing unusable (periodSeconds had to
          #     exceed the worst-case render, so a dead web took ~35 minutes to
          #     be marked unready).
          #   * A Kubernetes httpGet probe treats non-2xx/3xx as failure, so a
          #     cheap 404 route cannot be expressed with httpGet. An exec curl
          #     accepts HTTP 200 OR 404 as healthy: the request still traverses
          #     nginx -> Passenger -> Rails router (proving the full serving
          #     stack) but never reaches Mongo-heavy controllers. Measured cost:
          #     ~2-4ms per probe under full dashboard load.
          #
          # startupProbe gives Rails/Passenger a generous boot window before
          # liveness kills the container; readiness/liveness then use tight
          # timings so an overloaded web is pulled from the Service endpoints
          # within ~1 minute instead of ~35.
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  c=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1/__kube_probe__ || true);
                  [ "$c" = "404" ] || [ "$c" = "200" ]
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  c=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1/__kube_probe__ || true);
                  [ "$c" = "404" ] || [ "$c" = "200" ]
            periodSeconds: 20
            timeoutSeconds: 6
            failureThreshold: 3
          # Keep the NFS mount guard (workers and the web resque worker need
          # /mnt/openstudio alive) AND add an app-level check so a hung
          # Passenger/nginx actually restarts instead of serving errors forever.
          # Deliberately NOT part of readiness: transient NFS blips should not
          # flap the single web pod off the load balancer.
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  grep -qs "/mnt/openstudio " /proc/mounts &&
                  c=$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1/__kube_probe__ || true);
                  [ "$c" = "404" ] || [ "$c" = "200" ]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      priorityClassName: high-priority
      terminationGracePeriodSeconds: 60
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: nfs-pvc
