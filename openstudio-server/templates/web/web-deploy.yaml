apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstudio.webName" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ default "web" .Values.web.label }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ default "web" .Values.web.label }}
        release: {{ .Release.Name }}
    {{ $dbContainer := (get .Values.db "container") | default (dict) }}
    {{ $dbContainerPorts := (get $dbContainer "ports") | default (dict) }}
    {{ $webContainer := (get .Values.web "container") | default (dict) }}
    {{ $webContainerPorts := (get $webContainer "port") | default (dict) }}
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "web") | nindent 6 }}
      initContainers:
          - name: init-wait-for-db
            image: alpine
            command: ["/bin/sh", "-c", "for i in $(seq 1 300); do nc -zvw1 {{ include "openstudio.dbName" . }} {{ default 27017 (get $dbContainerPorts "db_port") }} && exit 0 || sleep 3; done; exit 1"]
      containers:
        - name:  {{ default "web" .Values.web.container.name }}
          image: {{ default (include "openstudio.serverImage" .) .Values.web.container.image }}
          imagePullPolicy: Always
          resources:
            requests:
              cpu:  {{  .Values.web.container.resources.requests.cpu  }}
              memory:  {{  .Values.web.container.resources.requests.memory  }}
          ports:
            - containerPort: {{ default 80 (get $webContainerPorts "http") }}
            - containerPort: {{ default 443 (get $webContainerPorts "https") }}
          volumeMounts:
            - name: nfs
              mountPath: "/mnt/openstudio"
          env:
            - name: OS_SERVER_NUMBER_OF_WORKERS
              value: {{ .Values.rserve.number_of_workers | quote }}
            - name: QUEUES
              value: analysis_wrappers
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyWebSecret" . }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyRedisPassword" . }}
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@{{ include "openstudio.redisServiceName" . }}:6379
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbUsername" . }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbPassword" . }}
            - name: MAX_REQUESTS
              value: {{ (ceil (mulf .Values.worker_hpa.maxReplicas 1.05)) | quote }}
            - name: MAX_POOL
              value: {{ (ceil (divf (mulf (trimSuffix "Gi" .Values.web.container.resources.requests.memory) 1024 0.75) .Values.web.passenger_memory_per_process)) | quote }}
          command: ["bash", "-c", "/usr/local/bin/rails-entrypoint && /usr/local/bin/start-server"]
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 200
            timeoutSeconds: 120
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["grep", "-qs", "/mnt/openstudio ",  "/proc/mounts"]
            initialDelaySeconds: 5
            periodSeconds: 200
            timeoutSeconds: 120
            failureThreshold: 3
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: nfs-pvc
