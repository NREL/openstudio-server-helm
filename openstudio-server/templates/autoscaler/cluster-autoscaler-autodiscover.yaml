{{- $providerName := include "openstudio.providerName" . -}}
{{- $autoscaler := default (dict) .Values.autoscaler -}}
{{- $autoscalerEnabled := default (eq $providerName "aws") (get $autoscaler "enabled") -}}
{{- $openstackNodeGroups := default (list) (get $autoscaler "openstackNodeGroups") -}}
{{- $autoscalerImage := default (dict) (get $autoscaler "image") -}}
{{- $kubeMinor := regexFind "^[0-9]+" .Capabilities.KubeVersion.Minor -}}
{{- $defaultAutoscalerTag := printf "v%s.%s.0" .Capabilities.KubeVersion.Major $kubeMinor -}}
{{- $autoscalerImageTag := default $defaultAutoscalerTag (get $autoscalerImage "tag") -}}
{{- $autoscalerImageRepo := default "registry.k8s.io/autoscaling/cluster-autoscaler" (get $autoscalerImage "repository") -}}
{{- $autoscalerImagePullPolicy := default "IfNotPresent" (get $autoscalerImage "pullPolicy") -}}
{{- $expectedTagPrefix := printf "v%s.%s." .Capabilities.KubeVersion.Major $kubeMinor -}}
{{- $openstackAutoscaler := default (dict) (get $autoscaler "openstack") -}}
{{- $cloudConfigSecretName := default "" (get $openstackAutoscaler "cloudConfigSecretName") -}}
{{- $cloudConfigSecretKey := default "cloud.conf" (get $openstackAutoscaler "cloudConfigSecretKey") -}}
{{- $cloudConfigMountPath := default "/etc/kubernetes/cloud.conf" (get $openstackAutoscaler "cloudConfigMountPath") -}}
{{- $caBundleSecretName := default "" (get $openstackAutoscaler "caBundleSecretName") -}}
{{- $caBundleSecretKey := default "ca.crt" (get $openstackAutoscaler "caBundleSecretKey") -}}
{{- $caBundleMountPath := default "/etc/ssl/certs/openstack-ca.crt" (get $openstackAutoscaler "caBundleMountPath") -}}
{{- $checkExistingOwnership := default true (get $openstackAutoscaler "checkExistingDeploymentOwnership") -}}
{{- $autoscalerExpander := default "least-waste" (get $autoscaler "expander") -}}
{{- $priorityExpander := default (dict) (get $autoscaler "priorityExpander") -}}
{{- $priorityExpanderEnabled := default false (get $priorityExpander "enabled") -}}
{{- $priorityExpanderConfig := default "" (get $priorityExpander "config") -}}
{{- $extraArgs := default (list) (get $autoscaler "extraArgs") -}}
{{- $hasCloudConfigArg := false -}}
{{- range $arg := $extraArgs -}}
  {{- if regexMatch "^--cloud-config=.*" (printf "%v" $arg) -}}
    {{- $hasCloudConfigArg = true -}}
  {{- end -}}
{{- end -}}
{{- if and $autoscalerEnabled (eq $providerName "openstack") (eq (len $openstackNodeGroups) 0) -}}
{{- fail "autoscaler.enabled=true for OpenStack requires autoscaler.openstackNodeGroups with at least one {name,min,max} entry." -}}
{{- end -}}
{{- if and $autoscalerEnabled (not (hasPrefix $expectedTagPrefix $autoscalerImageTag)) -}}
{{- fail (printf "autoscaler.image.tag=%q should match cluster minor version prefix %q for compatibility with Kubernetes %s. Set autoscaler.image.tag explicitly." $autoscalerImageTag $expectedTagPrefix .Capabilities.KubeVersion.Version) -}}
{{- end -}}
{{- if and $autoscalerEnabled (eq $providerName "openstack") (eq $cloudConfigSecretName "") (not $hasCloudConfigArg) -}}
{{- fail "OpenStack autoscaler requires cloud config. Set autoscaler.openstack.cloudConfigSecretName or provide --cloud-config=<path> in autoscaler.extraArgs." -}}
{{- end -}}
{{- if and $autoscalerEnabled $priorityExpanderEnabled (ne $autoscalerExpander "priority") -}}
{{- fail "autoscaler.priorityExpander.enabled=true requires autoscaler.expander=priority." -}}
{{- end -}}
{{- if and $autoscalerEnabled $priorityExpanderEnabled (eq (trim $priorityExpanderConfig) "") -}}
{{- fail "autoscaler.priorityExpander.enabled=true requires autoscaler.priorityExpander.config to be a non-empty YAML mapping string." -}}
{{- end -}}
{{- if and $autoscalerEnabled (eq $providerName "openstack") $checkExistingOwnership -}}
{{- $existingAutoscaler := lookup "apps/v1" "Deployment" "kube-system" "cluster-autoscaler" -}}
{{- if $existingAutoscaler -}}
{{- $existingMetadata := default (dict) (get $existingAutoscaler "metadata") -}}
{{- $existingAnnotations := default (dict) (get $existingMetadata "annotations") -}}
{{- $existingReleaseName := default "" (get $existingAnnotations "meta.helm.sh/release-name") -}}
{{- $existingReleaseNamespace := default "" (get $existingAnnotations "meta.helm.sh/release-namespace") -}}
{{- if not (and (eq $existingReleaseName .Release.Name) (eq $existingReleaseNamespace .Release.Namespace)) -}}
{{- fail "autoscaler.enabled=true on OpenStack conflicts with an existing kube-system/cluster-autoscaler deployment not owned by this release. Use Azimuth/platform autoscaling only, or remove the existing deployment before enabling chart autoscaler." -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if $autoscalerEnabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
  name: cluster-autoscaler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update"]
  - apiGroups: [""]
    resources:
      - "namespaces"
      - "pods"
      - "services"
      - "replicationcontrollers"
      - "persistentvolumeclaims"
      - "persistentvolumes"
    verbs: ["watch", "list", "get"]
  - apiGroups: ["extensions"]
    resources: ["replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "daemonsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch", "extensions"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resourceNames: ["cluster-autoscaler"]
    resources: ["leases"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create","list","watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-autoscaler-status", "cluster-autoscaler-priority-expander"]
    verbs: ["delete", "get", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

{{- if $priorityExpanderEnabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-priority-expander
  namespace: kube-system
  labels:
    app: cluster-autoscaler
data:
  priorities: |
{{ $priorityExpanderConfig | nindent 4 }}
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8085'
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "web") | nindent 6 }}
      serviceAccountName: cluster-autoscaler
      containers:
        - image: {{ printf "%s:%s" $autoscalerImageRepo $autoscalerImageTag }}
          name: cluster-autoscaler
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 1000m
              memory: 2Gi
          command:
            - ./cluster-autoscaler
            - --v=4
            - --stderrthreshold=info
            - --cloud-provider={{ $providerName }}
            - --skip-nodes-with-local-storage=false
            - --expander={{ $autoscalerExpander }}
            {{- if eq $providerName "aws" }}
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled,k8s.io/cluster-autoscaler/{{ .Values.cluster.name }}
            {{- else if eq $providerName "openstack" }}
            {{- range $group := $openstackNodeGroups }}
            - --nodes={{ required "autoscaler.openstackNodeGroups[].min is required when autoscaler is enabled for openstack" $group.min }}:{{ required "autoscaler.openstackNodeGroups[].max is required when autoscaler is enabled for openstack" $group.max }}:{{ required "autoscaler.openstackNodeGroups[].name is required when autoscaler is enabled for openstack" $group.name }}
            {{- end }}
            {{- if and (ne $cloudConfigSecretName "") (not $hasCloudConfigArg) }}
            - --cloud-config={{ $cloudConfigMountPath }}
            {{- end }}
            {{- end }}
            {{- range $arg := $extraArgs }}
            - {{ $arg }}
            {{- end }}
            - --scale-down-unneeded-time=5m
          {{- if and (eq $providerName "openstack") (ne $caBundleSecretName "") }}
          env:
            - name: SSL_CERT_FILE
              value: {{ $caBundleMountPath | quote }}
          {{- end }}
          imagePullPolicy: {{ $autoscalerImagePullPolicy | quote }}
          {{- if and (eq $providerName "openstack") (or (ne $cloudConfigSecretName "") (ne $caBundleSecretName "")) }}
          volumeMounts:
            {{- if ne $cloudConfigSecretName "" }}
            - name: openstack-cloud-config
              mountPath: {{ $cloudConfigMountPath | quote }}
              subPath: {{ $cloudConfigSecretKey | quote }}
              readOnly: true
            {{- end }}
            {{- if ne $caBundleSecretName "" }}
            - name: openstack-ca-bundle
              mountPath: {{ $caBundleMountPath | quote }}
              subPath: {{ $caBundleSecretKey | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if and (eq $providerName "openstack") (or (ne $cloudConfigSecretName "") (ne $caBundleSecretName "")) }}
      volumes:
        {{- if ne $cloudConfigSecretName "" }}
        - name: openstack-cloud-config
          secret:
            secretName: {{ $cloudConfigSecretName | quote }}
        {{- end }}
        {{- if ne $caBundleSecretName "" }}
        - name: openstack-ca-bundle
          secret:
            secretName: {{ $caBundleSecretName | quote }}
        {{- end }}
      {{- end }}
{{- end }}
