{{- $nfsPvc := default (dict) (get .Values "nfs_pvc") -}}
{{- $existingPVC := lookup "v1" "PersistentVolumeClaim" .Release.Namespace (include "openstudio.nfsPvcName" .) -}}
{{- $existingSpec := default (dict) (get $existingPVC "spec") -}}
{{- /* Support both storageClass (preferred) and legacy storage_class key */ -}}
{{- $storageClassName := default (default "nfs" (get $nfsPvc "storage_class")) (get $nfsPvc "storageClass") -}}
{{- if $existingPVC -}}
{{- $storageClassName = default $storageClassName (get $existingSpec "storageClassName") -}}
{{- end -}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "openstudio.nfsPvcName" . }}
spec:
  accessModes:
{{- range $mode := default (list "ReadWriteMany") (get $nfsPvc "accessModes") }}
    - {{ $mode }}
{{- end }}
  storageClassName: {{ $storageClassName | quote }}
  resources:
    requests:
      storage: {{ default "2Gi" (get $nfsPvc "storage") | quote }}