{{/*
ClusterIP Service fronting the kernel NFS server pod.

OPENSTACK-ONLY (see nfsKernelServer in values.yaml).

IDENTITY MIGRATION NOTE: on clusters migrated from Ganesha, the client PV's
spec.nfs.server pins a ClusterIP (immutable field -- PV sources can no longer
be patched). To keep that PV valid without any claim/PV surgery, this Service
can adopt the LEGACY Service's exact name AND ClusterIP:

  nfsKernelServer.service:
    name: openstudio-server-nfs-server-provisioner   # legacy identity
    clusterIP: "172.28.43.124"                       # legacy VIP

The orphaned legacy Service object must be deleted once by hand first (Helm
does not remove resources dropped from a release manifest); after that one
cutover the release owns this identity permanently. Fresh installs leave
service.name/clusterIP empty and get "<release>-nfs-kernel" with an
auto-allocated VIP (client PVs then use the static-share PV which points at
the Service DNS name instead).

rquotad/875 is declared for parity but intentionally has no listener (see
nfs-kernel-deploy.yaml header).
*/}}
{{- $svcName := default (include "openstudio.nfsKernelFullname" .) .Values.nfsKernelServer.service.name -}}
{{- if and (eq .Values.provider.name "openstack") .Values.nfsKernelServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    app: {{ include "openstudio.nfsKernelFullname" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: ClusterIP
  {{- if .Values.nfsKernelServer.service.clusterIP }}
  # Pinned legacy VIP so existing client PVs keep mounting unchanged.
  clusterIP: {{ .Values.nfsKernelServer.service.clusterIP | quote }}
  {{- end }}
  selector:
    app: {{ include "openstudio.nfsKernelFullname" . }}
    release: {{ .Release.Name }}
  ports:
    - { name: nfs,          port: 2049,  targetPort: nfs,          protocol: TCP }
    - { name: nfs-udp,      port: 2049,  targetPort: nfs-udp,      protocol: UDP }
    - { name: nlockmgr,     port: 32803, targetPort: nlockmgr,     protocol: TCP }
    - { name: nlockmgr-udp, port: 32803, targetPort: nlockmgr-udp, protocol: UDP }
    - { name: mountd,       port: 20048, targetPort: mountd,       protocol: TCP }
    - { name: mountd-udp,   port: 20048, targetPort: mountd-udp,   protocol: UDP }
    - { name: rquotad,      port: 875,   targetPort: rquotad,      protocol: TCP }
    - { name: rquotad-udp,  port: 875,   targetPort: rquotad-udp,  protocol: UDP }
    - { name: rpcbind,      port: 111,   targetPort: rpcbind,      protocol: TCP }
    - { name: rpcbind-udp,  port: 111,   targetPort: rpcbind-udp,  protocol: UDP }
    - { name: statd,        port: 662,   targetPort: statd,        protocol: TCP }
    - { name: statd-udp,    port: 662,   targetPort: statd-udp,    protocol: UDP }
{{- end }}
