{{- $hooks := default (dict) .Values.hooks -}}
{{- $preDeleteHook := default (dict) (get $hooks "preDeleteCleanup") -}}
{{- if default true (get $preDeleteHook "enabled") }}
{{- $cleanupName := printf "%s-nfs-client-cleanup" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $cleanupServiceAccount := printf "%s-sa" $cleanupName | trunc 63 | trimSuffix "-" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cleanupServiceAccount }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $cleanupServiceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $cleanupName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      name: nfs-client-cleanup
    spec:
      serviceAccountName: {{ $cleanupServiceAccount }}
      containers:
        - name: kubectl
          image: "bitnami/kubectl:1.31"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          imagePullPolicy: "IfNotPresent"
          command:
          - /bin/sh
          - -c
          - >
              kubectl -n {{ .Release.Namespace }} delete deployment {{ include "openstudio.webName" . }} --ignore-not-found=true --wait=true --timeout=180s;
              kubectl -n {{ .Release.Namespace }} delete deployment {{ include "openstudio.webBackgroundName" . }} --ignore-not-found=true --wait=true --timeout=180s;
              kubectl -n {{ .Release.Namespace }} delete deployment {{ include "openstudio.rserveName" . }} --ignore-not-found=true --wait=true --timeout=180s;
      restartPolicy: Never
{{- end }}
