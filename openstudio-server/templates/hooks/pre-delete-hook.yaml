{{- $preDeleteHook := default (dict) .Values.hooks.preDeleteCleanup -}}
{{- if default true (get $preDeleteHook "enabled") }}
{{- $cleanupName := printf "%s-nfs-client-cleanup" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $cleanupServiceAccount := printf "%s-sa" $cleanupName | trunc 63 | trimSuffix "-" -}}
{{- $cleanupImageRaw := default "docker.io/bitnami/kubectl:1.31" (get $preDeleteHook "image") -}}
{{- $cleanupImage := include "openstudio.imageWithRegistry" (dict "root" . "image" $cleanupImageRaw) -}}
{{- $cleanupImagePullPolicy := default (include "openstudio.defaultWorkloadImagePullPolicy" .) (get $preDeleteHook "imagePullPolicy") -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $cleanupServiceAccount }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
subjects:
  - kind: ServiceAccount
    name: {{ $cleanupServiceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $cleanupName }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $cleanupName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      name: nfs-client-cleanup
    spec:
      serviceAccountName: {{ $cleanupServiceAccount }}
      {{- include "openstudio.podImagePullSecrets" . | nindent 6 }}
      containers:
        - name: kubectl
          image: {{ $cleanupImage | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          imagePullPolicy: {{ $cleanupImagePullPolicy | quote }}
          command:
          - /bin/sh
          - -c
          - |
              set -eu
              for deployment in \
                {{ include "openstudio.webName" . }} \
                {{ include "openstudio.webBackgroundName" . }} \
                {{ include "openstudio.workerName" . }} \
                {{ include "openstudio.rserveName" . }}; do
                kubectl -n {{ .Release.Namespace }} delete deployment "${deployment}" --ignore-not-found=true --wait=false
              done
              kubectl -n {{ .Release.Namespace }} delete daemonset {{ .Release.Name }}-image-prepull --ignore-not-found=true --wait=false
      restartPolicy: Never
{{- end }}
