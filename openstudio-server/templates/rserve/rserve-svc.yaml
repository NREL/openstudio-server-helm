apiVersion: v1
kind: Service
metadata:
  name: {{ include "openstudio.rserveServiceName" . }}
spec:
  selector:
    app: {{ default (default "rserve" .Values.rserve.label) .Values.rserve_svc.label }}
    release: {{ .Release.Name }}
  ports:
    - name: rserve
      protocol: TCP
      port: {{ default 6311 .Values.rserve_svc.port }}
