apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstudio.rserveName" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ default "rserve" .Values.rserve.label }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ default "rserve" .Values.rserve.label }}
        release: {{ .Release.Name }}
    {{ $priorityClasses := default (dict) .Values.priorityClasses }}
    {{ $redis := default (dict) .Values.redis }}
    {{ $rserve := default (dict) .Values.rserve }}
    {{ $rserveContainer := default (dict) (get $rserve "container") }}
    {{ $rservePreStop := default (dict) (get $rserveContainer "preStop") }}
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "worker") | nindent 6 }}
      {{- include "openstudio.tolerationsForRole" (dict "root" . "role" "worker") | nindent 6 }}
      {{- if eq (include "openstudio.workloadServiceAccountUse" .) "true" }}
      serviceAccountName: {{ include "openstudio.workloadServiceAccountName" . }}
      {{- end }}
      {{- include "openstudio.podImagePullSecrets" . | nindent 6 }}
      {{- include "openstudio.podNodeSelector" (dict "nodeSelector" .Values.rserve.nodeSelector) | nindent 6 }}
      {{- include "openstudio.podHostAliases" . | nindent 6 }}
      {{- if (default true (get $priorityClasses "enabled")) }}
      priorityClassName: {{ default "high-priority" (get $priorityClasses "highName") }}
      {{- end }}
      containers:
        - name: {{ default "rserve" .Values.rserve.container.name }}
          image: {{ default (include "openstudio.rserveImage" .) .Values.rserve.container.image }}
          imagePullPolicy: {{ default (include "openstudio.defaultWorkloadImagePullPolicy" .) .Values.rserve.container.imagePullPolicy }}
{{- if (default true (get $rservePreStop "enabled")) }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    set +e
                    sleep {{ default 10 (get $rservePreStop "sleepSeconds") }}
                    exit 0
{{- end }}
          resources:
            requests:
              cpu:  {{  .Values.rserve.container.resources.requests.cpu  }}
              memory:  {{  .Values.rserve.container.resources.requests.memory  }}
            {{- if (get (default (dict) .Values.rserve.container.resources) "limits") }}
            limits:
{{ toYaml .Values.rserve.container.resources.limits | nindent 14 }}
            {{- end }}
          volumeMounts:
            - name: osdata
              mountPath: "/mnt/openstudio"
          env:
             - name: OS_SERVER_NUMBER_OF_WORKERS
               value: {{ .Values.rserve.number_of_workers | quote }}
             - name: SECRET_KEY_BASE
               valueFrom:
                 secretKeyRef:
                   name: {{ include "openstudio.secretName" . }}
                   key: {{ include "openstudio.secretKeyWebSecret" . }}
             - name: REDIS_PASSWORD
               valueFrom:
                 secretKeyRef:
                   name: {{ include "openstudio.secretName" . }}
                   key: {{ include "openstudio.secretKeyRedisPassword" . }}
             - name: REDIS_URL
               value: {{ default (printf "redis://:$(REDIS_PASSWORD)@%s:6379" (include "openstudio.redisServiceName" .)) (get $redis "url") | quote }}
             - name: MONGO_USER
               valueFrom:
                 secretKeyRef:
                   name: {{ include "openstudio.secretName" . }}
                   key: {{ include "openstudio.secretKeyDbUsername" . }}
             - name: MONGO_PASSWORD
               valueFrom:
                 secretKeyRef:
                   name: {{ include "openstudio.secretName" . }}
                   key: {{ include "openstudio.secretKeyDbPassword" . }}
          livenessProbe:
            exec:
              command: ["grep", "-qs", "/mnt/openstudio ",  "/proc/mounts"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
      terminationGracePeriodSeconds: {{ default 90 (get $rserveContainer "terminationGracePeriodSeconds") }}
      volumes:
        - name: osdata
          persistentVolumeClaim:
            claimName: {{ include "openstudio.nfsPvcName" . }}
