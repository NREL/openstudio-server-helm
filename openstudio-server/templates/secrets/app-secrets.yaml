{{- $secrets := default (dict) .Values.secrets -}}
{{- $existingSecret := default "" (get $secrets "existingSecret") -}}
{{- $create := true -}}
{{- $validateExistingSecret := default false (get $secrets "validateExistingSecret") -}}
{{- if hasKey $secrets "create" -}}
{{- $create = (get $secrets "create") -}}
{{- end -}}
{{- if and (ne $existingSecret "") $create -}}
{{- fail "secrets.existingSecret and secrets.create=true cannot both be set; choose one secret source" -}}
{{- end -}}
{{- if and (ne $existingSecret "") (not $create) $validateExistingSecret -}}
{{- if not (lookup "v1" "Secret" .Release.Namespace $existingSecret) -}}
{{- fail (printf "secrets.existingSecret=%q was not found in namespace %q. Create it first or disable secrets.validateExistingSecret." $existingSecret .Release.Namespace) -}}
{{- end -}}
{{- end -}}
{{- if and (eq $existingSecret "") $create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openstudio.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: openstudio-server
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ include "openstudio.secretKeyDbUsername" . }}: {{ required "db.username must be set to a non-empty value when secrets.create=true" .Values.db.username | quote }}
  {{ include "openstudio.secretKeyDbPassword" . }}: {{ required "db.password must be set to a non-empty value when secrets.create=true" .Values.db.password | quote }}
  {{ include "openstudio.secretKeyRedisPassword" . }}: {{ required "redis.password must be set to a non-empty value when secrets.create=true" .Values.redis.password | quote }}
  {{ include "openstudio.secretKeyWebSecret" . }}: {{ required "web.secret_key_value must be set to a non-empty value when secrets.create=true" .Values.web.secret_key_value | quote }}
{{- end }}
