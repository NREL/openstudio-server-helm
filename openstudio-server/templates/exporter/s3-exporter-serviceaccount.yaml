{{- if and .Values.s3_exporter.enabled .Values.s3_exporter.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.s3_exporter.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  {{- if or .Values.s3_exporter.serviceAccount.roleArn .Values.s3_exporter.serviceAccount.annotations }}
  annotations:
    {{- if .Values.s3_exporter.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.s3_exporter.serviceAccount.roleArn | quote }}
    {{- end }}
    {{- with .Values.s3_exporter.serviceAccount.annotations }}
{{ toYaml . | indent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
