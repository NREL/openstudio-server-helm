{{- if eq (include "openstudio.webBackgroundAutoscalingMode" .) "keda" }}
{{- $root := . -}}
{{- $bgAutoscaling := default (dict) .Values.web_background_autoscaling -}}
{{- $keda := default (dict) (get $bgAutoscaling "keda") -}}
{{- $bgHpa := default (dict) .Values.web_background_hpa -}}
{{- $behavior := default (dict) (get $bgHpa "behavior") -}}
{{- $scaleUp := default (dict) (get $behavior "scaleUp") -}}
{{- $scaleDown := default (dict) (get $behavior "scaleDown") -}}
{{- $defaultScaleUpPolicies := list (dict "type" "Pods" "value" 2 "periodSeconds" 30) -}}
{{- $defaultScaleDownPolicies := list (dict "type" "Percent" "value" 25 "periodSeconds" 60) -}}
{{- $scaleUpPolicies := default $defaultScaleUpPolicies (get $scaleUp "policies") -}}
{{- $scaleDownPolicies := default $defaultScaleDownPolicies (get $scaleDown "policies") -}}
{{- $queueNames := default (list "analyses") (get $keda "queueNames") -}}
{{- $kedaAddress := default (printf "%s.%s.svc.cluster.local:6379" (include "openstudio.redisServiceName" .) .Release.Namespace) (get $keda "redisAddress") -}}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "openstudio.webBackgroundName" . }}-keda-redis-auth
spec:
  secretTargetRef:
    - parameter: password
      name: {{ include "openstudio.secretName" . }}
      key: {{ include "openstudio.secretKeyRedisPassword" . }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "openstudio.webBackgroundName" . }}
spec:
  scaleTargetRef:
    kind: Deployment
    name: {{ include "openstudio.webBackgroundName" . }}
  minReplicaCount: {{ default 3 (get $bgHpa "minReplicas") }}
  maxReplicaCount: {{ default 32 (get $bgHpa "maxReplicas") }}
  pollingInterval: {{ default 15 (get $keda "pollingIntervalSeconds") }}
  cooldownPeriod: {{ default 300 (get $keda "cooldownPeriodSeconds") }}
  {{- $advanced := default (dict) (get $keda "advanced") }}
  advanced:
    restoreToOriginalReplicaCount: {{ default false (get $advanced "restoreToOriginalReplicaCount") }}
    horizontalPodAutoscalerConfig:
      name: {{ include "openstudio.webBackgroundName" . }}
      behavior:
        scaleUp:
          stabilizationWindowSeconds: {{ default 60 (get $scaleUp "stabilizationWindowSeconds") }}
          policies:
{{ toYaml $scaleUpPolicies | nindent 10 }}
          selectPolicy: {{ default "Max" (get $scaleUp "selectPolicy") }}
        scaleDown:
          stabilizationWindowSeconds: {{ default (get $bgHpa "stabilizationWindowSeconds") (get $scaleDown "stabilizationWindowSeconds") }}
          policies:
{{ toYaml $scaleDownPolicies | nindent 10 }}
          selectPolicy: {{ default "Max" (get $scaleDown "selectPolicy") }}
  {{- $fallback := default (dict) (get $keda "fallback") }}
  {{- if and (hasKey $fallback "failureThreshold") (hasKey $fallback "replicas") }}
  fallback:
    failureThreshold: {{ get $fallback "failureThreshold" }}
    replicas: {{ get $fallback "replicas" }}
  {{- end }}
  triggers:
    {{- range $queueName := $queueNames }}
    - type: redis
      metadata:
        address: {{ $kedaAddress | quote }}
        listName: {{ printf "resque:queue:%s" $queueName | quote }}
        listLength: {{ default "12" (get $keda "queueLengthPerPod") | quote }}
        activationListLength: {{ default "3" (get $keda "activationQueueLength") | quote }}
      authenticationRef:
        name: {{ include "openstudio.webBackgroundName" $root }}-keda-redis-auth
    {{- end }}
{{- end }}
