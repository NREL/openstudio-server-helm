apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstudio.webBackgroundName" . }}
spec:
  replicas: {{  .Values.web_background.replicas  }}
  selector:
    matchLabels:
      app: {{ default "web-background" .Values.web_background.label }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ default "web-background" .Values.web_background.label }}
        release: {{ .Release.Name }}
    {{ $priorityClasses := default (dict) .Values.priorityClasses }}
    {{ $redis := default (dict) .Values.redis }}
    {{ $webBackgroundContainer := default (dict) .Values.web_background.container }}
    {{ $webBackgroundStartup := default (dict) (get $webBackgroundContainer "startup") }}
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "web") | nindent 6 }}
      {{- if (default true (get $priorityClasses "enabled")) }}
      priorityClassName: {{ default "high-priority" (get $priorityClasses "highName") }}
      {{- end }}
      containers:
        - name:  {{ default "web-background" .Values.web_background.container.name }}
          image: {{ default (include "openstudio.serverImage" .) .Values.web_background.container.image }}
          imagePullPolicy: Always
          resources:
            requests:
              cpu:  {{  .Values.web_background.container.resources.requests.cpu  }}
              memory:  {{  .Values.web_background.container.resources.requests.memory  }}
          volumeMounts:
            - name: nfs
              mountPath: "/mnt/openstudio"
          env:
            - name: OS_SERVER_NUMBER_OF_WORKERS
              value: {{ .Values.rserve.number_of_workers | quote }}
            - name: QUEUES
              value: background,analyses
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyWebSecret" . }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyRedisPassword" . }}
            - name: REDIS_URL
              value: {{ default (printf "redis://:$(REDIS_PASSWORD)@%s:6379" (include "openstudio.redisServiceName" .)) (get $redis "url") | quote }}
            - name: STARTUP_MAX_RETRIES
              value: {{ default 12 (get $webBackgroundStartup "maxRetries") | quote }}
            - name: STARTUP_RETRY_DELAY_SECONDS
              value: {{ default 10 (get $webBackgroundStartup "retryDelaySeconds") | quote }}
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbUsername" . }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbPassword" . }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              retries="${STARTUP_MAX_RETRIES:-12}"
              delay="${STARTUP_RETRY_DELAY_SECONDS:-10}"
              attempt=0
              while true; do
                /usr/local/bin/start-web-background && exit 0
                attempt="$((attempt + 1))"
                if [ "$attempt" -ge "$retries" ]; then
                  echo "start-web-background failed after ${attempt} attempts; exiting"
                  exit 1
                fi
                echo "start-web-background failed; retry ${attempt}/${retries} in ${delay}s"
                sleep "$delay"
              done
          livenessProbe:
            exec:
              command: ["grep", "-qs", "/mnt/openstudio ",  "/proc/mounts"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: {{ include "openstudio.nfsPvcName" . }}
