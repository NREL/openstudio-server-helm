apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstudio.webBackgroundName" . }}
spec:
  replicas: {{  .Values.web_background.replicas  }}
  selector:
    matchLabels:
      app: {{ default "web-background" .Values.web_background.label }}
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ default 1 (get (default (dict) (get .Values.web_background "strategy")) "maxSurge") }}
      maxUnavailable: {{ default 1 (get (default (dict) (get .Values.web_background "strategy")) "maxUnavailable") }}
  template:
    metadata:
      labels:
        app: {{ default "web-background" .Values.web_background.label }}
        release: {{ .Release.Name }}
    {{ $priorityClasses := default (dict) .Values.priorityClasses }}
    {{ $redis := default (dict) .Values.redis }}
    {{ $webBackgroundContainer := default (dict) .Values.web_background.container }}
    {{ $webBackgroundStartup := default (dict) (get $webBackgroundContainer "startup") }}
    {{ $webRuntimeOverrides := default (dict) (get .Values.web "runtimeOverrides") }}
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "web") | nindent 6 }}
      {{- include "openstudio.tolerationsForRole" (dict "root" . "role" "web") | nindent 6 }}
      {{- if eq (include "openstudio.workloadServiceAccountUse" .) "true" }}
      serviceAccountName: {{ include "openstudio.workloadServiceAccountName" . }}
      {{- end }}
      {{- include "openstudio.podImagePullSecrets" . | nindent 6 }}
      {{- include "openstudio.podNodeSelector" (dict "nodeSelector" .Values.web_background.nodeSelector) | nindent 6 }}
      {{- include "openstudio.podHostAliases" . | nindent 6 }}
      {{- if (default true (get $priorityClasses "enabled")) }}
      priorityClassName: {{ default "high-priority" (get $priorityClasses "highName") }}
      {{- end }}
      initContainers:
        - name: init-fix-shared-storage-perms
          image: {{ default (include "openstudio.serverImage" .) .Values.web_background.container.image }}
          imagePullPolicy: {{ default (include "openstudio.defaultWorkloadImagePullPolicy" .) .Values.web_background.container.imagePullPolicy }}
          volumeMounts:
            - name: nfs
              mountPath: "/mnt/openstudio"
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /mnt/openstudio/server/assets/analyses
              chmod 2775 /mnt/openstudio/server
              chmod 2777 /mnt/openstudio/server/assets /mnt/openstudio/server/assets/analyses
              echo "init-fix-shared-storage-perms: ensured writable permissions on /mnt/openstudio/server/assets/analyses"
      containers:
        - name:  {{ default "web-background" .Values.web_background.container.name }}
          image: {{ default (include "openstudio.serverImage" .) .Values.web_background.container.image }}
          imagePullPolicy: {{ default (include "openstudio.defaultWorkloadImagePullPolicy" .) .Values.web_background.container.imagePullPolicy }}
          resources:
            requests:
              cpu:  {{  .Values.web_background.container.resources.requests.cpu  }}
              memory:  {{  .Values.web_background.container.resources.requests.memory  }}
            {{- if (get (default (dict) .Values.web_background.container.resources) "limits") }}
            limits:
{{ toYaml .Values.web_background.container.resources.limits | nindent 14 }}
            {{- end }}
          volumeMounts:
            - name: nfs
              mountPath: "/mnt/openstudio"
            {{- if (default false (get $webRuntimeOverrides "enabled")) }}
            - name: web-runtime-overrides
              mountPath: "/opt/openstudio/server/config/initializers/97_seed_zip_idempotent_extract.rb"
              subPath: 97_seed_zip_idempotent_extract.rb
              readOnly: true
            {{- end }}
          env:
            - name: OS_SERVER_NUMBER_OF_WORKERS
              value: {{ .Values.rserve.number_of_workers | quote }}
            - name: COUNT
              value: {{ default 6 .Values.web_background.workerCount | quote }}
            - name: QUEUES
              value: background,analyses,analysis_wrappers
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyWebSecret" . }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyRedisPassword" . }}
            - name: REDIS_URL
              value: {{ default (printf "redis://:$(REDIS_PASSWORD)@%s:6379" (include "openstudio.redisServiceName" .)) (get $redis "url") | quote }}
            - name: STARTUP_MAX_RETRIES
              value: {{ default 12 (get $webBackgroundStartup "maxRetries") | quote }}
            - name: STARTUP_RETRY_DELAY_SECONDS
              value: {{ default 10 (get $webBackgroundStartup "retryDelaySeconds") | quote }}
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbUsername" . }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbPassword" . }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              retries="${STARTUP_MAX_RETRIES:-12}"
              delay="${STARTUP_RETRY_DELAY_SECONDS:-10}"
              attempt=0
              while true; do
                (
                  echo "Waiting for Mongo to start"
                  /usr/local/bin/wait-for-it --strict -t 0 db:27017
                  echo "Waiting for Redis to start"
                  /usr/local/bin/wait-for-it --strict -t 0 queue:6379
                  echo "Starting ${COUNT:-6} resque workers"
                  cd /opt/openstudio/server && bundle exec rake environment resque:workers
                ) && exit 0
                attempt="$((attempt + 1))"
                if [ "$attempt" -ge "$retries" ]; then
                  echo "resque:workers startup failed after ${attempt} attempts; exiting"
                  exit 1
                fi
                echo "resque:workers startup failed; retry ${attempt}/${retries} in ${delay}s"
                sleep "$delay"
              done
          livenessProbe:
            exec:
              command: ["grep", "-qs", "/mnt/openstudio ",  "/proc/mounts"]
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
      volumes:
        - name: nfs
          persistentVolumeClaim:
            claimName: {{ include "openstudio.nfsPvcName" . }}
        {{- if (default false (get $webRuntimeOverrides "enabled")) }}
        - name: web-runtime-overrides
          configMap:
            name: {{ include "openstudio.webName" . }}-runtime-overrides
        {{- end }}
