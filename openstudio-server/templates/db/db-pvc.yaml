kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: db
spec:
  storageClassName: {{ default (include "openstudio.defaultAppPersistenceStorageClass" .) .Values.db.persistence.storageClass | quote }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage:  {{ .Values.db.persistence.size }}