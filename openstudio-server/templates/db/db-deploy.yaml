apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
      release: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: db
        release: {{ .Release.Name }}
    {{ $dbContainer := (get .Values.db "container") | default (dict) }}
    {{ $dbContainerPorts := (get $dbContainer "ports") | default (dict) }}
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "web") | nindent 6 }}
      containers:
        - name: {{ default "mongo-db" .Values.db.container.name }}
          image: {{ .Values.db.container.image }}
          ports:
            - containerPort:  {{ default 27017 (get $dbContainerPorts "db_port") }}
          volumeMounts:
            - mountPath: /data/db
              name: db
          resources:
            requests:
              cpu:  {{  .Values.db.container.resources.requests.cpu  }}
              memory:  {{  .Values.db.container.resources.requests.memory  }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.db.username }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              value: {{ .Values.db.password }}
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: db
          
