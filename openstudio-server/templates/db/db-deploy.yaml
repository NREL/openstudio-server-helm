apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstudio.dbName" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ default "db" .Values.db.label }}
      release: {{ .Release.Name }}
  strategy:
    # Recreate is required for RWO PVCs — RollingUpdate can cause Multi-Attach errors
    # when the new pod attempts to mount before the old pod fully releases the volume.
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ default "db" .Values.db.label }}
        release: {{ .Release.Name }}
    {{ $dbContainer := (get .Values.db "container") | default (dict) }}
    {{ $dbContainerPorts := (get $dbContainer "ports") | default (dict) }}
    {{ $priorityClasses := default (dict) .Values.priorityClasses }}
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "web") | nindent 6 }}
      {{- if eq (include "openstudio.workloadServiceAccountUse" .) "true" }}
      serviceAccountName: {{ include "openstudio.workloadServiceAccountName" . }}
      {{- end }}
      {{- include "openstudio.podImagePullSecrets" . | nindent 6 }}
      {{- if (default true (get $priorityClasses "enabled")) }}
      priorityClassName: {{ default "high-priority" (get $priorityClasses "highName") }}
      {{- end }}
      containers:
        - name: {{ default "mongo-db" .Values.db.container.name }}
          image: {{ .Values.db.container.image }}
          ports:
            - containerPort:  {{ default 27017 (get $dbContainerPorts "db_port") }}
          volumeMounts:
            - mountPath: /data/db
              name: db
          resources:
            requests:
              cpu:  {{  .Values.db.container.resources.requests.cpu  }}
              memory:  {{  .Values.db.container.resources.requests.memory  }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbUsername" . }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyDbPassword" . }}
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: {{ include "openstudio.dbName" . }}
          
