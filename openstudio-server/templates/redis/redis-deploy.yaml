apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openstudio.redisName" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ default "redis" .Values.redis.label }}
      release: {{ .Release.Name }}
  strategy:
    # Recreate is required for RWO PVCs — RollingUpdate can cause Multi-Attach errors
    # when the new pod attempts to mount before the old pod fully releases the volume.
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ default "redis" .Values.redis.label }}
        release: {{ .Release.Name }}
    {{ $priorityClasses := default (dict) .Values.priorityClasses }}
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "web") | nindent 6 }}
      {{- if eq (include "openstudio.workloadServiceAccountUse" .) "true" }}
      serviceAccountName: {{ include "openstudio.workloadServiceAccountName" . }}
      {{- end }}
      {{- include "openstudio.podImagePullSecrets" . | nindent 6 }}
      {{- if (default true (get $priorityClasses "enabled")) }}
      priorityClassName: {{ default "high-priority" (get $priorityClasses "highName") }}
      {{- end }}
      containers:
        - name: {{ default "redis" .Values.redis.container.name  }}
          image: {{ .Values.redis.container.image  }}
          imagePullPolicy: {{ default (include "openstudio.defaultWorkloadImagePullPolicy" .) .Values.redis.container.imagePullPolicy }}
          resources:
            requests:
              cpu:  {{  .Values.redis.container.resources.requests.cpu  }}
              memory:  {{  .Values.redis.container.resources.requests.memory  }}
          ports:
            - containerPort: {{ default 6379 .Values.redis.container.port }}
          volumeMounts:
            - mountPath: /data
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openstudio.secretName" . }}
                  key: {{ include "openstudio.secretKeyRedisPassword" . }}
          command: ["/bin/sh", "-c"]
          args:
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
      volumes:
        - name: redis
          persistentVolumeClaim:
            claimName: {{ include "openstudio.redisName" . }}
