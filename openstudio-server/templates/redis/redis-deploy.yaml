apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: redis
        release: {{ .Release.Name }}
    spec:
      {{- include "openstudio.affinityForRole" (dict "root" . "role" "web") | nindent 6 }}
      containers:
        - name: {{ default "redis" .Values.redis.container.name  }}
          image: {{ .Values.redis.container.image  }}
          resources:
            requests:
              cpu:  {{  .Values.redis.container.resources.requests.cpu  }}
              memory:  {{  .Values.redis.container.resources.requests.memory  }}
          ports:
            - containerPort: {{ default 6379 .Values.redis.container.port }}
          volumeMounts:
            - mountPath: /data
              name: redis
          args: ["redis-server", "--appendonly yes", "--requirepass", "{{ .Values.redis.password  }}"]
      volumes:
        - name: redis
          persistentVolumeClaim:
            claimName: redis
