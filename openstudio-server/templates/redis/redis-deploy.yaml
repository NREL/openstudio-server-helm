apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.redis.name  }}
  labels:
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.redis.name  }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Values.redis.name  }}
        release: {{ .Release.Name }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Values.web.label }}
                topologyKey: kubernetes.io/hostname
        {{- include "openstudio.nodeGroupAffinity" (dict "root" . "role" "web") | nindent 8 }}
      containers:
        - name: {{ .Values.redis.container.name  }}
          image: {{ include "openstudio.imageWithRegistry" (dict "root" $ "image" .Values.redis.container.image) | quote }}
          resources:
            requests:
              cpu:  {{  .Values.redis.container.resources.requests.cpu  }}
              memory:  {{  .Values.redis.container.resources.requests.memory  }}
            {{- include "openstudio.resourceLimits" .Values.redis.container.resources.limits | nindent 12 }}
          ports:
            - containerPort: {{ .Values.redis.container.port  }}
          volumeMounts:
            - mountPath: /data
              name: {{ .Values.redis.name }}
          args: ["redis-server", "--appendonly yes", "--requirepass", "{{ .Values.redis.password  }}", "--maxclients", "{{ .Values.redis.maxclients  }}"]
      priorityClassName: high-priority
      volumes:
        - name: {{ .Values.redis.name }}
          persistentVolumeClaim:
            claimName: {{ .Values.redis.name }}
