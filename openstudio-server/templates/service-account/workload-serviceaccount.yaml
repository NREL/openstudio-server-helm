{{- $serviceAccount := default (dict) .Values.serviceAccount -}}
{{- if (default false (get $serviceAccount "create")) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openstudio.workloadServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with (get $serviceAccount "annotations") }}
    annotations:
      {{- toYaml . | nindent 4 }}
  {{- end }}
{{ include "openstudio.workloadImagePullSecrets" . }}
{{- end }}
