{{- $global := default (dict) .Values.global -}}
{{- $serviceAccount := default (dict) .Values.serviceAccount -}}
{{- $validateImagePullSecrets := true -}}
{{- if hasKey $serviceAccount "validateImagePullSecrets" -}}
{{- $validateImagePullSecrets = (get $serviceAccount "validateImagePullSecrets") -}}
{{- end -}}
{{- if $validateImagePullSecrets -}}
{{- $globalSecrets := default (list) (get $global "imagePullSecrets") -}}
{{- $serviceAccountSecrets := default (list) (get $serviceAccount "imagePullSecrets") -}}
{{- $seen := dict -}}
{{- $imagePullSecrets := list -}}
{{- range $secretName := $globalSecrets -}}
{{- if and (ne $secretName "") (not (hasKey $seen $secretName)) -}}
{{- $_ := set $seen $secretName true -}}
{{- $imagePullSecrets = append $imagePullSecrets $secretName -}}
{{- end -}}
{{- end -}}
{{- range $secretName := $serviceAccountSecrets -}}
{{- if and (ne $secretName "") (not (hasKey $seen $secretName)) -}}
{{- $_ := set $seen $secretName true -}}
{{- $imagePullSecrets = append $imagePullSecrets $secretName -}}
{{- end -}}
{{- end -}}
{{- range $secretName := $imagePullSecrets -}}
{{- $secretObject := lookup "v1" "Secret" $.Release.Namespace $secretName -}}
{{- if not $secretObject -}}
{{- fail (printf "imagePullSecret %q was not found in namespace %q. Create it first or disable serviceAccount.validateImagePullSecrets for render-only workflows." $secretName $.Release.Namespace) -}}
{{- end -}}
{{- end -}}
{{- end -}}
