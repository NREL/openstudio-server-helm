# Optional overlay for degraded infrastructure periods.
# Use with your baseline values file:
#   helm upgrade --install <release> ./openstudio-server -n <namespace> \
#     -f openstudio-server/values.yaml \
#     -f openstudio-server/values.degraded-infra.yaml
#
# Goal: slow worker ramp, reduce startup churn, and keep fallback conservative
# while platform blockers (network/image-pull/external-metrics) are being cleared.

worker_hpa:
  maxReplicas: 600
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      selectPolicy: Min
      policies:
        - type: Pods
          value: 20
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 15
          periodSeconds: 60

worker_autoscaling:
  mode: "keda-hybrid"
  keda:
    pollingIntervalSeconds: 20
    cooldownPeriodSeconds: 600
    queueLengthPerWorker: 2
    activationQueueLength: 3
    enableCpuTrigger: true
    fallback:
      failureThreshold: 6
      replicas: 8

worker:
  topologySpread:
    whenUnsatisfiable: "ScheduleAnyway"
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  container:
    resources:
      requests:
        cpu: 400m
        memory: "1Gi"
      limits:
        cpu: 2
        memory: "2Gi"
    terminationGracePeriodSeconds: 660
    preStop:
      fastTerminateSeconds: 240
      forceTerminateGraceSeconds: 20
      forceKillEnabled: true

prepull:
  enabled: false
  warmMode: "continuous"
  intervalSeconds: 1200
  spreadSeconds: 900
  failOnAnyPullError: false
