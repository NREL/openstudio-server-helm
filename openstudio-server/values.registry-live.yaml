## OpenStack-first Harbor/internal-registry profile.
## Copy to a local override and replace placeholder values before deploy.
## This file must never contain credentials.

global:
  provider:
    name: "openstack"
  nodeGroups:
    webAffinityMode: "required"
    workerAffinityMode: "required"
    roleTolerations:
      web:
        - key: worker-pods
          operator: Equal
          value: not-allowed
          effect: NoSchedule
  images:
    # Local registry endpoint reachable by cluster nodes.
    # Must be host[:port], not a bare name like "zot".
    registry: "pulp-dev.hpc.nlr.gov"
    # Optional repository path segment between registry and org/repo.
    repositoryPrefix: "pulp-container-aurora-179d"
    org: "nrel"
    serverRepository: "openstudio-server"
    rserveRepository: "openstudio-rserve"
    tag: "3.10.0"
  # No pod-level pull secrets: auth is handled at the node level via registryHostsPatch.
  imagePullSecrets: []

registryHostsPatch:
  enabled: true
  hostname: "pulp-dev.hpc.nlr.gov"
  additionalHostnames:
    - "pulp-dev.hpc.nrel.gov"
  address: "10.60.127.127"
  nodeSelector:
    capi.stackhpc.com/node-group: "worker"

hostAliases:
  enabled: true
  entries:
    - ip: "10.60.127.127"
      hostnames:
        - "pulp-dev.hpc.nlr.gov"
        - "pulp-dev.hpc.nrel.gov"

# Dedicated workload ServiceAccount. No pull secrets: auth is at the node level.
serviceAccount:
  create: true
  name: "openstudio-workload"
  validateImagePullSecrets: false
  imagePullSecrets: []

# OpenStack defaults resolve empty values to IfNotPresent.
web:
  replicas: 1
  nodeSelector: {}
  runtimeOverrides:
    enabled: true
  initContainer:
    imagePullPolicy: ""
    waitForDb:
      maxAttempts: 300
      retryDelaySeconds: 3
  strategy:
    maxSurge: 1
    maxUnavailable: 0
    progressDeadlineSeconds: 1800
    minReadySeconds: 15
  container:
    imagePullPolicy: ""
web_hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50
web_background:
  replicas: 1
  workerCount: 6
  nodeSelector: {}
  container:
    imagePullPolicy: ""
redis:
  # Pin to web node: the worker-node Cinder volume attachment is stuck at the
  # OpenStack level; the web node successfully attached the PVC on 2026-07-14.
  nodeSelector:
    capi.stackhpc.com/node-group: "web"
  affinity: {}
  config:
    maxclients: 50000
    tcpBacklog: 511
    timeoutSeconds: 0
rserve:
  nodeSelector:
    capi.stackhpc.com/node-group: "worker"
worker:
  nodeSelector:
    capi.stackhpc.com/node-group: "worker"
  resque:
    # Bound runaway simulations and self-heal receipt-wait deadlocks.
    jobTimeoutSeconds: 14400
    receiptWaitTimeoutSeconds: 2400
    lockJanitor:
      enabled: true
      intervalSeconds: 60
      minAgeSeconds: 120
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: "kubernetes.io/hostname"
    whenUnsatisfiable: "ScheduleAnyway"
    minDomains: null
    nodeAffinityPolicy: "Honor"
    nodeTaintsPolicy: "Ignore"
  container:
    imagePullPolicy: ""
    terminationGracePeriodSeconds: 660
    resources:
      requests:
        cpu: 400m
        memory: "1Gi"
      limits:
        cpu: 2
        memory: "2Gi"
    preStop:
      enabled: true
      signal: "3"
      pollIntervalSeconds: 10
      maxWaitSeconds: 600
      fastTerminateSeconds: 600
      forceTerminateGraceSeconds: 20
      forceKillEnabled: true
    livenessProbe:
      enabled: true
      periodSeconds: 300
      initialDelaySeconds: 300
      failureThreshold: 1
      timeoutSeconds: 10
  strategy:
    # Keep rollouts conservative while cluster stability recovers.
    maxSurge: 1
    maxUnavailable: 0

prepull:
  # Keep enabled during planned warm-up windows for live registry mitigation.
  enabled: false
  role: "worker"
  utilityImage: "registry.k8s.io/e2e-test-images/busybox:1.29-2"
  utilityImagePullPolicy: "IfNotPresent"
  spreadSeconds: 300
  warmMode: "once"
  intervalSeconds: 1200
  failOnAnyPullError: false
  includeRserve: false
  includeWebInit: false
  additionalImages: []
  nodeSelector:
    capi.stackhpc.com/node-group: "worker"

worker_autoscaling:
  mode: "keda-hybrid"
  keda:
    pollingIntervalSeconds: 20
    cooldownPeriodSeconds: 1800
    queueNames:
      - simulations
      - requeued
    queueLengthPerWorker: 2
    activationQueueLength: 3
    enableCpuTrigger: false
    fallback:
      failureThreshold: 6
      replicas: 8

worker_hpa:
  # minReplicas/maxReplicas shared by both HPA and KEDA modes
  minReplicas: 2
  maxReplicas: 10000
  targetCPUUtilizationPercentage: 50
