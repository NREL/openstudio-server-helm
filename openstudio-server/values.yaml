# Default values for openstudio-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# Global image registry settings - used by imageWithRegistry helper
# Set these per-provider (e.g., openstack/values-openstack.yaml) for private registries
global:
  images:
    registry: ""
    repositoryPrefix: ""

# Hook configuration
# Pre-delete hook ("nfs-client-cleanup" Job) drains all release workloads except
# the NFS server provisioner subchart, waits for client pods to be gone, and
# force-deletes leftovers. It keeps the NFS server up until every client pod has
# unmounted, so pods cannot hang in Terminating on a dead NFS mount.
hooks:
  preDeleteCleanup:
    image: "bitnami/kubectl:latest" # single source of truth for the hook image
    # Total Job budget: image pull + workload deletion + podWaitTimeoutSeconds +
    # force-delete + settle. Keep comfortably above podWaitTimeoutSeconds.
    activeDeadlineSeconds: 300
    # How long to wait for client pods to drain before force-deleting them.
    podWaitTimeoutSeconds: 120

# Set to google, aws, azure, or openstack
provider:
  name: ""

# Node label used by pod scheduling affinity (see templates/_helpers.tpl,
# "openstudio-server.nodeGroupAffinity"). Defaults match this chart's original
# hardcoded behavior exactly, so existing installs are unaffected. Override
# per-provider (see openstack/values-openstack.yaml) if your cluster labels
# node groups differently, e.g. Cluster API/Azimuth clusters auto-label nodes
# "capi.stackhpc.com/node-group: web|worker" instead of "nodegroup: web-group".
node_group:
  label_key: "nodegroup"
  web_value: "web-group"
  worker_value: "worker-group"
  # "required" or "preferred". Use "preferred" if newly-autoscaled nodes may
  # take a moment to receive their node-group label after joining the
  # cluster, to avoid pods staying stuck Pending during that window.
  affinity_mode: "required"

cluster:
  name: "openstudio-server"

nfs-server-provisioner:
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 110Gi
  storageClass:
    allowVolumeExpansion: false
    # NFSv4 is stateful and does not tolerate being fronted by a Service
    # ClusterIP (client callback/lease renewal fails, mounts hang/fail).
    # vers=3 has fixed mountd/nlockmgr/statd/rpcbind ports and is what this
    # provisioner is actually tested against.
    mountOptions:
      - vers=3
      - sync
db:
  name:  "db"
  label: "db"
  username: "openstudio"
  password: "openstudio"
  container:
    name: "mongo-db"
    image: "mongo:6.0.7"
    resources:
      requests:
        cpu: 1
        memory: "4Gi"
    ports:
      db_port: 27017
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 100Gi
    accessModes:
      - "ReadWriteOnce"

load_balancer:
  name: "ingress-load-balancer"
  externalTrafficPolicy: "Local"
  label: "web"
  internal: false
  ports:
    http_name: "http"
    http_port: 80
    http_protocol: "TCP"
    https_name: "https"
    https_port: 443
    https_protocol: "TCP"

nfs:
  name: "nfs"

nfs_pvc:
  name: "nfs-pvc"
  accessModes:
    - "ReadWriteMany"
  storage_class: "nfs"
  storage: "100Gi"


redis:
  name: "redis"
  label: "redis"
  password: "openstudio"
  # Max concurrent client connections for the redis server (--maxclients).
  # Tune upward for deployments with many worker pods.
  maxclients: 10000
  container:
    name: "redis"
    image: "redis:6.0.9"
    resources:
      requests:
        cpu: 0.25
        memory: "1Gi"
    port: 6379
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 100Gi
    accessModes:
      - "ReadWriteOnce"

redis_svc:
  name: "queue"
  label: "redis"
  port: 6379
  url: "redis://:openstudio@queue:6379"

rserve:
  name: "rserve"
  label: "rserve"
  number_of_workers: "1"
  container:
    name: "rserve"
    image: "nrel/openstudio-rserve:3.8.0-1"
    resources:
      requests:
        cpu: 1
        memory: "2Gi"

rserve_svc:
  name: "rserve"
  label: "rserve"
  port: 6311

web_background:
  name: "web-background"
  label: "web-background"
  replicas: 1
  # Dynamic worker calculation (auto-parses container.resources.limits.memory):
  #   workers = floor(limit_memory_MiB / worker_memory_mib)
  #   e.g., "32Gi" limit + 300 MiB/worker = 109 workers
  #   If no memory limit set, falls back to rserve.number_of_workers
  worker_memory_mib: 300
  container:
    name: "web-background"
    image: "nrel/openstudio-server:3.8.0-1"
    resources:
      requests:
        cpu: 0.25
        memory: "512Mi"

web:
  name: "web"
  label: "web"
  secret_key_value: "c4ab6d293e4bf52ee92e8dda6e16dc9b5448d0c5f7908ee40c66736d515f3c29142d905b283d73e5e9cef6b13cd8e38be6fd3b5e25d00f35b259923a86c7c473"
  # passenger_max_request_queue_size: "1600"
  # Use this formula (1024 * memory of web pod in Gi * 0.75) / memory per passenger process
  # passenger_max_pool_size: "21"
  # This value is typically between 150 and 400, find this by ssh into web pod and doing `passenger-status`
  passenger_memory_per_process: 250
  container:
    name: "web"
    image: "nrel/openstudio-server:3.8.0-1"
    resources:
      requests:
        cpu: 1
        memory: "2Gi"
    port:
     http: 80
     https: 443

# For this to work and have more than 1 web pod we'll need to implement
# a distributed file locking scheme such a https://github.com/antirez/redlock-rbs
# as even with using NFS via sync it cannot guarantee file locking using multiple clients
web_hpa:
  name: "web"
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50

web_svc:
  name: "web"
  label: "web"
  ports:
    http: 80
    https: 443

worker:
  name: "worker"
  label: "worker"
  container:
    name: "worker"
    image: "nrel/openstudio-server:3.8.0-1"
    resources:
      requests:
        cpu: 700m
        memory: "900Mi"
    terminationGracePeriodSeconds: 5200
    # Cap for worker scratch space under /mnt/openstudio (emptyDir, backed
    # by the node's local disk). Without a cap, one worker writing more
    # than expected can fill the node's disk and trigger DiskPressure
    # eviction of every pod on that node, not just the offending one.
    # Leave empty ("") for no limit (original behavior). Example: "8Gi".
    emptyDirSizeLimit: ""

worker_hpa:
  name: "worker"
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 50
  stabilizationWindowSeconds: 3600
  # Stabilization window for scale-UP (seconds). Prevents a single transient
  # CPU sample above target (pod startup, requeue storm after a scale-down)
  # from driving the HPA to maxReplicas via the scale-up policy before
  # sustained load is confirmed. Defaults to stabilizationWindowSeconds
  # when unset (backwards compatible).
  scaleUpStabilizationWindowSeconds: 300
  # Scale-up burst size, in pods per periodSeconds=60.
  scalePolicyValue: 25
  # Optional separate cap for scaleDown, in pods per periodSeconds=60.
  # Defaults to scalePolicyValue (original behavior: scale-up and scale-down
  # share the same burst size) when unset. Scale-down bursts of hundreds of
  # simultaneous pod terminations risk overwhelming a node's container
  # runtime kill pathway if many land on the same node at once; set this
  # lower than scalePolicyValue to throttle scale-down specifically without
  # slowing scale-up responsiveness.
  scaleDownPolicyValue: null

# Optional Kubernetes Indexed Job for running external_batch analyses on the
# existing cluster, reusing the chart's NFS PVC. See issue #99 and the
# README "External Batch (Indexed Jobs)" section for the dispatch workflow.
#
# When enabled, an opt-in Job (templates/job-external-batch.yaml) and a
# ConfigMap carrying the upstream run_chunk.rb (configmaps/runner-cm.yaml)
# are rendered. No Resque worker changes — traditional worker and Indexed
# Job modes coexist.
external_batch:
  # Master switch. Default false so existing installs are unaffected.
  enabled: false
  # The analysis whose packaged datapoints the runner will execute. Becomes
  # part of the Job name and is used to locate the package/results dirs on
  # the shared NFS. Set this when enabling.
  analysis_id: ""
  # Total chunks in the manifest. completionMode: Indexed gives each pod a
  # unique JOB_COMPLETION_INDEX in [0, completions).
  completions: 1
  # Number of pods running concurrently. <= completions.
  parallelism: 1
  # K8s Job backoffLimit; matches the worker pod's general retry tolerance.
  backoff_limit: 3
  # 24h default — matches the longest OpenStudio annual simulation runtime.
  active_deadline_seconds: 86400
  # Clean up completed pods after this many seconds. Indexed jobs leave
  # around terminal pods otherwise.
  ttl_seconds_after_finished: 3600
  container:
    # Pinned by digest to commit d63c8eb2e3b37bca2494e66cab3c4457cf5c4e61
    # of NatLabRockies/OpenStudio-server (docker tag :3.10.0-179D-test).
    # The external_batch runner predates the chart's pinned appVersion
    # (3.8.0-1), so this is intentionally decoupled — pointing at the
    # chart's worker image would fail at runtime with "file not found"
    # for run_chunk.rb. Bump both this digest and
    # configmaps/runner/run_chunk.rb together from the matching upstream
    # commit. See upstream issue NatLabRockies/OpenStudio-server#864 —
    # the pin is temporary and should be replaced with a stable release
    # tag once one is published.
    image: nrel/openstudio-server@sha256:9b0871fc4f9c746afd5e8d36775d2564d07679ee4779cb3997a53ea112c65875
    imagePullPolicy: IfNotPresent
  storage:
    # Where the chart already mounts the NFS PVC (matches web/web-background/
    # rserve deploys). The runner expects:
    #   <mountPath>/external_batch/analysis_<analysis_id>/package/
    #     manifest.json
    #     analysis_<id>/data_point_<dp_id>/data_point.osw
    #   <mountPath>/external_batch/analysis_<analysis_id>/results/
    #     <dp_id>/status.json
    #     chunk_<i>.done
    # That layout is written by the server's ExternalBatch::Packager job
    # when an analysis is submitted with --batch-run-method external_batch_run.
    mountPath: /mnt/openstudio
    # Override the PVC claim name. Defaults to .Values.nfs_pvc.name (matches
    # the chart's existing PVC pattern).
    existingClaim: ""
  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"
