# Tracked baseline values for openstudio-server.
# Copy and override for your target environment.
# Declare variables to be passed into your templates.

global:
  provider:
    # Required. Set one of: aws, google, azure, openstack.
    # 179D cluster: OpenStack provider on Azimuth
    name: "openstack"
    # Migration compatibility toggle. When true, legacy provider.name can be used
    # only if global.provider.name is unset. Keep false for strict mode.
    allowLegacyName: false
  # Optional storage class defaults used by provider-aware chart logic.
  # For OpenStack, block is used as the backing class for the NFS provisioner PVC.
  storageClasses:
    block: "csi-cinder"
  # Optional node-group scheduling controls.
  # labelKey defaults by provider: openstack => capi.stackhpc.com/node-group, others => nodegroup.
  # web/worker defaults by provider: openstack => web/worker, others => web-group/worker-group.
  # affinityMode: required | preferred | disabled
  # webAffinityMode / workerAffinityMode can override affinityMode per role.
  # defaults by provider: openstack => preferred, others => required
  nodeGroups:
    # labelKey: ""
    # web: ""
    # worker: ""
    # affinityMode: ""
    # webAffinityMode: ""
    # workerAffinityMode: ""
  # Optional pod-level image pull secrets applied to chart workloads.
  # Use this for private registries when pull secrets should be attached directly to Pods.
  imagePullSecrets:
    - name: docker-hub-secret
  images:
    # Optional registry host (for example registry.example.org).
    # When unset, image references keep existing docker-style names (for example nrel/openstudio-server:tag).
    registry: ""
    # Optional repository prefix path between registry and org/repo
    # (for example "proxy-cache" -> registry.example.org/proxy-cache/nrel/openstudio-server:tag).
    repositoryPrefix: ""
    org: "nrel"
    serverRepository: "openstudio-server"
    rserveRepository: "openstudio-rserve"
    tag: "3.10.0"

# Optional shared ServiceAccount for chart workloads.
# If create=true, chart creates one and can attach imagePullSecrets to it.
# If create=false and name is set, workloads use that existing ServiceAccount.
# If both are unset/default, workloads use the namespace default ServiceAccount.
serviceAccount:
  create: true
  name: openstudio-workload
  annotations: {}
  imagePullSecrets:
    - name: docker-hub-secret

cluster:
  name: "openstudio-179d"

autoscaler:
  # Defaults to enabled on AWS and disabled on other providers unless explicitly set.
  # 179D: Keep disabled because Azimuth manages cluster autoscaling for this cluster.
  enabled: false
  # Safety guard: when enabled on OpenStack, install/upgrade fails if a pre-existing
  # kube-system/cluster-autoscaler deployment is detected and not owned by this Helm release.
  # For OpenStack, enable autoscaler and provide one or more node groups in min:max:name format.
  # Example:
  # openstackNodeGroups:
  #   - name: web-group
  #     min: 1
  #     max: 5
  #   - name: worker-group
  #     min: 1
  #     max: 50
  # IMPORTANT for 179D cluster: Configure worker and web node groups for batch scaling.
  # Batch scaling reduces node bootstrap time overhead (parallel vs. sequential).
  # Set max based on cluster capacity and cost constraints.
  image:
    repository: "registry.k8s.io/autoscaling/cluster-autoscaler"
    # When empty, defaults to v<cluster-major>.<cluster-minor>.0.
    tag: ""
    pullPolicy: "IfNotPresent"
  openstack:
    # If set, chart mounts this secret and passes --cloud-config=<mountPath>.
    # 179D: Cloud config exists in openstack-system/cloud-config (Azimuth-provided)
    cloudConfigSecretName: "cloud-config"
    cloudConfigSecretKey: "cloud.conf"
    cloudConfigMountPath: "/etc/kubernetes/cloud.conf"
    # Optional custom CA bundle for private OpenStack API endpoints.
    # When set, chart mounts this secret key and sets SSL_CERT_FILE for autoscaler.
    caBundleSecretName: ""
    caBundleSecretKey: "ca.crt"
    caBundleMountPath: "/etc/ssl/certs/openstack-ca.crt"
    # Safety guard for OpenStack installs. When true, chart checks for a pre-existing
    # kube-system/cluster-autoscaler deployment and fails if it's not owned by this release.
    # Set false only when release-time RBAC cannot read kube-system deployments.
    checkExistingDeploymentOwnership: true
  # openstackNodeGroups:
  #   - name: "openstudio-179d-worker"
  #     min: 1
  #     max: 60
  # Keep empty when using Azimuth autoscaler.
  openstackNodeGroups: []
  # Autoscaler expander strategy: least-waste | most-pods | random | priority
  expander: "priority"
  # Optional priority expander config map content.
  # Enable when using multiple worker node groups and you want deterministic burst ordering.
  # priorityExpander:
  #   enabled: true
  #   config: |
  #     50:
  #       - .*worker-on-demand.*
  #     10:
  #       - .*worker-spot.*
  extraArgs:
    - "--scale-down-enabled=false"           # Skip scale-down during high-load periods
    - "--scale-down-delay-after-add=10m"     # Wait 10 min after scale-up before scale-down
    - "--max-node-provision-time=15m"        # Allow 15 min for node bootstrap
    - "--max-total-unready-percentage=45"    # Allow 45% unready nodes during scaling
    - "--ok-total-unready-count=20"          # Alternative: up to 20 unready nodes
    - "--new-pod-scale-up-delay=2m"          # Wait 2 min before scaling for newly created pods

priorityClasses:
  enabled: true
  create: true
  highName: "high-priority"
  lowName: "low-priority"

secrets:
  # Primary path: use an externally managed secret by name.
  # If set, chart will not create a secret from db/redis/web values.
  existingSecret: "openstudio-app-secrets"
  # Strict by default for connected clusters.
  # Set false only for offline/render-only workflows (for example CI helm template jobs).
  validateExistingSecret: true
  # Create a secret from db.username/db.password/redis.password/web.secret_key_value.
  # Alternate path. Must be false when existingSecret is set.
  create: false
  # Optional override for chart-managed secret name.
  nameOverride: ""
  keys:
    dbUsername: "db-username"
    dbPassword: "db-password"
    redisPassword: "redis-password"
    webSecret: "web-secret-key"

# NFS Server Provisioner
nfs-server-provisioner:
  persistence:
    enabled: true
    # Backend storage for the in-cluster NFS server (nfs-pvc-data).
    # Keep nfs_pvc.storage below this value to avoid NFS provisioning failures.
    # OpenStack preflight (required): ensure this + db.persistence.size +
    # redis.persistence.size + existing Cinder usage remains below your quota.
    size: 200Gi
    # Explicitly pin OpenStack backend class to avoid drift on upgrades.
    storageClass: "csi-cinder"
  # 179D managed cluster uses an auth-gated DockerHub mirror path; this image is
  # pulled from quay to avoid 401 Unauthorized on docker.io/erezsh2.
  image:
    repository: "quay.io/kubernetes_incubator/nfs-provisioner"
    tag: "v2.3.0"
  storageClass:
    allowVolumeExpansion: true  # Enable expansion for future growth
    mountOptions:
      - vers=4

# Database - Enhanced for production
db:
  # Required when secrets.create=true.
  username: ""
  password: ""
  container:
    image: "mongo:6.0.7"
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "Always"
    resources:
      requests:
        cpu: 2          # Increased from 1 for better performance
        memory: "8Gi"   # Increased from 4Gi for production workloads
  persistence:
    # For production OpenStack deployments, prefer block storage for DB durability/performance.
    storageClass: "csi-cinder"
    # Existing PVC request sizes cannot be reduced in-place.
    # Keep aligned with live claim (300Gi) unless you plan a migration/recreate.
    size: 300Gi

load_balancer:
  # Keep provider defaults unless explicitly required.
  # OpenStack default externalTrafficPolicy is Cluster.
  # sourceRanges may be ignored by some OpenStack Octavia providers.
  externalTrafficPolicy: ""
  annotations: {}
  sourceRanges: []

nfs_pvc:
  storageClass: "nfs"
  # Frontend shared RWX claim consumed by web/rserve/background pods.
  # Keep this below nfs-server-provisioner.persistence.size (recommended 85-95%).
  storage: "180Gi"

# Redis - Enhanced for production
redis:
  # Required when secrets.create=true.
  password: ""
  # Optional explicit Redis URI. When set, templates use this value for REDIS_URL.
  # Use this if credentials include URI-reserved characters.
  url: ""
  container:
    image: "redis:6.0.9"
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "Always"
    resources:
      requests:
        cpu: 1        # Increased from 0.25 for better queue performance
        memory: "2Gi"   # Increased from 1Gi for larger queues
  persistence:
    # For production OpenStack deployments, prefer block storage for queue durability/performance.
    storageClass: "csi-cinder"
    # Existing PVC request sizes cannot be reduced in-place.
    # Keep aligned with live claim (300Gi) unless you plan a migration/recreate.
    size: 300Gi

# RServe - Enhanced for production
rserve:
  number_of_workers: "2"  # Increased from 1 for better R processing
  container:
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "Always"
    resources:
      requests:
        cpu: 2          # Increased from 1 for better R performance
        memory: "4Gi"   # Increased from 2Gi for larger R workloads

rserve_svc:
  {}

# Web Background - Enhanced for production
web_background:
  replicas: 2           # Increased from 1 for redundancy
  container:
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "Always"
    resources:
      requests:
        cpu: 0.5        # Increased from 0.25 for better background processing
        memory: "1Gi"   # Increased from 512Mi
    startup:
      maxRetries: 12
      retryDelaySeconds: 10

# Web - Enhanced for production with proper passenger configuration
web:
  # Required when secrets.create=true.
  secret_key_value: ""
  # Use this formula (1024 * memory of web pod in Gi * 0.75) / memory per passenger process
  passenger_memory_per_process: 250          # Keep existing optimized value
  initContainer:
    # Optional override for init-wait-for-db image. Defaults to openstudio server image.
    image: ""
    # Optional override. If empty, uses provider-aware default (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "Always"
  container:
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "Always"
    resources:
      requests:
        cpu: 2          # Increased from 1 for better web performance
        memory: "8Gi"   # Increased from 2Gi for production load

# Web HPA - Configured for production scaling
# web_hpa:
#   minReplicas: 1
#   maxReplicas: 1
#   targetCPUUtilizationPercentage: 70  # Slightly higher threshold for stability
#   # Note: Distributed file locking still needed for >1 replica

web_svc:
  {}

# Web HPA - Disabled-by-default baseline values for chart rendering.
web_hpa:
  name: "web"
  minReplicas: 1
  # Keep single replica by default until distributed file locking is validated in your environment.
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50
  # stabilizationWindowSeconds controls how long to wait before scaling down.
  stabilizationWindowSeconds: 600

# Worker - Enhanced for production
worker:
  queues: "simulations,requeued"
  container:
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "Always"
    resources:
      requests:
        cpu: 600m
        memory: "700Mi"
    terminationGracePeriodSeconds: 5200
    startup:
      maxRetries: 12
      retryDelaySeconds: 10
    preStop:
      enabled: true
      signal: "3"
      pollIntervalSeconds: 30
      maxWaitSeconds: 5100

# Worker HPA - Optimized for production workloads with aggressive scale-up
worker_hpa:
  minReplicas: 2        # Keep >1 to reduce throughput collapse from a single stuck worker
  # Ceiling for burst scaling; effective scale still depends on schedulable cluster capacity.
  maxReplicas: 1443
  targetCPUUtilizationPercentage: 60  # Slightly higher for stability
  stabilizationWindowSeconds: 1800    # Reduced from 3600 for faster scaling response
  # Scale-up behavior: 32 pods + 200% every 15s (conservative 4 pods → aggressive)
  # This enables reaching 400+ pods in ~3-4 minutes vs. 10+ minutes previously.

# Worker autoscaling mode:
# - hpa: Kubernetes HPA on CPU only (default)
# - keda-hybrid: KEDA ScaledObject using queue depth + CPU
worker_autoscaling:
  mode: "keda-hybrid"
  keda:
    # Faster queue polling reduces time-to-first-scale and improves burst reaction.
    pollingIntervalSeconds: 5
    cooldownPeriodSeconds: 300
    redisAddress: ""              # Empty => "<redis-service>:6379"
    queueNames:
      - simulations
      - requeued
    # Faster burst scale-out: target fewer queue items per worker so KEDA requests
    # higher replica counts earlier while backlog is growing.
    queueLengthPerWorker: 10       # Target queue items per worker replica
    activationQueueLength: 1      # Queue depth before scaler activates
    enableCpuTrigger: true
    advanced:
      restoreToOriginalReplicaCount: false
    # Optional fallback if scaler metrics fail repeatedly
    # fallback:
    #   failureThreshold: 3
    #   replicas: 2

hooks:
  preDeleteCleanup:
    enabled: true
    # Optional explicit image for pre-delete cleanup job. Set to an internal mirror
    # to avoid external registry pulls during uninstall/cleanup.
    image: "bitnami/kubectl:1.31"
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "IfNotPresent"

prepull:
  # Optional image warmup DaemonSet for scale-up/upgrade events.
  # Enable temporarily, wait until all prepull pods are Running, then disable if desired.
  enabled: false
  # Optional role affinity for prepull DaemonSet: "", "web", or "worker".
  role: "worker"
  # Optional explicit pull policy override. If empty, uses provider-aware default
  # (openstack=IfNotPresent, others=Always).
  imagePullPolicy: "Always"
  # Optional image override for the prepull DaemonSet primary container.
  image: ""
  includeRserve: false
  includeWebInit: false
  # Optional additional images to warm on each node (for example sidecars or infra tools)
  additionalImages: []
