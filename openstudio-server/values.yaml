# Default values for openstudio-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# Global image registry settings - used by imageWithRegistry helper
# Set these per-provider (e.g., openstack/values-openstack.yaml) for private registries
global:
  images:
    registry: ""
    repositoryPrefix: ""

# Local image registry (optional, deployed as subchart like nfs-server-provisioner)
# When enabled, a local Docker registry (distribution/registry:2) is deployed in-cluster.
# If rewriteImages is true, all workload images are rewritten to pull from the local registry.
localRegistry:
  enabled: false
  # Subchart values (passed through to charts/local-registry)
  image: "registry:2"
  resources: {}
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 10Gi
  # Image rewrite settings
  rewriteImages: true
  # Hostname override (for external registry use instead of deployed subchart)
  hostname: ""
  port: 5000

# containerd node-level registry configuration (certs.d/hosts.toml).
#
# Problem this solves: containerd on each node reads its own
# /etc/containerd/certs.d/<host>/hosts.toml to decide how to reach a given
# registry host (e.g. an insecure/plain-HTTP local registry, or a mirror
# fronting a registry that's otherwise unreachable/rate-limited). That file
# lives on the node's local disk, NOT in-cluster state -- so it does not
# exist on any node the cluster autoscaler creates after the fact, and is
# lost if a node is replaced. Manually SSHing/kubectl-debugging it onto nodes
# is not durable across scale-up events or cluster rebuilds.
#
# Fix: a DaemonSet (templates/containerd-registry-config/*) runs on every
# web/worker node, writes the hosts.toml file(s) below to the node's
# /etc/containerd/certs.d/, and periodically re-writes them so the DaemonSet
# both self-heals onto newly-autoscaled nodes (normal DaemonSet scheduling)
# and repairs any file that gets reset/lost on an existing node.
#
# This only ever needs the SERVICE's ClusterIP notion for the local
# registry, which is resolved from the same localRegistry.hostname/port
# values already used by the imageWithRegistry helper -- so there is a
# single source of truth; you don't set the IP twice.
containerdRegistryConfig:
  # Master toggle. Auto-enabled (effectively true) whenever the local
  # registry rewrite is active, even if left false here -- see
  # openstudio.containerdRegistryConfigEnabled helper. Set explicitly to
  # true/false to force it on/off regardless of localRegistry settings.
  enabled: false
  image: "docker.io/calico/node:v3.29.3" # any small always-on-every-node image with a shell; already pre-pulled on most clusters as part of the CNI, so this DaemonSet doesn't add a new pull dependency
  # How often (seconds) to re-write the hosts.toml files, so a reset/lost
  # file (e.g. after node reboot without persistent /etc, or manual edit)
  # self-heals without needing a pod restart.
  refreshIntervalSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 512Mi
  # Additional registry mirrors to configure, beyond the local registry
  # (which is handled automatically from localRegistry.* above when
  # rewriteImages is enabled). Each entry writes
  # /etc/containerd/certs.d/<host>/hosts.toml on every web/worker node.
  #
  # Example (mirroring a registry that's rate-limiting or unreachable):
  #   extraMirrors:
  #     - host: "pulp-dev.hpc.nlr.gov"
  #       server: "https://pulp-dev.hpc.nlr.gov"
  #       mirror: "http://192.168.66.44:30500"
  #       capabilities: ["pull", "resolve"]
  extraMirrors: []
  # Pre-pull (warm) workload images into containerd's content store directly
  # via `ctr`, bypassing kubelet entirely.
  #
  # Problem this solves: kubelet's default registryPullQPS=5/registryBurst=10
  # with serializeImagePulls=true throttles and SERIALIZES every image pull
  # per node, regardless of how fast the registry itself can actually serve
  # images. Under a large/fast HPA scale-up (many new pods landing on a
  # freshly-joined node at once), this produces a wall of concurrent
  # "Failed to pull image ... pull QPS exceeded" / ImagePullBackOff events
  # even though the local registry has plenty of headroom -- kubelet's own
  # image manager is the bottleneck, not the network or the registry.
  # Talking to containerd directly via its socket (as this DaemonSet does)
  # goes around kubelet's image manager entirely, so a single `ctr images
  # pull` per image per node completes in ~0.1-0.3s once the layers are in
  # containerd's content store (confirmed on this cluster), and every
  # subsequent kubelet-initiated pull for that image on that node is
  # instant (content-addressed layers already present) instead of
  # contending for the QPS/burst budget.
  #
  # Requires hostPID plus bind-mounting the node's containerd.sock and `ctr`
  # binary (both standard on every containerd-based node; no extra
  # dependency installed on the node). Runs once at DaemonSet pod startup
  # (i.e. once per node join) rather than on every refresh loop, since
  # images rarely change and repeated pulls of the same content-addressed
  # layers are cheap no-ops.
  prewarmImages:
    enabled: false
    # containerd's socket + ctr binary paths on the host. Standard for any
    # containerd-based node (matches every node observed on this cluster);
    # override if your OS/distro places these elsewhere.
    containerdSockPath: "/run/containerd/containerd.sock"
    ctrBinaryPath: "/usr/local/bin/ctr"
    # Explicit extra images to pre-pull, beyond the ones automatically
    # derived from web/web_background/worker/rserve/db/redis container
    # images (see openstudio.prewarmImageList helper). Use this for images
    # not otherwise covered, e.g. an extra sidecar.
    extraImages: []

# Hook configuration
# Pre-delete hook ("nfs-client-cleanup" Job) drains all release workloads except
# the NFS server provisioner subchart, waits for client pods to be gone, and
# force-deletes leftovers. It keeps the NFS server up until every client pod has
# unmounted, so pods cannot hang in Terminating on a dead NFS mount.
hooks:
  preDeleteCleanup:
    image: "bitnami/kubectl:latest" # single source of truth for the hook image
    # Total Job budget: image pull + workload deletion + podWaitTimeoutSeconds +
    # force-delete + settle. Keep comfortably above podWaitTimeoutSeconds.
    activeDeadlineSeconds: 300
    # How long to wait for client pods to drain before force-deleting them.
    podWaitTimeoutSeconds: 120

# Set to google, aws, azure, or openstack
provider:
  name: ""

# Node label used by pod scheduling affinity (see templates/_helpers.tpl,
# "openstudio.nodeGroupAffinity"). Defaults match this chart's original
# hardcoded behavior exactly, so existing installs are unaffected. Override
# per-provider (see openstack/values-openstack.yaml) if your cluster labels
# node groups differently, e.g. Cluster API/Azimuth clusters auto-label nodes
# "capi.stackhpc.com/node-group: web|worker" instead of "nodegroup: web-group".
node_group:
  label_key: "nodegroup"
  web_value: "web-group"
  worker_value: "worker-group"
  # "required" or "preferred". Use "preferred" if newly-autoscaled nodes may
  # take a moment to receive their node-group label after joining the
  # cluster, to avoid pods staying stuck Pending during that window.
  affinity_mode: "required"

cluster:
  name: "openstudio-server"

# Master toggle for the vendored nfs-server-provisioner SUBCHART
# (charts/nfs-server-provisioner -- single-pod userspace NFS-Ganesha).
# Defaults to true so AWS/EKS and bare-default installs keep rendering it
# exactly as before. Providers replacing it with the kernel NFS server below
# set this false (see openstack/values-openstack.yaml) -- do NOT delete the
# vendored subchart from the repo.
nfsServerProvisioner:
  enabled: true

# Kernel-NFS-server replacement for the userspace Ganesha provisioner.
#
# WHY: under heavy parallel client load (~1k+ mounts, 2026-08-22/23 incidents)
# the single-pod Ganesha 2.8.2 server deadlocks repeatedly with
# "svc_ioq_flushv() writev failed" spam; clients wedge in D-state and Resque
# children die silently mid-job, losing datapoints with no failure record.
# Kernel nfsd with hundreds of RPC threads does not have this failure mode.
#
# SCOPE: templates/nfs/nfs-kernel-*.yaml are rendered ONLY when
#   provider.name == "openstack" AND nfsKernelServer.enabled == true
# so every other provider keeps using the vendored subchart unchanged.
#
# The kernel server fronts the SAME backing Cinder volume as the old
# provisioner did (claim "nfs-pvc-data" mounted at /export), so existing
# data and existing client PVs keep working with no migration.
nfsKernelServer:
  enabled: false
  # Deployment name suffix: "<release>-nfs-kernel".
  nameSuffix: "nfs-kernel"
  # rpc.nfsd kernel thread count. This is the entire point of the swap vs.
  # Ganesha: each thread handles one NFS request in-kernel. >=256 sustains
  # thousands of concurrent vers=3 clients doing small-file I/O.
  threads: 256
  # Backing RWO claim mounted at /export in the server pod. Reuse the claim
  # the old subchart created so no data moves. On clusters where that claim
  # already exists (created by the subchart of the same release), Helm adopts
  # ownership during upgrade because name/spec match; on fresh installs this
  # template creates it.
  backingClaim:
    name: "nfs-pvc-data"
    storageClass: "ssd"
    size: "110Gi"
    accessModes:
      - "ReadWriteOnce"
  # Static PV binding the frontend RWX claim (nfs_pvc.*) on FRESH installs,
  # since dynamic provisioning died with the old provisioner's StorageClass
  # machinery. Points at <service DNS>:/export/share. On a cluster whose
  # nfs-pvc is already bound (e.g. the production OpenStack cluster migrated
  # from Ganesha), this PV simply sits Available and unused.
  staticSharePV:
    enabled: true
    path: "/export/share"
  # Service identity. Defaults give a "<release>-nfs-kernel" Service with an
  # auto-allocated ClusterIP (fresh installs use the static-share PV, which
  # points at the Service DNS name). Clusters MIGRATED from Ganesha should
  # instead adopt the legacy Service's exact name + ClusterIP so existing
  # client PVs -- whose spec.nfs.server pins the old VIP and is immutable --
  # keep mounting unchanged; see openstack/values-openstack.yaml.
  service:
    name: ""
    clusterIP: ""
  # Run the server pod in the HOST network namespace, pinned to a specific
  # node, so clients mount <node-IP>:2049 directly with NO kube-proxy/ClusterIP
  # NAT and NO Calico SNAT on the long-lived mount flows.
  #
  # WHY (2026-08-23, live finding): with ~900 mounts behind a ClusterIP,
  # established client TCP flows began silently blackholing mid-write --
  # clients hung in killable-D rpc_wait while the server itself stayed
  # healthy (local mounts full speed) and new flows worked. The SAME
  # signature class had been blamed on Ganesha for months. Both incidents
  # shared one factor: the NAT dataplane, not the NFS daemon. Direct
  # node-IP mounting removes kube-proxy + one Calico NAT hop entirely.
  #
  # When enabling this you MUST also point client PVs at the pinned node's
  # InternalIP (PV sources are immutable -> delete/recreate the PV during a
  # drain window), because the pinned node's identity is now part of the
  # storage contract. If Azimuth ever replaces that node, repeat: update
  # hostNetworkNodeName here, recreate the client PV with the new node IP,
  # force-recycle every nfs-pvc client pod (runbook rule #1).
  hostNetwork: false
  hostNetworkNodeName: ""
  # Digest-pinned gists/nfs-server 2.6.4 (amd64). Used for its nfs-utils
  # binaries only: the chart overrides `command` with its own supervisor
  # script (the stock entrypoint is v4-only/8-thread hardcoded -- unusable
  # here). Self-hostable rebuild: docker/nfs-kernel-server/.
  image: "docker.io/gists/nfs-server@sha256:803f7c863e0479835a4980b8ca39a176b111c086c1477d3be16c94b0e52c9843"
  imagePullPolicy: "IfNotPresent"
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
  # Node-group scheduling role for the server pod ("web" or "worker"); see
  # node_group.* for the label key/value resolution.
  schedulingRole: "web"
  terminationGracePeriodSeconds: 60

nfs-server-provisioner:
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 110Gi
  storageClass:
    allowVolumeExpansion: false
    # NFSv4 is stateful and does not tolerate being fronted by a Service
    # ClusterIP (client callback/lease renewal fails, mounts hang/fail).
    # vers=3 has fixed mountd/nlockmgr/statd/rpcbind ports and is what this
    # provisioner is actually tested against.
    mountOptions:
      - vers=3
      - sync
db:
  name:  "db"
  label: "db"
  username: ""
  password: ""
  container:
    name: "mongo-db"
    image: "mongo:6.0.7"
    resources:
      requests:
        cpu: 1
        memory: "4Gi"
    ports:
      db_port: 27017
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 100Gi
    accessModes:
      - "ReadWriteOnce"

load_balancer:
  name: "ingress-load-balancer"
  # "Cluster" (not "Local") on purpose. With "Local", the OpenStack cloud
  # provider must track every node running a "web" pod as an Octavia LB
  # pool member and re-sync that member list on every node add/remove.
  # On Azimuth/OpenStack clusters with an autoscaled worker node group,
  # node churn (nodes added/removed as analyses start/finish) triggers
  # Octavia member-list PUTs against a rapidly-changing node count, which
  # can exceed Octavia's API timeout ("context deadline exceeded") and
  # leave the LB VIP in a broken state -- observed in production as
  # ECONNREFUSED on the external IP even though the LB, listener, and pool
  # all report ACTIVE/ONLINE. "Cluster" lets kube-proxy route from any
  # node via ClusterIP, decoupling the LB's member set from worker
  # autoscaling entirely. No app code depends on preserved client source
  # IPs (verified: no request.remote_ip/REMOTE_ADDR/X-Forwarded-For usage,
  # no IP-based rate limiting or access control in openstudio-server), and
  # IP allow-listing is enforced upstream by the OpenStack security group
  # on the Octavia VIP/port -- unaffected by this setting either way.
  externalTrafficPolicy: "Cluster"
  label: "web"
  internal: false
  ports:
    http_name: "http"
    http_port: 80
    http_protocol: "TCP"
    # https_name: "https"
    # https_port: 443
    # https_protocol: "TCP"

nfs:
  name: "nfs"

nfs_pvc:
  name: "nfs-pvc"
  accessModes:
    - "ReadWriteMany"
  storage_class: "nfs"
  storage: "100Gi"


redis:
  name: "redis"
  label: "redis"
  password: ""
  # Max concurrent client connections for the redis server (--maxclients).
  # Tune upward for deployments with many worker pods.
  maxclients: 500000
  container:
    name: "redis"
    image: "redis:6.0.9"
    resources:
      requests:
        cpu: 0.25
        memory: "1Gi"
    port: 6379
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 100Gi
    accessModes:
      - "ReadWriteOnce"

redis_svc:
  name: "queue"
  label: "redis"
  port: 6379
  url: ""

rserve:
  name: "rserve"
  label: "rserve"
  container:
    name: "rserve"
    image: "nrel/openstudio-rserve:3.8.0-1"
    resources:
      requests:
        cpu: 1
        memory: "2Gi"

rserve_svc:
  name: "rserve"
  label: "rserve"
  port: 6311

web_background:
  name: "web-background"
  label: "web-background"
  replicas: 1
  number_of_workers: "30"
  container:
    name: "web-background"
    image: "nrel/openstudio-server:3.8.0-1"
    resources:
      requests:
        cpu: 0.25
        memory: "512Mi"

web:
  name: "web"
  label: "web"
  secret_key_value: ""
  # passenger_max_request_queue_size: "1600"
  # Use this formula (1024 * memory of web pod in Gi * 0.75) / memory per passenger process
  # passenger_max_pool_size: "21"
  # This value is typically between 150 and 400, find this by ssh into web pod and doing `passenger-status`
  #
  # Planning denominator for the MAX_POOL formula rendered into
  # templates/web/web-deploy.yaml:
  #   MAX_POOL = ceil( mem_request_Gi * 1024 * 0.75 / passenger_memory_per_process )
  #
  # 2026-08-24 recalibration after the batch6647 result-file upload storm
  # (web UI returned "under heavy load (queue full)"): the old value (250)
  # assumed processes stay at fresh-boot size. Measured under production
  # load (`passenger-memory-stats` inside the live pod): HOT processes sit
  # at ~970MB-1.4GB private RSS -- they grow quickly once serving
  # /data_points/*/upload_file traffic and keep creeping upward without a
  # recycling cap (Ruby heap fragmentation). 512 is the expected AVERAGE
  # across a storm-time pool, which mixes hot (~1GiB) and idle (~250MiB)
  # processes, ASSUMING passenger_max_requests recycling (below) is active.
  #
  # SIZING CHAIN (keep these three consistent when retuning):
  #   1. target_pool * this value / 0.75  <= web memory REQUEST
  #   2. target_pool * 1GiB + ~8GiB overhead <= web memory LIMIT
  #   3. MAX_REQUESTS already tracks worker_hpa.maxReplicas (queue depth);
  #      pool size is the drain-rate half of that pair -- do not shrink it
  #      below roughly max concurrent uploads you want served.
  # Worked example: pool 180 @ 120Gi request / 192Gi limit
  # (openstack/values-openstack.yaml).
  passenger_memory_per_process: 512
  # Recycle each Passenger app process after this many requests. Without
  # it, long-lived Ruby processes accumulate RSS until they invalidate the
  # memory-based MAX_POOL math above (observed 1.4GB/process during the
  # 2026-08-24 storm). Recycling bounds lifetime growth near the hot
  # working set (~1GiB). Cost is an occasional process respawn (seconds);
  # during the storm the busiest process served ~6300 requests over ~2.6h,
  # i.e. ~6 recycles/hour/process at 1000 -- amortized noise. Injected
  # into nginx.conf by templates/web/web-deploy.yaml at pod start.
  passenger_max_requests: 1000
  initContainer:
    # Used by init-wait-for-db to wait for MongoDB to accept connections.
    # Generic public Docker Hub reference (provider-agnostic default);
    # override per-provider (e.g. aws/values-aws.yaml) to pull from a
    # private registry/ECR if Docker Hub isn't reachable/desired.
    image: "alpine:3.19"
  container:
    name: "web"
    image: "nrel/openstudio-server:3.8.0-1"
    resources:
      requests:
        cpu: 1
        # Raised from 2Gi (2026-08-24) alongside the passenger_memory_per_process
        # recalibration (250 -> 512): at 2Gi the corrected formula yields a
        # MAX_POOL of 3, vs. 15 here -- keeps bare/default installs in the same
        # usable ballpark they had before (~7 processes). Real deployments
        # override this (aws / openstack values).
        memory: "10Gi"
    port:
     http: 80
     https: 443

# Web HPA (Horizontal Pod Autoscaler)
# Disabled by default — web scaling requires a distributed file locking
# scheme (e.g. https://github.com/antirez/redlock-rbs) because NFS sync
# alone cannot guarantee file locking across multiple web clients.
web_hpa:
  enabled: false
  name: "web"
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50

web_svc:
  name: "web"
  label: "web"
  ports:
    http: 80
    https: 443

worker:
  name: "worker"
  label: "worker"
  # Fixed replica count used ONLY when worker_hpa.enabled is false (see below).
  # When the HPA is enabled the Deployment omits `replicas` entirely so the
  # HPA remains the sole owner of the count.
  replicas: 2
  container:
    name: "worker"
    image: "nrel/openstudio-server:3.8.0-1"
    resources:
      requests:
        cpu: 700m
        memory: "900Mi"
    terminationGracePeriodSeconds: 60
    # Cap for worker scratch space under /mnt/openstudio (emptyDir, backed
    # by the node's local disk). Without a cap, one worker writing more
    # than expected can fill the node's disk and trigger DiskPressure
    # eviction of every pod on that node, not just the offending one.
    # Leave empty ("") for no limit (original behavior). Example: "8Gi".
    emptyDirSizeLimit: ""

worker_hpa:
  # Default true so all providers keep today's behavior (HPA manages worker
  # scaling). Providers with flat-cost infrastructure that prefer a fixed
  # pool can set enabled: false and size worker.replicas instead — e.g.
  # openstack/values-openstack.yaml, where compute is uncharged and the HPA
  # added failure modes (boot-burst runaway, zero-metrics deadlock, helm
  # field conflicts) without ever being the thing that made runs faster.
  enabled: true
  name: "worker"
  minReplicas: 2
  maxReplicas: 10000
  targetCPUUtilizationPercentage: 40
  # Stabilization window for scale-UP (seconds). Prevents a single transient
  # CPU sample above target (pod startup, requeue storm after a scale-down)
  # from driving the HPA to maxReplicas via the scale-up policy before
  # sustained load is confirmed. Defaults to stabilizationWindowSeconds
  # when unset (backwards compatible).
  scaleUpStabilizationWindowSeconds: 120
  # Scale-up burst size, in pods per periodSeconds=60.
  scalePolicyValue: 1500
  # Optional Percent policy for scale-up (e.g., 200 = 200%/min).
  # Enables rapid scale-up for large spikes (e.g., 500 -> 1500 pods).
  # Set to 0 or omit to disable.
  scaleUpPercentPolicyValue: 200
  # Optional separate cap for scaleDown, in pods per periodSeconds=60.
  # Defaults to scalePolicyValue (original behavior: scale-up and scale-down
  # share the same burst size) when unset. Scale-down bursts of hundreds of
  # simultaneous pod terminations risk overwhelming a node's container
  # runtime kill pathway if many land on the same node at once; set this
  # lower than scalePolicyValue to throttle scale-down specifically without
  # slowing scale-up responsiveness.
  scaleDownStabilizationWindowSeconds: 160
  # Optional separate cap for scale-down burst size, in pods per periodSeconds=60.
  # Defaults to scalePolicyValue when unset.
  scaleDownPolicyValue: 1000
  
# Cluster Autoscaler configuration
clusterAutoscaler:
  image: "registry.k8s.io/autoscaling/cluster-autoscaler:v1.26.6"
  # Host path for the CA bundle, mounted read-only into the container at
  # /etc/ssl/certs/ca-certificates.crt so the autoscaler can make TLS calls
  # to the cloud provider API.
  #
  # Default matches Debian/Ubuntu (ca-certificates package layout). RHEL/
  # CentOS/Fedora-based nodes use a different path/filename
  # ("/etc/ssl/certs/ca-bundle.crt" via the ca-certificates rpm) -- override
  # this value for those distros. Getting this wrong causes the pod to
  # CrashLoopBackOff with:
  #   "OCI runtime create failed: ... mount ...: not a directory: unknown"
  # (an empty directory gets created+mounted at the source hostPath instead
  # of the expected file when the configured path doesn't exist).
  caCertsHostPath: "/etc/ssl/certs/ca-certificates.crt"

# metrics-server (templates/metrics-server/metrics-server-deploy.yaml).
# See that template's header comment for the one-time Helm-adoption step
# required on clusters where metrics-server was previously hand-applied.
metricsServer:
  image: "registry.k8s.io/metrics-server/metrics-server:v0.9.0"
  # 2026-08-21: raised 1 -> 2. A single replica is a scrape SPOF for the
  # worker HPA at this cluster's scale (thousands of pods) -- see the
  # template's header comment for the full incident context.
  replicas: 2
  metricResolution: "15s"
  # 2026-08-21: raised from the upstream default (100m/200Mi) to give
  # metrics-server headroom to scrape/hold metrics for thousands of pods
  # across dozens of 96-vCPU nodes without falling behind its scrape
  # interval.
  resources:
    requests:
      cpu: 200m
      memory: 500Mi
    limits: {}

# Automated mitigation for a worker pod getting permanently stuck in
# FailedCreatePodSandBox with "failed to assign an IP address to container"
# (aws-cni exhausting its per-node slice of subnet IPs -- see
# docs/subnet-ip-exhaustion-network-request.md for the underlying root
# cause). This is a per-pod sandbox failure, not a node-health condition,
# so cluster-autoscaler never detects or reacts to it on its own. Enabled
# by default since the failure mode can recur in any AZ whenever its
# subnet runs low on free IPs, not just the specific AZs seen so far.
stuckNodeRemediation:
  enabled: true
  # Same image as the pre-delete hook / prewarm DaemonSet's remove-taint
  # container -- must contain both kubectl and a shell (/bin/sh -c).
  image: "bitnami/kubectl:latest"
  # Every 5 minutes: frequent enough to keep the worker HPA converging
  # without meaningfully increasing apiserver load (a handful of `describe
  # pod`/`cordon`/`delete pod` calls per run, only when pods are actually
  # stuck).
  schedule: "*/5 * * * *"
  # A pod must be Pending for at least this long AND show the specific
  # aws-cni IP-exhaustion error before being treated as stuck. Set above
  # normal scheduling/image-pull jitter (a few minutes) to avoid ever
  # cordoning/rescheduling a pod that's just slow-starting for a benign
  # reason.
  stuckPodMinAgeMinutes: 8
  # Generous ceiling for a run against a 10k-replica deployment (mostly
  # `kubectl describe pod` calls, one per Pending pod); real runs finish
  # in well under a minute.
  activeDeadlineSeconds: 300
  # Sized for mass-scale-up churn: mid-ramp at thousands of replicas the
  # cluster-wide `kubectl get events -o json` pass (reason=FailedCreatePodSandBox)
  # can carry tens of MB of JSON -- fresh nodes emit calico sandbox events
  # every ~15-30s per stuck pod until calico/node finishes initializing.
  # History: OOMKilled at 256Mi during the 2026-08-20 incident, then again
  # at 1Gi on 2026-08-22T21:45Z during the 600->9000 ramp prep; 2Gi is
  # sized with headroom over both observed peaks.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
