# Tracked baseline values for openstudio-server.
# Copy and override for your target environment.
# Declare variables to be passed into your templates.

global:
  provider:
    # Required. Set one of: aws, google, azure, openstack.
    # 179D cluster: OpenStack provider on Azimuth
    name: "openstack"
    # Migration compatibility toggle. When true, legacy provider.name can be used
    # only if global.provider.name is unset. Keep false for strict mode.
    allowLegacyName: false
  # Optional storage class defaults used by provider-aware chart logic.
  # For OpenStack, block is used as the backing class for the NFS provisioner PVC.
  storageClasses:
    block: "csi-cinder"
  # Optional node-group scheduling controls.
  # labelKey defaults by provider: openstack => capi.stackhpc.com/node-group, others => nodegroup.
  # web/worker defaults by provider: openstack => web/worker, others => web-group/worker-group.
  # affinityMode: required | preferred | disabled
  # webAffinityMode / workerAffinityMode can override affinityMode per role.
  # defaults by provider: openstack => preferred, others => required
  # optional extra tolerations applied to all role-bound workloads:
  # extraTolerations: []
  # optional role-specific extra tolerations:
  # roleTolerations:
  #   web: []
  #   worker: []
  nodeGroups: {}
    # labelKey: ""
    # web: ""
    # worker: ""
    # affinityMode: ""
    # webAffinityMode: ""
    # workerAffinityMode: ""
  # Optional image pull secrets applied to all workload pod specs.
  # These are merged with serviceAccount.imagePullSecrets (de-duplicated).
  # Leave empty for public Docker Hub images; set only when using a private registry.
  imagePullSecrets: []
  images:
    # Optional registry host[:port] (for example registry.example.org).
    # Keep empty to use public registries.
    registry: ""
    # Optional repository prefix path between registry and org/repo
    # (for example "proxy-cache" -> registry.example.org/proxy-cache/nrel/openstudio-server:tag).
    repositoryPrefix: ""
    org: "nrel"
    serverRepository: "openstudio-server"
    rserveRepository: "openstudio-rserve"
    tag: "3.10.0"

# Optional shared ServiceAccount for chart workloads.
# If create=true, chart creates one and attaches merged image pull secrets.
# If create=false and name is set, workloads use that existing ServiceAccount.
# If both are unset/default, workloads use the namespace default ServiceAccount.
serviceAccount:
  create: true
  name: openstudio-workload
  annotations: {}
  # Strict by default for connected clusters.
  # Set false only for offline/render-only workflows (for example CI helm template jobs).
  validateImagePullSecrets: true
  # Merged with global.imagePullSecrets and propagated to both pod specs and
  # chart-created workload ServiceAccount. Keep credentials in either location.
  imagePullSecrets: []

cluster:
  name: "openstudio-179d"

autoscaler:
  # Defaults to enabled on AWS and disabled on other providers unless explicitly set.
  # 179D: Keep disabled because Azimuth manages cluster autoscaling for this cluster.
  enabled: false
  # Safety guard: when enabled on OpenStack, install/upgrade fails if a pre-existing
  # kube-system/cluster-autoscaler deployment is detected and not owned by this Helm release.
  # For OpenStack, enable autoscaler and provide one or more node groups in min:max:name format.
  # Example:
  # openstackNodeGroups:
  #   - name: web-group
  #     min: 1
  #     max: 5
  #   - name: worker-group
  #     min: 1
  #     max: 50
  # IMPORTANT for 179D cluster: Configure worker and web node groups for batch scaling.
  # Batch scaling reduces node bootstrap time overhead (parallel vs. sequential).
  # Set max based on cluster capacity and cost constraints.
  image:
    repository: "registry.k8s.io/autoscaling/cluster-autoscaler"
    # When empty, defaults to v<cluster-major>.<cluster-minor>.0.
    tag: ""
    pullPolicy: "IfNotPresent"
  openstack:
    # If set, chart mounts this secret and passes --cloud-config=<mountPath>.
    # 179D: Cloud config exists in openstack-system/cloud-config (Azimuth-provided)
    cloudConfigSecretName: "cloud-config"
    cloudConfigSecretKey: "cloud.conf"
    cloudConfigMountPath: "/etc/kubernetes/cloud.conf"
    # Optional custom CA bundle for private OpenStack API endpoints.
    # When set, chart mounts this secret key and sets SSL_CERT_FILE for autoscaler.
    caBundleSecretName: ""
    caBundleSecretKey: "ca.crt"
    caBundleMountPath: "/etc/ssl/certs/openstack-ca.crt"
    # Safety guard for OpenStack installs. When true, chart checks for a pre-existing
    # kube-system/cluster-autoscaler deployment and fails if it's not owned by this release.
    # Set false only when release-time RBAC cannot read kube-system deployments.
    checkExistingDeploymentOwnership: true
  # openstackNodeGroups:
  #   - name: "openstudio-179d-worker"
  #     min: 1
  #     max: 60
  # Keep empty when using Azimuth autoscaler.
  openstackNodeGroups: []
  # Autoscaler expander strategy: least-waste | most-pods | random | priority
  expander: "priority"
  # Optional priority expander config map content.
  # Enable when using multiple worker node groups and you want deterministic burst ordering.
  # priorityExpander:
  #   enabled: true
  #   config: |
  #     50:
  #       - .*worker-on-demand.*
  #     10:
  #       - .*worker-spot.*
  extraArgs:
    - "--scale-down-enabled=false"           # Skip scale-down during high-load periods
    - "--scale-down-delay-after-add=30m"     # Avoid churn while large batches are still arriving
    - "--max-node-provision-time=20m"        # Allow slower cloud boots without stalling scale-up logic
    - "--max-total-unready-percentage=70"    # Tolerate high bootstrap concurrency
    - "--ok-total-unready-count=60"          # Absolute unready allowance during burst scale
    - "--new-pod-scale-up-delay=10s"         # React quickly to newly pending worker pods

priorityClasses:
  enabled: true
  create: true
  highName: "high-priority"
  lowName: "low-priority"

secrets:
  # Primary path: use an externally managed secret by name.
  # If set, chart will not create a secret from db/redis/web values.
  existingSecret: "openstudio-app-secrets"
  # Strict by default for connected clusters.
  # Set false only for offline/render-only workflows (for example CI helm template jobs).
  validateExistingSecret: true
  # Create a secret from db.username/db.password/redis.password/web.secret_key_value.
  # Alternate path. Must be false when existingSecret is set.
  create: false
  # Optional override for chart-managed secret name.
  nameOverride: ""
  keys:
    dbUsername: "db-username"
    dbPassword: "db-password"
    redisPassword: "redis-password"
    webSecret: "web-secret-key"

# NFS Server Provisioner
nfs-server-provisioner:
  persistence:
    enabled: true
    # Backend storage for the in-cluster NFS server (nfs-pvc-data).
    # Keep nfs_pvc.storage below this value to avoid NFS provisioning failures.
    # OpenStack preflight (required): ensure this + db.persistence.size +
    # redis.persistence.size + existing Cinder usage remains below your quota.
    # 3900Gi (this) + 192Gi (db) + 96Gi (redis) = 4188Gi total.
    size: 3900Gi
    # Explicitly pin OpenStack backend class to avoid drift on upgrades.
    storageClass: "csi-cinder"
  # Pull from Docker Hub by default; override in env-specific values files when needed.
  image:
    repository: "quay.io/kubernetes_incubator/nfs-provisioner"
    tag: "v2.3.0"
  storageClass:
    allowVolumeExpansion: true  # Enable expansion for future growth
    mountOptions:
      - vers=4

# Database - Enhanced for production
db:
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  # Required when secrets.create=true.
  username: ""
  password: ""
  container:
    image: "library/mongo@sha256:a40f777b87a077a8a4801368aa17629e575413d6567872492135e26692499905"
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 4          # Large-template sizing for high job throughput
        memory: "22Gi"  # Large-template sizing for larger queue/concurrency spikes
      limits:
        cpu: 8          # 2x request: burst headroom for index builds/compaction
        memory: "44Gi"  # 2x request: caps WiredTiger's cgroup-aware cache sizing (was unbounded --
                        # observed growing to 156Gi/half of node RAM with no limit set) while still
                        # giving mongod ~(limit-1Gi)*0.5 ~= 21Gi of cache, matching the "large-template" intent.
  persistence:
    # Keep MongoDB on block storage. NFS is unsafe for WiredTiger in this cluster.
    storageClass: "csi-cinder"
    size: 192Gi

ingress:
  # Single external exposure path for web traffic.
  enabled: true
  name: "web-external-ingress"
  className: "nginx"
  host: ""
  path: "/"
  pathType: "Prefix"
  servicePort: 80
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  tls: []

nfs_pvc:
  storageClass: "nfs"
  # Frontend shared RWX claim consumed by web/rserve/background pods.
  # Keep this below nfs-server-provisioner.persistence.size (recommended 85-95%).
  storage: "3500Gi"

# Redis - Enhanced for production at scale (10k+ workers)
redis:
  # Required when secrets.create=true.
  password: ""
  # Optional explicit Redis URI. When set, templates use this value for REDIS_URL.
  # Use this if credentials include URI-reserved characters.
  url: ""
  # Optional explicit node selector override for Redis pods.
  nodeSelector: {}
  config:
    # Increase this when running very large worker/background fleets to avoid
    # Redis::CommandError ERR max number of clients reached.
    # Formula: worker_hpa.maxReplicas + (web_background.replicas × web_background.workerCount) + 20% headroom
    maxclients: 50000
    tcpBacklog: 511
    timeoutSeconds: 0
    # Bounds Redis's own memory usage so it self-manages before the container limit
    # forces a kernel OOM-kill (which would drop every in-flight/unflushed job with no
    # warning). Kept below container.resources.limits.memory (24Gi) to leave headroom
    # for BGREWRITEAOF fork() copy-on-write.
    maxmemory: "14gb"
    # noeviction (not allkeys-lru/-lfu): this Redis instance is the Resque queue's
    # system of record, not a cache. Evicting keys under pressure silently discards
    # queued/in-flight jobs. noeviction instead makes writes fail loudly with an OOM
    # error once maxmemory is hit, surfacing the problem instead of hiding data loss.
    maxmemoryPolicy: "noeviction"
    # Persistence tuning for high-throughput workloads.
    # "everysec" balances durability with performance; "no" for pure throughput at risk of data loss.
    appendfsync: "everysec"
    # Disable automatic RDB saves during high-load periods to avoid fork() latency spikes.
    # RDB snapshots should be triggered during maintenance windows or via Redis replication.
    save: ""
  # Redis HA mode: "standalone" | "sentinel"
  # standalone: single Redis pod (current default)
  # sentinel: 3-pod Redis Sentinel with 1 primary + 2 replicas (requires sentinel config below)
  ha:
    mode: "standalone"
    sentinel:
      # Number of Sentinel pods (typically 3 for quorum).
      replicas: 3
      # Sentinel quorum count for failover (ceil(replicas/2) = 2 for 3 replicas).
      quorum: 2
      # Failover timeout in milliseconds.
      failoverTimeoutMs: 60000
      # Parallel syncs during failover.
      parallelSyncs: 1
      # Container resources for sentinel sidecar.
      container:
        image: "library/redis@sha256:94fb31b765189935ffd5f0503ce496bee4404499cbcfa7f8d67020bfbed2a345"
        resources:
          requests:
            cpu: 500m
            memory: "512Mi"
  container:
    image: "library/redis@sha256:94fb31b765189935ffd5f0503ce496bee4404499cbcfa7f8d67020bfbed2a345"
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 8          # 2.7x increase: handle 50k connections + AOF + replication
        memory: "16Gi"  # 4x increase: larger queue buffers, in-flight job payloads
      limits:
        cpu: 16         # 2x request: burst headroom for AOF rewrite/fork
        memory: "24Gi"  # 1.5x request: room for BGREWRITEAOF fork() COW without OOM
  persistence:
    # Keep Redis on block storage; reserve NFS for shared artifacts only.
    storageClass: "csi-cinder"
    size: 96Gi

# RServe - Enhanced for production
rserve:
  number_of_workers: "2"  # Increased from 1 for better R processing
  # Optional explicit node selector override for Rserve pods.
  nodeSelector: {}
  container:
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 2          # Increased from 1 for better R performance
        memory: "4Gi"   # Increased from 2Gi for larger R workloads
      limits:
        cpu: 4          # 2x request: burst headroom for concurrent R analysis jobs
        memory: "8Gi"   # 2x request: burst headroom without masking a real leak
    # Keep short but non-zero to allow in-flight requests to drain before kubelet kill.
    terminationGracePeriodSeconds: 90
    preStop:
      enabled: true
      sleepSeconds: 10

rserve_svc:
  {}

# Web Background - Enhanced for production at scale (B5: Pipeline throughput)
web_background:
  replicas: 1
  # Number of Resque child workers per web-background pod (COUNT env).
  # Higher workerCount per pod reduces total pod count for the background layer.
  workerCount: 12       # 2x increase: more workers per pod for job creation throughput
  # Optional explicit node selector override for web-background pods.
  nodeSelector: {}
  container:
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 1          # right-sized for horizontal scaling; avoids scheduler request bottlenecks
        memory: "4Gi"   # tuned from observed ~3-4Gi usage with headroom
      limits:
        cpu: 4          # burst headroom above steady-state request
        memory: "8Gi"   # cap to protect nodes while allowing transient spikes
    startup:
      maxRetries: 12
      retryDelaySeconds: 10

# Web - Enhanced for production with proper passenger configuration
web:
  replicas: 1
  # Required when secrets.create=true.
  secret_key_value: ""
  # Use this formula (1024 * memory of web pod in Gi * 0.75) / memory per passenger process
  passenger_memory_per_process: 250          # Keep existing optimized value
  # Optional explicit node selector override for web pods.
  nodeSelector: {}
  initContainer:
    # Optional override for init-wait-for-db image. Defaults to openstudio server image.
    image: ""
    # Optional override. If empty, uses provider-aware default (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "IfNotPresent"
    waitForDb:
      # Number of TCP connect attempts made by the init-wait-for-db container.
      maxAttempts: 300
      # Delay between DB connect attempts.
      retryDelaySeconds: 3
  strategy:
    # Keep web rollouts conservative while DB availability is recovering.
    maxSurge: 1
    maxUnavailable: 0
    # Surface rollout stalls quickly if init-wait-for-db is repeatedly timing out.
    progressDeadlineSeconds: 1800
    # Reduce endpoint flapping during rollout by requiring brief readiness soak.
    minReadySeconds: 15
  runtimeOverrides:
    # Optional runtime monkey-patch initializers for:
    # - seed_zip start guards (prevent zero-datapoint runs from missing uploads)
    # - safe requeue behavior
    # Keep disabled unless this override is explicitly required.
    enabled: false
  container:
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 6
        memory: "50Gi"
      limits:
        cpu: 12         # 2x request: burst headroom for concurrent request spikes
        memory: "60Gi"  # Sized above the MAX_POOL formula's target working set
                        # ((requests.memory×1024×0.75)/passenger_memory_per_process ~= 37.5Gi
                        # at a fully-saturated 154-process pool), leaving headroom for Rails/
                        # Passenger boot overhead beyond the per-process budget.

# Web HPA - Configured for production scaling
# web_hpa:
#   minReplicas: 1
#   maxReplicas: 1
#   targetCPUUtilizationPercentage: 70  # Slightly higher threshold for stability
#   # Note: Distributed file locking still needed for >1 replica

web_svc:
  {}

# Web HPA - baseline values for chart rendering.
web_hpa:
  enabled: false
  name: "web"
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50
  # stabilizationWindowSeconds controls how long to wait before scaling down.
  stabilizationWindowSeconds: 600
  # Distributed file locking: required when maxReplicas > 1.
  # Set to true after validating Redis-based locking (redlock-rb) in your environment.
  distributedLocking:
    enabled: false
    # Backend type: "redis" (default), "nfs" (not recommended)
    backend: "redis"
    # Redis key prefix for lock resources
    keyPrefix: "os-web-lock"

# Web-background autoscaling mode:
# - hpa: memory-based HPA (default)
# - keda: Redis queue-depth-based autoscaling (recommended when analyses backlog is primary driver)
web_background_autoscaling:
  mode: "hpa"
  keda:
    pollingIntervalSeconds: 15
    cooldownPeriodSeconds: 300
    queueNames:
      - analyses
    # jobs per web-background pod target
    queueLengthPerPod: 12
    # do not scale from floor until queue has this many jobs
    activationQueueLength: 3
    # optional explicit Redis address override
    redisAddress: ""
    fallback:
      failureThreshold: 3
      replicas: 3
    advanced:
      restoreToOriginalReplicaCount: false

# Web-background HPA (used when web_background_autoscaling.mode=hpa)
web_background_hpa:
  enabled: false
  name: "web-background"
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: 60
  stabilizationWindowSeconds: 300

# Worker - Enhanced for production at scale
worker:
  queues: "simulations,requeued"
  podAnnotations: {}
  # Optional explicit node selector override for worker pods.
  nodeSelector: {}
  # Worker pod topology spread controls.
  # Enable to distribute pods across nodes and reduce single-node concentration.
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: "kubernetes.io/hostname"
    whenUnsatisfiable: "ScheduleAnyway"
    # Optional: minimum number of eligible domains required for spreading.
    # Set to 2+ once 2+ worker nodes exist to guarantee skew enforcement.
    minDomains: null
    # Optional policies for honoring node affinity and taints during spread.
    nodeAffinityPolicy: "Honor"
    nodeTaintsPolicy: "Ignore"
  # PodDisruptionBudget: ensure minimum available workers during voluntary disruptions.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Anti-affinity: prefer spreading workers across different nodes.
  # Reduces blast radius during node failures and distributes NFS/Redis connection load.
  antiAffinity:
    type: "preferred"        # "required" or "preferred"
    topologyKey: "kubernetes.io/hostname"
  # Rolling update strategy for the worker Deployment.
  # WARNING: Default maxSurge=1/maxUnavailable=0 is safe for graceful rolling updates
  # but is prohibitively slow at large pod counts (e.g. 7500 workers ≈ 63-hour rollout).
  # For emergency restart of hung workers at scale, use the KEDA-pause procedure:
  #   1. Annotate ScaledObject: autoscaling.keda.sh/paused=true
  #   2. kubectl scale deploy/worker --replicas=0
  #   3. Force-delete any Terminating pods
  #   4. kubectl scale deploy/worker --replicas=N (fresh pods)
  #   5. Remove paused annotation
  # For intentional large-scale rollouts, increase maxUnavailable temporarily
  # (e.g. 500 or "10%"), but only when the queue is empty to avoid DirtyExit accumulation.
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  # Resque job execution limits.
  resque:
    # Wall-clock timeout (seconds) for a single simulation job subprocess.
    # When > 0, a pod liveness probe kills the worker if openstudio has been running
    # longer than this value, allowing KEDA to schedule a fresh replacement.
    # Recommended for production: 14400 (4 hours). 0 = disabled (no timeout).
    jobTimeoutSeconds: 0
    # Stale analysis_zip.lock janitor. Fixes a real deadlock: initialize_worker (in the
    # Rails app) has each worker download+extract analysis.zip once per (pod, analysis)
    # under a local flock, then write analysis_zip.receipt so later datapoints for the
    # same analysis on the same pod skip straight through. If the downloading process
    # dies mid-extract (OOM, node eviction, forced pod termination) before writing the
    # receipt, the lock FILE is orphaned -- the kernel releases the flock itself, but
    # nobody deletes the file -- and every future datapoint for that analysis dispatched
    # to this pod polls "waiting for receipt file to appear" every 3s, for up to
    # analysis.initialize_worker_timeout (defaults to 28800s/8h), holding a worker slot
    # the whole time. This does NOT unstick a datapoint already wedged in that poll loop
    # (it never re-checks the lock); it only prevents the SAME dead lock from wedging the
    # NEXT datapoint dispatched to this pod for that analysis, by proving via non-blocking
    # flock -n (kernel-authoritative: never true while any process actually holds the
    # lock) that no live holder remains, then deleting the file so the next arrival
    # re-downloads and writes a fresh receipt.
    #
    # receiptWaitTimeoutSeconds closes the other half of this gap: it does NOT prevent
    # the race, it self-heals a datapoint ALREADY wedged in the poll loop above. When > 0
    # (and container.livenessProbe.enabled is true), the liveness probe additionally scans
    # for resque children that have been "Processing ... [ResqueJobs::RunSimulateDataPoint]"
    # longer than this many seconds with NO openstudio subprocess as a child (the signature
    # of this exact deadlock -- a real simulation always forks openstudio within seconds)
    # and kills only that child process. Resque's own worker supervisor detects the
    # resulting DirtyExit and re-forks immediately to pick up a new job; the existing
    # transient-failure-replayer CronJob requeues the aborted datapoint automatically.
    # This never restarts the pod (unlike jobTimeoutSeconds above) and never touches a
    # datapoint that is genuinely still running. Recommended: 2400 (40min) -- real
    # datapoints observed forking openstudio well under this; 0 = disabled.
    # See "Wedged Worker Drain Playbook" in README.md for the manual/backfill equivalent
    # (scripts/openstudio-worker-drain), which uses the same detection heuristic.
    receiptWaitTimeoutSeconds: 0
    lockJanitor:
      enabled: false
      # How often to sweep /mnt/openstudio for orphaned locks.
      intervalSeconds: 60
      # Skip locks younger than this even if flock -n says free; pure defense-in-depth
      # against the sub-millisecond window between a writer opening the lock file and
      # acquiring flock on it. flock -n itself is what actually proves "no live holder".
      minAgeSeconds: 120
  container:
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "IfNotPresent"
    resources:
      requests:
        cpu: 400m      # Reduced from 600m: allows ~2 workers per 1-core slice (better density)
        memory: "512Mi"  # Right-sized 2026-07-07: observed actual RSS 230-412Mi across 8493 running pods (avg ~253Mi); 1Gi request was 3-4x actual usage, capping nodes at 78 pods/node on memory before CPU (400m request -> ~155 pods/node ceiling) became binding. 512Mi matches the CPU-bound ceiling almost exactly (80313Mi allocatable / 512Mi ~= 156 pods/node), roughly doubling schedulable worker density with no CPU waste. 2Gi limit unchanged -- burst/OOM safety valve untouched.
      limits:
        cpu: 500m         # Cap burst to prevent CPU starvation of other pods on node
        memory: "1200Mi"  # Hard limit to prevent OOM on node; OOMKill single pod instead of node
    # Optional cap for worker scratch space under /mnt/openstudio (EmptyDir).
    # Keep unset for no per-pod cap; set (for example "8Gi") to prevent single-pod disk runaway.
    emptyDirSizeLimit: ""
    terminationGracePeriodSeconds: 660  # Keep above preStop maxWait+TERM grace to avoid hook truncation
    startup:
      maxRetries: 12
      retryDelaySeconds: 10
    preStop:
      enabled: true
      signal: "3"              # SIGQUIT: Resque gracefully finishes current job
      pollIntervalSeconds: 10  # Reduced from 30: faster detection of job completion
      maxWaitSeconds: 600      # Reduced from 5100: 10 min max drain (was 85 min)
      fastTerminateSeconds: 120 # Fast-terminate bias: bounded graceful attempt before deterministic fallback
      forceTerminateGraceSeconds: 20 # Wait after TERM before optional KILL fallback
      forceKillEnabled: true # If true, send KILL when TERM fallback still leaves worker processes
    # Two independent checks, gated on worker.resque.jobTimeoutSeconds and
    # worker.resque.receiptWaitTimeoutSeconds respectively (either one > 0 activates this
    # probe): (1) restarts the pod when an openstudio simulation subprocess has run longer
    # than jobTimeoutSeconds; (2) self-heals (kills the wedged child, no pod restart) a
    # resque worker stuck in the analysis_zip receipt-wait deadlock longer than
    # receiptWaitTimeoutSeconds. Both default to 0 (disabled). Enable in production to
    # auto-recover hung workers.
    livenessProbe:
      enabled: false
      # How often to run the check. Keep ≥ the expected job startup time to avoid false positives.
      periodSeconds: 300
      # Delay before first probe. Give the worker time to start and pick up its first job.
      initialDelaySeconds: 300
      # Consecutive failures before restart. 1 is appropriate: the elapsed-time check is already conservative.
      failureThreshold: 1
      # Time to wait for the probe command to complete.
      timeoutSeconds: 10

# Worker HPA - Optimized for production workloads with aggressive scale-up
worker_hpa:
  minReplicas: 2
  maxReplicas: 12500
  targetCPUUtilizationPercentage: 50
  stabilizationWindowSeconds: 600
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 10
      selectPolicy: Max
      # Default remains aggressive for backward compatibility.
      policies:
        - type: Pods
          value: 32
          periodSeconds: 15
        - type: Percent
          value: 200
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 1800
      selectPolicy: Max
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

# Worker autoscaling mode:
# - hpa: Kubernetes HPA on CPU only (default, simpler but slower to react)
# - keda-hybrid: KEDA ScaledObject using queue depth + CPU (recommended for 10k+ scale)
#   Benefits: faster scale-up on queue build-up, scale-down on queue drain, CPU as safety net
worker_autoscaling:
  mode: "keda-hybrid"
  keda:
    # Poll Redis every 10s for queue depth changes
    pollingIntervalSeconds: 10
    # Wait 5 minutes before scaling down after queue is empty
    cooldownPeriodSeconds: 1800
    # Redis address for KEDA to query queue lengths
    redisAddress: ""
    # Queues to monitor for scaling decisions
    queueNames:
      - simulations
      - requeued
    # Scale up 1 worker per job in queue
    queueLengthPerWorker: 1
    # Don't scale until at least 1 job is queued
    activationQueueLength: 1
    # CPU trigger as safety net (uses same target as HPA)
    enableCpuTrigger: false
    # Fallback if KEDA cannot reach Redis
    fallback:
      failureThreshold: 3
      replicas: 16
    advanced:
      restoreToOriginalReplicaCount: false
    # Optional KEDA external scaler integration for readiness-gated scale-up control.
    # When enabled, queue triggers move from built-in Redis triggers to a custom
    # external scaler service you provide.
    externalScaler:
      enabled: false
      # Optional queue list override for the external scaler. Defaults to keda.queueNames.
      queueNames: []
      # Optional Redis address override for the external scaler. Defaults to keda.redisAddress.
      redisAddress: ""
      service:
        name: "worker-external-scaler"
        port: 9090
      deployment:
        replicas: 1
        # Required when externalScaler.enabled=true.
        image: ""
        imagePullPolicy: "IfNotPresent"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        # Optional extra env vars for your external scaler image.
        extraEnv: []
        # Optional node selector override for the external scaler pod.
        nodeSelector: {}
      serviceAccount:
        create: true
        name: ""
      rbac:
        create: true
      metrics:
        # Trigger metric name reported to KEDA/HPA by the external scaler.
        name: "worker_queue_pressure"
        # Defaults only; your scaler can override internally.
        targetValue: "1"
        activationTargetValue: "1"
      gating:
        # Ready-replica percentage gate for allowing additional scale-up.
        minReadyPercent: 95
        # Optional per-step scale-up ceilings exposed to the scaler.
        maxScaleStepPods: 32
        maxScaleStepPercent: 200

    # For degraded infrastructure periods (registry/auth/network/control-plane
    # instability), apply a safer tuning overlay, for example:
    # helm upgrade --install ... -f openstudio-server/values.yaml -f openstudio-server/values.degraded-infra.yaml

hooks:
  preDeleteCleanup:
    enabled: true
    # Optional explicit image for pre-delete cleanup job. Set to an internal mirror
    # to avoid external registry pulls during uninstall/cleanup.
    image: "docker.io/bitnami/kubectl:1.31"
    # Optional explicit pull policy override. If empty, uses provider-aware default
    # (openstack=IfNotPresent, others=Always).
    imagePullPolicy: "IfNotPresent"

prepull:
  # Image warmup DaemonSet for scale-up/upgrade events.
  # Keep disabled by default; enable temporarily during planned warm-up windows.
  enabled: false
  # Restrict prepull to worker nodes where it's needed most.
  role: "worker"
  # Optional explicit pull policy override. If empty, uses provider-aware default
  # (openstack=IfNotPresent, others=Always).
  imagePullPolicy: "IfNotPresent"
  # Tiny bootstrap image used by the warmup DaemonSet itself.
  # The pod then pre-pulls the target workload images from the node host runtime.
  utilityImage: "registry.k8s.io/e2e-test-images/busybox:1.29-2"
  utilityImagePullPolicy: "IfNotPresent"
  # Spread node warm-up pulls across time to avoid a registry stampede.
  # Increased from 300s to spread over 10 min for larger node batches.
  spreadSeconds: 600
  # Warm mode:
  # - once: perform one pull cycle, then hold pod in Running state.
  # - continuous: run pull cycles continuously with intervalSeconds pauses.
  warmMode: "once"
  # Pull cycle interval used only when warmMode=continuous.
  intervalSeconds: 1800
  # If true, pod exits non-zero when any pull in a cycle fails.
  # This makes failures obvious via CrashLoopBackOff/NotReady state.
  failOnAnyPullError: false
  includeRserve: false
  includeWebInit: false
  # Optional additional images to warm on each node (for example sidecars or infra tools)
  additionalImages: []
  # Optional explicit node selector override for prepull pods.
  nodeSelector: {}

hostAliases:
  # Optional pod-level /etc/hosts fallbacks for registry hostnames.
  # Useful when node-level host patching is partially healthy or DNS is flaky.
  enabled: false
  entries: []
  # - ip: "10.60.127.127"
  #   hostnames:
  #     - "pulp-dev.hpc.nlr.gov"
  #     - "pulp-dev.hpc.nrel.gov"

registryHostsPatch:
  # Optional node-level /etc/hosts patch for private registry DNS workarounds.
  # Keep disabled by default; enable only for environments that require it.
  enabled: false
  hostname: "registry.example.org"
  additionalHostnames: []
  address: "10.0.0.10"
  # Keep this image on a registry that is reachable without private DNS overrides.
  initImage: "registry.k8s.io/e2e-test-images/busybox:1.29-2"
  initImagePullPolicy: "IfNotPresent"
  pauseImage: "registry.k8s.io/pause:3.10.1"
  pauseImagePullPolicy: "IfNotPresent"
  # Optional explicit node selector for the patch DaemonSet.
  nodeSelector: {}
