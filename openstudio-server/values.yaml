# Default values for openstudio-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# Set to google, aws, azure, or openstack
provider:
  name: "aws"

cluster:
  name: "openstudio-server-03"

cluster_autoscaler:
  expander: "least-waste"
  scanInterval: "10s"
  maxNodeProvisionTime: "3m"
  scaleDownUtilizationThreshold: "0.2"
  scaleDownUnneededTime: "10m"
  maxGracefulTerminationSec: "120"
  scaleDownDelayAfterFailure: "5m"

nfs-server-provisioner:
  service:
    # Fixed ClusterIP used by RWX mount option `addr=` for Bottlerocket NFS mounts.
    clusterIP: "10.100.148.127"
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 2Ti
  storageClass:
    allowVolumeExpansion: true
    mountOptions:
      - vers=4
      - addr=10.100.148.127
  resources:
    requests:
      cpu: 4
      memory: "8Gi"
    limits:
      cpu: 8
      memory: "16Gi"
db:
  name:  "db"
  label: "db"
  username: "openstudio"
  password: "openstudio"
  container:
    name: "mongo-db"
    image: "554977624503.dkr.ecr.us-west-2.amazonaws.com/ecr-public/docker/library/mongo:6.0.7"
    resources:
      requests:
        cpu: 2
        memory: "8Gi"
      limits:
        cpu: 4
        memory: "12Gi"
    ports:
      db_port: 27017
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 500Gi
    accessModes:
      - "ReadWriteOnce"

load_balancer:
  name: "ingress-load-balancer"
  externalTrafficPolicy: "Local"
  label: "web"
  ports:
    http_name: "http"
    http_port: 80
    http_protocol: "TCP"
    https_name: "https"
    https_port: 443
    https_protocol: "TCP"

nfs:
  name: "nfs"

nfs_pvc:
  name: "nfs-pvc"
  accessModes:
    - "ReadWriteMany"
  storageClass: "nfs"
  storage: "500Gi"


redis:
  name: "redis"
  label: "redis"
  password: "openstudio"
  maxclients: 100000
  container:
    name: "redis"
    image: "554977624503.dkr.ecr.us-west-2.amazonaws.com/ecr-public/docker/library/redis:6.0.9"
    resources:
      requests:
        cpu: 2
        memory: "4Gi"
      limits:
        cpu: 4
        memory: "8Gi"
    port: 6379
  persistence:
    enabled: true
    storageClass: "ssd"
    size: 500Gi
    accessModes:
      - "ReadWriteOnce"

redis_svc:
  name: "queue"
  label: "redis"
  port: 6379
  url: "redis://:openstudio@queue:6379"

rserve:
  name: "rserve"
  label: "rserve"
  number_of_workers: "1"
  container:
    name: "rserve"
    image: "554977624503.dkr.ecr.us-west-2.amazonaws.com/openstudio-rserve:3.10.0"
    resources:
      requests:
        cpu: 1
        memory: "2Gi"
      limits:
        cpu: 2
        memory: "4Gi"

rserve_svc:
  name: "rserve"
  label: "rserve"
  port: 6311

web_background:
  name: "web-background"
  label: "web-background"
  replicas:
  queues: "analysis_wrappers,analyses"
  terminationGracePeriodSeconds: 300
  lifecycle:
    preStopSleepSeconds: 20
 1
  container:
    name: "web-background"
    image: "554977624503.dkr.ecr.us-west-2.amazonaws.com/openstudio-server:3.10.0-gzip-optimized"
    resources:
      requests:
        cpu: 2
        memory: "4Gi"
      limits:
        cpu: 4
        memory: "8Gi"


web_background_keda:
  enabled: false
  name: "web-background"
  minReplicas: 1
  maxReplicas: 1
  pollingInterval: 30
  cooldownPeriod: 300
  queueName: "resque:queue:analyses"
  listLength: 25
  activationListLength: 1
  redisAddress: "queue.openstudio-server.svc.cluster.local:6379"

web_background_hpa:
  enabled: false
  name: "web-background"
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 60
  scaleUpStabilizationWindowSeconds: 0
  scaleDownStabilizationWindowSeconds: 300
  scaleUpPolicyValue: 4
  scaleUpPolicyPeriodSeconds: 60
  scaleDownPolicyValue: 1
  scaleDownPolicyPeriodSeconds: 60

web:
  name: "web"
  label: "web"
  secret_key_value: "c4ab6d293e4bf52ee92e8dda6e16dc9b5448d0c5f7908ee40c66736d515f3c29142d905b283d73e5e9cef6b13cd8e38be6fd3b5e25d00f35b259923a86c7c473"
  # Passenger tuning parameters
  passenger_memory_per_process: 250
  passenger_min_instances: 2
  passenger_max_pool_size: 32
  passenger_request_queue_overflow_to_wait_list: "true"
  passenger_max_request_queue_size: 1600
  # Nginx tuning parameters
  nginx_gzip: "on"
  nginx_gzip_comp_level: 6
  nginx_gzip_min_length: 1024
  nginx_client_max_body_size: "100m"
  # Connection timeout for analyses.json download
  nginx_proxy_connect_timeout: "90s"
  nginx_proxy_send_timeout: "300s"
  nginx_proxy_read_timeout: "300s"
  nginx_proxy_buffering: "on"
  nginx_proxy_buffer_size: "32k"
  nginx_proxy_buffers: "8 32k"
  # Health check tuning
  health_check_timeout_analyses: 15
  container:
    name: "web"
    image: "554977624503.dkr.ecr.us-west-2.amazonaws.com/openstudio-server:3.10.0-gzip-optimized"
    resources:
      requests:
        cpu: 8
        memory: "32Gi"
      limits:
        cpu: 12
        memory: "48Gi"
    port:
     http: 80
     https: 443

# For this to work and have more than 1 web pod we'll need to implement
# a distributed file locking scheme such a https://github.com/antirez/redlock-rbs
# as even with using NFS via sync it cannot guarantee file locking using multiple clients
web_hpa:
  name: "web"
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 50

web_svc:
  name: "web"
  label: "web"
  ports:
    http: 80
    https: 443

worker:
  name: "worker"
  label: "worker"
  container:
    name: "worker"
    image: "554977624503.dkr.ecr.us-west-2.amazonaws.com/openstudio-server:3.10.0"
    resources:
      requests:
        cpu: 600m
        memory: "1Gi"
      limits:
        cpu: 800m
        memory: "2Gi"
    terminationGracePeriodSeconds: 180

worker_hpa:
  name: "worker"
  minReplicas: 2
  maxReplicas: 15000
  targetCPUUtilizationPercentage: 35
  scaleUpStabilizationWindowSeconds: 0
  scaleDownStabilizationWindowSeconds: 600
  scaleUpPolicyValue: 500
  scaleUpPolicyPeriodSeconds: 60
  scaleDownPolicyValue: 25
  scaleDownPolicyPeriodSeconds: 60

s3_exporter:
  enabled: false
  schedule: "*/5 * * * *"
  bucket: ""
  prefix: ""
  apiBaseUrl: "http://web"
  nfsRoot: "/mnt/openstudio"
  includeEnrichArtifacts: false
  awsCliImage: "public.ecr.aws/aws-cli/aws-cli:2.17.49"
  concurrencyPolicy: "Forbid"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 1800
  storageClass: ""
  includePatterns:
    - "manifest/*"
    - "csv/*"
  excludePatterns: []
  serviceAccount:
    create: true
    name: "s3-sync-sa"
    roleArn: ""
    annotations: {}
  resources:
    collector:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    uploader:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
