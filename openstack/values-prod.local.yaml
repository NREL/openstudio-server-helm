# Local OpenStack production overrides.

global:
  provider:
    name: "openstack"
  # Optional internal registry/mirror overrides.
  # images:
  #   registry: "registry.example.org"
  #   repositoryPrefix: "proxy-cache"
  #   org: "nrel"
  #   serverRepository: "openstudio-server"
  #   rserveRepository: "openstudio-rserve"
  #   tag: "3.10.0"
  # imagePullSecrets:
  #   - "registry-credentials"

autoscaler:
  extraArgs: []
  openstackNodeGroups: []

cluster:
  name: openstudio-server-prod

nfs-server-provisioner:
  persistence:
    # OpenStack preflight (required): ensure this + db.persistence.size +
    # redis.persistence.size + existing Cinder usage stays below quota.
    size: 1Ti
  # Use Quay-hosted image to avoid docker.io mirror auth failures on managed clusters.
  image:
    repository: "quay.io/kubernetes_incubator/nfs-provisioner"
    tag: "v2.3.0"
  storageClass:
    allowVolumeExpansion: true
    mountOptions:
      - vers=4

nfs_pvc:
  # Keep 85-95% of nfs-server-provisioner.persistence.size.
  storage: 900Gi

db:
  persistence:
    size: 200Gi
    storageClass: csi-cinder

redis:
  persistence:
    size: 200Gi
    storageClass: csi-cinder

web_background:
  replicas: 2

worker_hpa:
  minReplicas: 5
  maxReplicas: 50
  stabilizationWindowSeconds: 1800

# Optional ServiceAccount-based registry auth
# serviceAccount:
#   create: true
#   name: "openstudio-workload"
#   imagePullSecrets:
#     - "registry-credentials"
