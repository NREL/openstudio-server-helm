# OpenStack-only overrides for openstudio-server.
# Keep this file limited to values that differ from openstudio-server/values.yaml.

global:
  provider:
    name: "openstack"
  nodeGroups:
    labelKey: "nodegroup"
    web: "web-group"
    worker: "worker-group"
    affinityMode: "preferred"

nfs-server-provisioner:
  storageClass:
    mountOptions:
      - vers=4
      - sync
  tolerations:
    - key: "nodegroup"
      operator: "Equal"
      value: "web-group"
      effect: "NoSchedule"

db:
  persistence:
    storageClass: "csi-cinder"

redis:
  persistence:
    storageClass: "csi-cinder"

worker_hpa:
  maxReplicas: 10000
