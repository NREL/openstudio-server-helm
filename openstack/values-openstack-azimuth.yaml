# Local overrides for Azimuth-managed cluster: openstudio-server-july1v2

cluster:
  name: "openstudio-server-july1v2"

global:
  images:
    registry: "pulp-dev.hpc.nlr.gov"
    repositoryPrefix: "pulp-container-aurora-179d"
  nodeGroups:
    # Prevent worker pods from spilling onto web nodes.
    workerAffinityMode: "required"
    # Keep all web-role workloads pinned to web nodes.
    webAffinityMode: "required"
    # Web nodes carry taint worker-pods:not-allowed:NoSchedule to keep worker pods off them.
    # Infra pods (db, web, web-background, etc.) use role=web and must tolerate this taint.
    # Without this, any pod using tolerationsForRole(web) fails to schedule after a restart.
    roleTolerations:
      web:
        - key: worker-pods
          operator: Equal
          value: not-allowed
          effect: NoSchedule

serviceAccount: {}

autoscaler:
  # Keep chart-managed autoscaler disabled until ownership strategy is finalized.
  enabled: false
  openstackNodeGroups: []

worker:
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: "kubernetes.io/hostname"
    whenUnsatisfiable: "ScheduleAnyway"
    nodeAffinityPolicy: "Honor"
    nodeTaintsPolicy: "Ignore"
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  # Liveness probe enabled: restarts workers that hang on a simulation for > 4 hours.
  # Root cause: openstudio subprocess hangs indefinitely with no timeout; all worker slots fill
  # up; Resque shows working=true but processed counter is flat — queue appears stalled.
  resque:
    jobTimeoutSeconds: 14400  # 4-hour wall-clock limit per simulation subprocess
  container:
    resources:
      requests:
        cpu: 400m
        memory: 700Mi
      limits:
        cpu: 500m
        memory: 1200Mi
    terminationGracePeriodSeconds: 660
    preStop:
      enabled: true
      signal: "3"
      pollIntervalSeconds: 10
      maxWaitSeconds: 600
      fastTerminateSeconds: 240
      forceTerminateGraceSeconds: 20
      forceKillEnabled: true
    livenessProbe:
      enabled: true
      periodSeconds: 300       # Check every 5 minutes
      initialDelaySeconds: 300 # First check 5 minutes after pod starts
      failureThreshold: 1      # Restart on first failure (timer check is already conservative)
      timeoutSeconds: 10

worker_autoscaling:
  # Sync with live cluster: KEDA ScaledObject deployed (not chart-managed HPA).
  mode: "keda-hybrid"
  keda:
    pollingIntervalSeconds: 20
    cooldownPeriodSeconds: 600
    queueLengthPerWorker: 2
    activationQueueLength: 3
    # Disable CPU trigger to avoid runaway scale from transient CPU spikes.
    enableCpuTrigger: false
    fallback:
      failureThreshold: 6
      replicas: 8

worker_hpa:
  minReplicas: 2
  maxReplicas: 10000
  stabilizationWindowSeconds: 300
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 10
      selectPolicy: Max
      policies:
        - type: Pods
          value: 32
          periodSeconds: 15
        - type: Percent
          value: 200
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 15
          periodSeconds: 60

prepull:
  # Keep enabled to continuously warm worker-node image cache and reduce pull storms.
  enabled: true
  role: "worker"
  warmMode: "continuous"
  intervalSeconds: 1200
  spreadSeconds: 900
  failOnAnyPullError: false

web:
  replicas: 1
  strategy:
    # Keep exactly one web pod during rollouts (no temporary surge replica).
    maxSurge: 0
    maxUnavailable: 1

web_hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1

web_background:
  replicas: 1
  workerCount: 42
  container:
    resources:
      requests:
        cpu: 12
        memory: 12Gi
      limits:
        cpu: 24
        memory: 24Gi

web_background_hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 60
  # Reduce scale-down delay so we don't pay for idle web-background workers.
  stabilizationWindowSeconds: 120

# Cinder quota-fit overrides for this cluster.
nfs-server-provisioner:
  persistence:
    size: 3900Gi
  resources:
    requests:
      cpu: "500m"
      memory: "18Gi"
    limits:
      cpu: "2"
      memory: "28Gi"
  tolerations:
    - key: worker-pods
      operator: Equal
      value: not-allowed
      effect: NoSchedule

nfs_pvc:
  storage: 3500Gi

db:
  persistence:
    size: 192Gi

redis:
  persistence:
    size: 120Gi
